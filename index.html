<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TABIGRAM</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TABIGRAM" />
  <meta name="theme-color" content="#F6F3EC" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- D3-Geo & TopoJSON for Real 3D Orthographic Great Circle Flight Globe -->
  <script src="https://cdn.jsdelivr.net/npm/d3-array@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-geo@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

  <style>
    :root {
      --bg: #F6F3EC;
      --card: #FFFFFF;
      --ink: #191919;
      --sub: #6E6A63;
      --border: #E2DDD3;
      --accent: #C84B31;
      --accent-soft: #F9EBE8;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      padding-bottom: 110px;
      overflow-x: hidden;
    }

    /* Top Header */
    .app-header {
      padding: calc(env(safe-area-inset-top, 16px) + 12px) 16px 10px;
      background: rgba(246, 243, 236, 0.94);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      background: #141413;
      color: #FFFFFF;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
      flex-shrink: 0;
    }

    .brand-title {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--ink);
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .pill-btn {
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }

    .pill-btn.primary {
      background: var(--ink);
      color: #FFFFFF;
      border-color: var(--ink);
    }

    .pill-btn.accent-outline {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: #E8C5BD;
    }

    /* Trip Tabs */
    .trip-tabs-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .trip-tabs-bar::-webkit-scrollbar { display: none; }

    .trip-tab {
      white-space: nowrap;
      padding: 6px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      font-size: 13px;
      font-weight: 700;
      color: var(--sub);
      cursor: pointer;
    }
    .trip-tab.active {
      background: var(--ink);
      color: #FFFFFF;
      border-color: var(--ink);
    }
    .trip-tab.dashed {
      border-style: dashed;
      color: #2B5B84;
    }

    /* Main Container */
    .main-container {
      max-width: 640px;
      margin: 0 auto;
      padding: 14px 16px;
    }

    /* Day & Weather Bar */
    .day-weather-card {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.03);
    }

    .day-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .day-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      align-items: center;
    }

    .day-pill {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      padding: 6px 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--ink);
      cursor: pointer;
      white-space: nowrap;
    }
    .day-pill.active {
      background: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent);
    }

    .weather-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .weather-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      background: #F8F6F0;
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 700;
    }

    .solar-meta {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--sub);
      margin-bottom: 6px;
    }

    .solar-track {
      position: relative;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, #1E293B 0%, #3B82F6 24%, #F59E0B 50%, #EA580C 76%, #1E293B 100%);
      overflow: visible;
    }

    .solar-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 3px solid var(--accent);
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }

    /* Timeline Cards */
    .timeline-card {
      background: #FFFFFF;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.03);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .timeline-card.now-active {
      border-color: var(--accent);
      box-shadow: 0 6px 20px rgba(200, 75, 49, 0.1);
    }
    .timeline-card.done-card {
      opacity: 0.72;
      background: #FAF8F4;
    }
    .timeline-card.cancelled-card {
      opacity: 0.5;
      background: #F3F1EC;
    }

    /* Card Top Row: Number, Time, Mood + Right Action Buttons */
    .card-top-bar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .card-time-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .step-circle {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--ink);
      color: #FFFFFF;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .now-active .step-circle {
      background: var(--accent);
    }

    .now-badge {
      background: var(--accent);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .time-text {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
    }

    .home-tz-sub {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--sub);
      background: #F4F1EA;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .status-btns {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .status-btn {
      border: 1px dashed var(--border);
      background: #FFFFFF;
      color: var(--sub);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .status-btn.active-done {
      border-style: solid;
      border-color: #166534;
      background: #DCFCE7;
      color: #166534;
    }
    .status-btn.active-cancel {
      border-style: solid;
      border-color: #991B1B;
      background: #FEE2E2;
      color: #991B1B;
    }

    /* Full-width Title & Subtitle (Fix #5: Never restricted by right buttons) */
    .card-full-body {
      width: 100%;
      margin-top: 4px;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .card-title {
      font-size: 19px;
      font-weight: 900;
      color: var(--ink);
      line-height: 1.35;
      margin: 0;
      word-break: break-word;
    }
    .cancelled-card .card-title {
      text-decoration: line-through;
    }

    .mood-chip {
      font-size: 19px;
      line-height: 1;
      flex-shrink: 0;
    }

    .card-subtitle {
      font-size: 14px;
      font-weight: 600;
      color: var(--sub);
      margin-top: 4px;
      line-height: 1.45;
      width: 100%;
      word-break: break-word;
    }

    /* Note Box: Top-Left 90-degree sharp corner, other 3 corners rounded, NO speech-bubble triangle (Fix #6) */
    .note-box {
      margin-top: 10px;
      background: #F8F6F1;
      border: 1px solid var(--border);
      border-radius: 0px 14px 14px 14px;
      padding: 10px 13px;
      font-size: 13.5px;
      color: #33312E;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Dedicated URL Chip (Fix #7: Only rendered when URL exists) */
    .url-chip-row {
      margin-top: 8px;
    }
    .url-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #EEF2F6;
      color: #1E40AF;
      border: 1px solid #CBD5E1;
      padding: 5px 11px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      text-decoration: none;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Expense & Extra Spend Badges on Card (Fix #17) */
    .card-finance-box {
      margin-top: 10px;
      padding: 9px 12px;
      background: #FAF8F4;
      border: 1px dashed var(--border);
      border-radius: 10px;
      font-size: 12.5px;
    }
    .finance-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 0;
    }
    .finance-line.extra-item {
      color: var(--sub);
      font-size: 12px;
    }

    /* Card Polaroid Preview Strip */
    .card-photos-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-top: 10px;
      padding-bottom: 4px;
    }
    .card-photo-thumb {
      width: 68px;
      height: 68px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border);
      flex-shrink: 0;
      cursor: pointer;
    }

    /* Card Bottom Actions */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 13px;
      padding-top: 11px;
      border-top: 1px solid #EFECE4;
      gap: 8px;
      flex-wrap: wrap;
    }
    .card-actions-left {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .mini-btn {
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .mini-btn.share-highlight {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: #E8C5BD;
    }
    .mini-btn.delete-btn {
      color: #8C857B;
    }

    /* Bottom Floating Dock */
    .bottom-dock {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 12px) + 12px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px;
      display: flex;
      gap: 4px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.12);
      z-index: 200;
    }
    .dock-tab {
      border: none;
      background: transparent;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 13.5px;
      font-weight: 800;
      padding: 9px 18px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }
    .dock-tab.active {
      background: var(--ink);
      color: #FFFFFF;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 20, 19, 0.55);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 500;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-sheet {
      background: var(--bg);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      border-radius: 24px;
      padding: 20px;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.28);
      border: 1px solid var(--border);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .modal-title {
      font-size: 19px;
      font-weight: 900;
    }

    .form-card {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 5px;
      margin-top: 10px;
    }
    .form-label:first-child {
      margin-top: 0;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      font-family: var(--sans);
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #FFFFFF;
      color: var(--ink);
      appearance: none;
      -webkit-appearance: none;
    }
    /* Note input also features 90-degree top-left corner */
    .form-textarea.sharp-tl {
      border-radius: 0px 12px 12px 12px;
      min-height: 74px;
      resize: vertical;
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    /* Mobile Stack Fix (#7 & #12): Prevent iOS date input & timezone overlap */
    @media (max-width: 480px) {
      .form-row-2.mobile-stack {
        grid-template-columns: 1fr;
      }
    }

    .time-select-group {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 6px;
    }

    /* Emoji Mood Picker Bar */
    .emoji-picker-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .emoji-opt {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #FAF8F4;
      font-size: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .emoji-opt.selected {
      border: 2px solid var(--accent);
      background: var(--accent-soft);
    }

    /* Transit Legs Builder */
    .leg-item {
      background: #F8F6F1;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .leg-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 6px;
    }

    /* Extra Expenses List in Form */
    .extra-exp-row {
      display: grid;
      grid-template-columns: 1.4fr 1fr auto;
      gap: 6px;
      margin-bottom: 6px;
      align-items: center;
    }

    /* Map Container */
    #routeMapContainer {
      width: 100%;
      height: 62vh;
      border-radius: 20px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    /* Swatch Selector */
    .swatch-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .swatch-btn {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .swatch-btn.active {
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="app-header">
    <div class="brand-row">
      <div class="brand-logo">旅</div>
      <div class="brand-title">TABIGRAM</div>
    </div>

    <div class="top-actions">
      <button class="pill-btn primary" onclick="openItemModal()">＋ 新增行程</button>
      <button class="pill-btn" id="tripCountBtn" onclick="openTripManager()">旅行專案 (1)</button>
      <button class="pill-btn accent-outline" onclick="openArchiveModal()">典藏旅程</button>
      <button class="pill-btn" onclick="openPinModal()">密碼鎖</button>
      <button class="pill-btn" onclick="exportBackupJSON()">匯出</button>
      <button class="pill-btn" onclick="document.getElementById('importFileInput').click()">匯入</button>
      <input type="file" id="importFileInput" accept=".json" style="display:none" onchange="importBackupJSON(event)" />
    </div>

    <div class="trip-tabs-bar" id="tripTabsBar"></div>
  </header>

  <!-- Main Content -->
  <main class="main-container">
    <!-- Day & Real-time Open-Meteo Weather Bar -->
    <section class="day-weather-card">
      <div class="day-row">
        <div class="day-pills" id="dayPillsBar"></div>
        <button class="pill-btn" id="homeTzToggleBtn" onclick="toggleHomeTzCompare()">家鄉時區對照：開</button>
      </div>

      <div class="weather-strip">
        <div class="weather-badge" id="weatherBadge">☀️ 自動同步當地氣象中...</div>
        <div style="display:flex; gap:6px;">
          <button class="mini-btn" onclick="refreshRealtimeWeather(true)">↻ 即時更新氣象</button>
          <button class="mini-btn delete-btn" id="deleteDayBtn" style="display:none;" onclick="deleteCurrentDay()">刪除此日</button>
        </div>
      </div>

      <div class="solar-meta">
        <span id="sunriseLabel">日出 06:15</span>
        <span id="activeTzLabel">時區：Asia/Tokyo</span>
        <span id="sunsetLabel">日落 17:30</span>
      </div>
      <div class="solar-track">
        <div class="solar-thumb" id="solarThumb" style="left: 55%;"></div>
      </div>
    </section>

    <!-- View 1: Timeline View -->
    <section id="timelineView"></section>

    <!-- View 2: Route Map View -->
    <section id="mapView" style="display:none;">
      <div class="form-card" style="margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
        <div style="font-size:13px; font-weight:800;">📍 當日全段路線與轉乘軌跡圖</div>
        <div style="font-size:12px; color:var(--sub);" id="mapStatsLabel"></div>
      </div>
      <div id="routeMapContainer"></div>
    </section>

    <!-- View 3: Checklist & Dual-Track Finance View -->
    <section id="budgetView" style="display:none;"></section>
  </main>

  <!-- Bottom Navigation Dock -->
  <nav class="bottom-dock">
    <button class="dock-tab active" id="tabBtnTimeline" onclick="switchMainView('timeline')">時間軸</button>
    <button class="dock-tab" id="tabBtnMap" onclick="switchMainView('map')">路線圖</button>
    <button class="dock-tab" id="tabBtnBudget" onclick="switchMainView('budget')">清單/預算</button>
  </nav>

  <!-- Modal 1: Add / Edit Itinerary Item -->
  <div class="modal-backdrop" id="itemModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="modal-title" id="itemModalTitle">新增行程卡片</div>
        <button class="pill-btn" onclick="closeItemModal()">關閉</button>
      </div>

      <div class="form-card">
        <label class="form-label">行程類型</label>
        <select class="form-select" id="fType" onchange="onTypeChange()">
          <option value="spot">📍 一般景點 / 餐飲 / 購物</option>
          <option value="transit">🚃 鐵道 / 地鐵 / 新幹線 / 船班 (支援多段轉乘)</option>
          <option value="flight">✈️ 航班飛行 (3D 球面大圓航線圖)</option>
        </select>

        <label class="form-label">行程主標題</label>

    /*************************************************************************
     * 3. STATION COORDINATE RESOLVER (Offline Dictionary + Smart OSM Context)
     *************************************************************************/
    function normalizeStationName(raw) {
      if (!raw) return "";
      return raw.trim()
        .replace(/(車站|駅|Station|Sta\.|站)$/i, "")
        .trim();
    }

    function lookupStationCoordSync(name) {
      if (!name) return null;
      const clean = normalizeStationName(name);
      if (STATION_COORDS[clean]) return { lat: STATION_COORDS[clean][0], lng: STATION_COORDS[clean][1] };
      if (STATION_COORDS[name.trim()]) return { lat: STATION_COORDS[name.trim()][0], lng: STATION_COORDS[name.trim()][1] };
      if (appState.geoCache && appState.geoCache[clean]) return appState.geoCache[clean];
      for (const k in STATION_COORDS) {
        if (clean.includes(k) || k.includes(clean)) {
          return { lat: STATION_COORDS[k][0], lng: STATION_COORDS[k][1] };
        }
      }
      return null;
    }

    async function geocodeStationOnline(name, tzHint) {
      const clean = normalizeStationName(name);
      if (!clean) return null;
      const syncHit = lookupStationCoordSync(clean);
      if (syncHit) return syncHit;

      let countryHint = "";
      if (tzHint === "Asia/Taipei") countryHint = "Taiwan";
      else if (tzHint === "Asia/Tokyo") countryHint = "Japan";
      else if (tzHint === "Asia/Seoul") countryHint = "South Korea";

      try {
        const q = encodeURIComponent(`${clean} ${countryHint}`.trim());
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${q}`);
        const data = await res.json();
        if (data && data.length > 0) {
          const coord = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
          appState.geoCache = appState.geoCache || {};
          appState.geoCache[clean] = coord;
          saveAppState();
          return coord;
        }
      } catch (e) {}
      return null;
    }

    function getLineBrandColor(lineName, idx = 0) {
      if (!lineName) return ["#0070BD", "#E3002C", "#F8B61C", "#008659"][idx % 4];
      for (const rule of TRANSIT_LINE_COLORS) {
        if (rule.keys.some(k => lineName.includes(k))) return rule.color;
      }
      return ["#0070BD", "#E3002C", "#F8B61C", "#008659"][idx % 4];
    }

    function getDefaultCoordForTz(tz) {
      const map = {
        "Asia/Taipei": { lat: 25.0478, lng: 121.5170 },
        "Asia/Tokyo": { lat: 35.6812, lng: 139.7671 },
        "Asia/Seoul": { lat: 37.5665, lng: 126.9780 },
        "Pacific/Honolulu": { lat: 21.3069, lng: -157.8583 },
        "America/Los_Angeles": { lat: 34.0522, lng: -118.2437 },
        "America/New_York": { lat: 40.7128, lng: -74.0060 },
        "Europe/London": { lat: 51.5074, lng: -0.1278 },
        "Europe/Paris": { lat: 48.8566, lng: 2.3522 }
      };
      return map[tz] || map["Asia/Taipei"];
    }

    function detectDayTargetCoord(day, trip) {
      for (const item of day.items) {
        if (item.type === "transit" && item.transitLegs && item.transitLegs.length > 0) {
          const c = lookupStationCoordSync(item.transitLegs[0].from);
          if (c) return c;
        }
        if (item.type === "flight" && item.depIata && AIRPORT_COORDS[item.depIata.toUpperCase()]) {
          return AIRPORT_COORDS[item.depIata.toUpperCase()];
        }
        if (item.lat && item.lng) return { lat: item.lat, lng: item.lng };
        const byTitle = lookupStationCoordSync(item.title);
        if (byTitle) return byTitle;
      }
      const tz = (day.items[0] && day.items[0].startTz) || trip.homeTz || "Asia/Taipei";
      return getDefaultCoordForTz(tz);
    }

    function weatherCodeToText(code) {
      if (code === 0) return { icon: "☀️", text: "晴朗" };
      if (code <= 3) return { icon: "⛅", text: "多雲" };
      if (code <= 48) return { icon: "🌫️", text: "薄霧" };
      if (code <= 67) return { icon: "🌧️", text: "降雨" };
      if (code <= 77) return { icon: "❄️", text: "降雪" };
      if (code <= 82) return { icon: "🌦️", text: "陣雨" };
      return { icon: "⛈️", text: "雷雨" };
    }

    async function refreshRealtimeWeather(forceShowToast = false) {
      const trip = getActiveTrip();
      const day = getActiveDay();
      if (!day) return;

      const coord = detectDayTargetCoord(day, trip);
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${coord.lat}&longitude=${coord.lng}&daily=weathercode,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto&forecast_days=1`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data && data.daily) {
          const code = data.daily.weathercode[0];
          const maxT = Math.round(data.daily.temperature_2m_max[0]);
          const minT = Math.round(data.daily.temperature_2m_min[0]);
          const srRaw = data.daily.sunrise[0]; // e.g., "2026-11-15T06:18"
          const ssRaw = data.daily.sunset[0];

          const wInfo = weatherCodeToText(code);
          day.weatherText = `${wInfo.icon} ${wInfo.text} ${maxT}°C / ${minT}°C`;
          if (srRaw && srRaw.includes("T")) day.sunrise = srRaw.split("T")[1].slice(0, 5);
          if (ssRaw && ssRaw.includes("T")) day.sunset = ssRaw.split("T")[1].slice(0, 5);
          saveAppState();
          renderDayWeatherBar();
        }
      } catch (e) {
        renderDayWeatherBar();
      }
    }

    function convertTimeBetweenTz(timeHHMM, fromTz, toTz) {
      if (!timeHHMM || !fromTz || !toTz || fromTz === toTz) return null;
      try {
        const [h, m] = timeHHMM.split(":").map(Number);
        const now = new Date();
        const utcDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), h, m));
        const getOffsetMin = (tz) => {
          const str = utcDate.toLocaleString("en-US", { timeZone: tz });
          const tzDate = new Date(str);
          return Math.round((tzDate - utcDate) / 60000);
        };
        const diffMin = getOffsetMin(toTz) - getOffsetMin(fromTz);
        let totalMin = h * 60 + m + diffMin;
        let dayShift = "";
        if (totalMin < 0) { totalMin += 1440; dayShift = " (-1日)"; }
        else if (totalMin >= 1440) { totalMin -= 1440; dayShift = " (+1日)"; }
        const nh = String(Math.floor(totalMin / 60)).padStart(2, "0");
        const nm = String(totalMin % 60).padStart(2, "0");
        return `${nh}:${nm}${dayShift}`;
      } catch (e) {
        return null;
      }
    }

    function formatItemSubtitle(item) {
      if (item.type === "transit" && Array.isArray(item.transitLegs) && item.transitLegs.length > 0) {
        return item.transitLegs.map(leg => {
          const trainBadge = leg.trainNo ? ` ${leg.trainNo}` : "";
          return `${leg.line || "鐵道"}${trainBadge} (${leg.from} ➔ ${leg.to})`;
        }).join(" ／ ");
      }
      if (item.type === "flight") {
        return `${item.flightNo || "FLIGHT"} (${(item.depIata || "DEP").toUpperCase()} ➔ ${(item.arrIata || "ARR").toUpperCase()})${item.gateSeat ? " · " + item.gateSeat : ""}`;
      }
      return item.subtitle || "";
    }

    function renderTimelineCards() {
      const container = document.getElementById("timelineView");

      }

      day.items.forEach((item, idx) => {
        const card = document.createElement("div");
        const isDone = item.status === "done";
        const isCancel = item.status === "cancelled";
        card.className = "timeline-card" + (idx === 0 && !isDone && !isCancel ? " now-active" : "") + (isDone ? " done-card" : "") + (isCancel ? " cancelled-card" : "");

        // Home TZ comparison badge

        // Finance Summary on Card (Base Cost + Extra Expenses #17)
        const baseCost = Number(item.cost) || 0;
        const extras = Array.isArray(item.extraExpenses) ? item.extraExpenses : [];
        const extraSum = extras.reduce((acc, ex) => acc + (Number(ex.amount) || 0), 0);
        let financeHtml = "";
        if (baseCost > 0 || extras.length > 0) {
          const cur = item.currency || "NT$";
          let extraLines = extras.map(ex => `
            <div class="finance-line extra-item">
              <span>＋ ${escapeHtml(ex.name || "額外消費")}</span>
              <span>${cur} ${Number(ex.amount || 0).toLocaleString()}</span>

        // Dedicated URL chip - only rendered when URL is provided (#7)

              <span class="step-circle">${idx + 1}</span>

        const [sh, sm] = (item.startTime || "09:00").split(":");
        const [eh, em] = (item.endTime || "10:00").split(":");
        document.getElementById("fStartHour").value = sh || "09";
        document.getElementById("fStartMin").value = sm || "00";
        document.getElementById("fEndHour").value = eh || "10";
        document.getElementById("fEndMin").value = em || "00";

        document.getElementById("fCurrency").value = item.currency || "NT$";
        document.getElementById("fCost").value = item.cost || "";
        document.getElementById("fNote").value = item.note || "";
        document.getElementById("fUrl").value = item.url || "";
        document.getElementById("fUrlLabel").value = item.urlLabel || "";

        if (Array.isArray(item.transitLegs) && item.transitLegs.length > 0) {
          item.transitLegs.forEach(l => addTransitLegRow(l));
        } else {
          addTransitLegRow();
        }

        if (Array.isArray(item.extraExpenses)) {
          item.extraExpenses.forEach(ex => addExtraExpenseRow(ex));
        }

        formTempPhotos = Array.isArray(item.photos) ? [...item.photos] : [];
      } else {
        // Fix #16: Inherit timezone, currency, and smart next time from previous item!
        const prevItem = day.items.length > 0 ? day.items[day.items.length - 1] : null;
        const inheritedTz = prevItem ? (prevItem.endTz || prevItem.startTz) : (trip.homeTz || "Asia/Taipei");
        const inheritedCurrency = prevItem ? (prevItem.currency || "NT$") : (inheritedTz === "Asia/Tokyo" ? "¥" : "NT$");

        document.getElementById("fType").value = "spot";
        document.getElementById("fTitle").value = "";
        document.getElementById("fMood").value = "";
        document.getElementById("fSubtitle").value = "";
        document.getElementById("fDepIata").value = "";
        document.getElementById("fArrIata").value = "";
        document.getElementById("fFlightNo").value = "";
        document.getElementById("fGateSeat").value = "";

        document.getElementById("fStartTz").value = inheritedTz;
        document.getElementById("fEndTz").value = inheritedTz;

        const defaultStart = prevItem ? (prevItem.endTime || "10:00") : "09:00";
        const [sh, sm] = defaultStart.split(":");
        const nextHour = String((parseInt(sh, 10) + 1) % 24).padStart(2, "0");
        document.getElementById("fStartHour").value = sh || "09";
        document.getElementById("fStartMin").value = sm || "00";
        document.getElementById("fEndHour").value = nextHour;

        document.getElementById("fNote").value = "";
        document.getElementById("fUrl").value = "";
        document.getElementById("fUrlLabel").value = "";

        addTransitLegRow();
        formTempPhotos = [];
      }

      onTypeChange();
      renderFormPhotosPreview();
      document.getElementById("itemModal").classList.add("open");
    }

    function compressImageFile(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxDim = 1280;
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
              else { w = Math.round(w * (maxDim / h)); h = maxDim; }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            resolve({ dataUrl: canvas.toDataURL("image/jpeg", 0.82), caption: "" });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleFormPhotosUpload(e) {
      const files = Array.from(e.target.files || []);
      for (const f of files) {
        const compressed = await compressImageFile(f);
        formTempPhotos.push(compressed);
      }
      renderFormPhotosPreview();
      e.target.value = "";
    }

    function triggerQuickPhotoUpload(itemId) {
      const inp = document.createElement("input");
      inp.type = "file";
      inp.accept = "image/*";
      inp.multiple = true;
      inp.onchange = async (e) => {
        const day = getActiveDay();
        const item = day.items.find(i => i.id === itemId);
        if (!item) return;
        item.photos = item.photos || [];
        const files = Array.from(e.target.files || []);
        for (const f of files) {
          const c = await compressImageFile(f);
          item.photos.push(c);
        }
        saveAppState();
        renderAll();
      };
      inp.click();
    }

    async function saveItineraryItem() {
      const day = getActiveDay();
      const type = document.getElementById("fType").value;
      const title = document.getElementById("fTitle").value.trim() || "未命名行程";
      const mood = document.getElementById("fMood").value.trim();
      const subtitle = document.getElementById("fSubtitle").value.trim();
      const depIata = document.getElementById("fDepIata").value.trim().toUpperCase();
      const arrIata = document.getElementById("fArrIata").value.trim().toUpperCase();
      const flightNo = document.getElementById("fFlightNo").value.trim();
      const gateSeat = document.getElementById("fGateSeat").value.trim();

      const startTz = document.getElementById("fStartTz").value;
      const endTz = document.getElementById("fEndTz").value;
      const startTime = `${document.getElementById("fStartHour").value}:${document.getElementById("fStartMin").value}`;
      const endTime = `${document.getElementById("fEndHour").value}:${document.getElementById("fEndMin").value}`;

      const currency = document.getElementById("fCurrency").value;
      const cost = Number(document.getElementById("fCost").value) || 0;
      const note = document.getElementById("fNote").value;
      const url = document.getElementById("fUrl").value.trim();
      const urlLabel = document.getElementById("fUrlLabel").value.trim();

      // Collect transit legs
      const transitLegs = [];
      if (type === "transit") {
        document.querySelectorAll("#transitLegsContainer .leg-item").forEach(row => {
          const from = row.querySelector(".leg-from").value.trim();
          const to = row.querySelector(".leg-to").value.trim();
          const line = row.querySelector(".leg-line").value.trim();
          const trainNo = row.querySelector(".leg-train").value.trim();
          if (from || to) {
            transitLegs.push({ from, to, line, trainNo });
          }
        });
        // Pre-resolve unknown stations via Smart Context Geocoder (#1)
        for (const leg of transitLegs) {
          if (leg.from) await geocodeStationOnline(leg.from, startTz);
          if (leg.to) await geocodeStationOnline(leg.to, endTz);
        }
      }

      // Collect extra expenses (#17)
      const extraExpenses = [];
      document.querySelectorAll("#extraExpensesContainer .extra-exp-row").forEach(row => {
        const name = row.querySelector(".exp-name").value.trim();
        const amount = Number(row.querySelector(".exp-amount").value) || 0;
        if (name || amount > 0) {
          extraExpenses.push({ name: name || "現場消費", amount });
        }
      });

      const payload = {
        id: editingItemId || ("item_" + Date.now()),
        type,
        title,
        mood,
        subtitle,
        depIata,
        arrIata,
        flightNo,
        gateSeat,
        startTz,
        endTz,
        startTime,
        endTime,
        currency,
        cost,
        extraExpenses,
        note,
        url,
        urlLabel,
        transitLegs,
        photos: formTempPhotos,
        status: "normal"
      };

      if (editingItemId) {
        const idx = day.items.findIndex(i => i.id === editingItemId);
        if (idx !== -1) {
          payload.status = day.items[idx].status || "normal";
          day.items[idx] = payload;
        }
      } else {
        day.items.push(payload);
      }

      saveAppState();
      closeItemModal();
      renderAll();
      refreshRealtimeWeather();
    }

    /**
     * Draw Harry Beck's Octilinear Metro Topology on Canvas (Fix #1, #2, #3)
     * - Preserves true geographic cardinal direction (e.g., Taitung SE -> Taipei NW; Dongmen -> Yongan Market SW)
     * - Orthogonal Main Trunk first + 45-degree clean corner into station center
     * - Auto-centers and scales to fill the canvas card cleanly
     */
    function drawBeckOctilinearTransitCard(ctx, item, cardX, cardY, cardW, cardH, innerSwatch) {
      drawRoundedRect(ctx, cardX, cardY, cardW, cardH, 32, innerSwatch.bg);

      const legs = (Array.isArray(item.transitLegs) && item.transitLegs.length > 0)
        ? item.transitLegs
        : [{ from: item.title.split("to")[0] || "起點站", to: item.title.split("to")[1] || "終點站", line: item.subtitle || "鐵道路線", trainNo: "" }];

      // Legend Header inside white card
      let legendY = cardY + 52;
      legs.forEach((leg, i) => {
        const col = getLineBrandColor(leg.line, i);
        ctx.fillStyle = col;
        drawRoundedRect(ctx, cardX + 46, legendY - 22, 18, 28, 6, col);
        ctx.fillStyle = innerSwatch.text;
        ctx.font = "700 24px 'Noto Sans TC', sans-serif";
        const trainBadge = leg.trainNo ? ` ${leg.trainNo}` : "";
        ctx.fillText(`${leg.line || "路線"}${trainBadge} (${leg.from} ➔ ${leg.to})`, cardX + 76, legendY);
        legendY += 40;
      });

      // Divider line
      ctx.strokeStyle = "rgba(0,0,0,0.08)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cardX + 46, legendY + 4);
      ctx.lineTo(cardX + cardW - 46, legendY + 4);
      ctx.stroke();

      // Build ordered station nodes with real geographic coordinates
      const stations = [];
      legs.forEach((leg, idx) => {
        if (idx === 0) {
          stations.push({ name: leg.from, coord: lookupStationCoordSync(leg.from) });
        }
        stations.push({ name: leg.to, coord: lookupStationCoordSync(leg.to), line: leg.line, legIdx: idx });
      });

      // Fallback coordinates if any unknown station wasn't in sync cache
      stations.forEach((st, i) => {
        if (!st.coord) {
          st.coord = { lat: 25.0478 - i * 0.03, lng: 121.5170 + i * 0.02 };
        }
      });

      // Convert geographic deltas into clean Octilinear vectors (Orthogonal trunk + 45° diagonal)
      const mapBoxX = cardX + 110;
      const mapBoxY = legendY + 65;
      const mapBoxW = cardW - 220;
      const mapBoxH = (cardY + cardH - 80) - mapBoxY;

      // Compute raw schematic positions preserving exact real-world bearing
      const rawPts = [{ x: 0, y: 0 }];
      for (let i = 1; i < stations.length; i++) {
        const prev = stations[i - 1].coord;
        const curr = stations[i].coord;
        const dLat = curr.lat - prev.lat; // + is North (up -> negative Y on canvas)
        const dLng = (curr.lng - prev.lng) * Math.cos((prev.lat * Math.PI) / 180); // + is East (right -> positive X)

        const len = Math.hypot(dLng, dLat) || 0.01;
        const nx = dLng / len;
        const ny = -dLat / len; // Canvas Y goes down for South

        const stepDist = 180;
        rawPts.push({
          x: rawPts[i - 1].x + nx * stepDist,
          y: rawPts[i - 1].y + ny * stepDist
        });
      }

      // Bounding box normalization to center and scale cleanly inside mapBox
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      rawPts.forEach(p => {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      });

      const spanX = Math.max(maxX - minX, 80);
      const spanY = Math.max(maxY - minY, 80);
      const scale = Math.min(mapBoxW / spanX, mapBoxH / spanY) * 0.78;
      const cx = mapBoxX + mapBoxW / 2;
      const cy = mapBoxY + mapBoxH / 2;
      const midX = (minX + maxX) / 2;
      const midY = (minY + maxY) / 2;

      const screenPts = rawPts.map(p => ({
        x: Math.round(cx + (p.x - midX) * scale),
        y: Math.round(cy + (p.y - midY) * scale)
      }));

      // Draw each transit leg using Harry Beck's Octilinear Rule (Orthogonal Trunk first, then 45° bend directly into station center!)
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      for (let i = 1; i < screenPts.length; i++) {
        const p1 = screenPts[i - 1];
        const p2 = screenPts[i];
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const absX = Math.abs(dx);
        const absY = Math.abs(dy);
        const sgnX = Math.sign(dx) || 1;
        const sgnY = Math.sign(dy) || 1;

        const lineColor = getLineBrandColor(stations[i].line, i - 1);
        ctx.strokeStyle = lineColor;
        ctx.lineWidth = 20;

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y); // Strictly start at exact circle center p1

        if (absX < 18 || absY < 18 || Math.abs(absX - absY) < 22) {
          // Pure vertical, horizontal, or pure 45° diagonal (like Taitung SE -> Taipei NW)
          ctx.lineTo(p2.x, p2.y);
        } else if (absX > absY) {
          // Horizontal main trunk first, then 45° diagonal into p2 center
          const bendX = p1.x + sgnX * (absX - absY);
          const bendY = p1.y;
          ctx.lineTo(bendX, bendY);
          ctx.lineTo(p2.x, p2.y);
        } else {
          // Vertical main trunk first, then 45° diagonal into p2 center
          const bendX = p1.x;
          const bendY = p1.y + sgnY * (absY - absX);
          ctx.lineTo(bendX, bendY);
          ctx.lineTo(p2.x, p2.y);
        }
        ctx.stroke();
      }

      // Draw Station Nodes & Non-overlapping Labels on top of lines
      screenPts.forEach((pt, idx) => {
        const isTransfer = idx > 0 && idx < screenPts.length - 1;
        const r = isTransfer ? 22 : 20;

        ctx.beginPath();
        ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
        ctx.fillStyle = "#FFFFFF";
        ctx.fill();
        ctx.lineWidth = 7;
        ctx.strokeStyle = "#191919";
        ctx.stroke();

        if (isTransfer) {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 7, 0, Math.PI * 2);
          ctx.fillStyle = "#191919";
          ctx.fill();
        }

        // Smart Label Placement
        ctx.font = "900 32px 'Noto Sans TC', sans-serif";
        ctx.fillStyle = innerSwatch.text;
        const label = stations[idx].name;
        const tw = ctx.measureText(label).width;

        let lx = pt.x + 32;
        let ly = pt.y + 11;
        if (pt.x > cx + 40) {
          lx = pt.x - tw - 32;
        }
        if (idx === 0) {
          ly = pt.y - 28;
          lx = Math.max(cardX + 44, Math.min(cardX + cardW - tw - 44, pt.x - tw / 2));
        }
        ctx.fillText(label, lx, ly);
      });
    }

    /**
     * Draw Real Natural Earth 110m Vector Globe + 3D Orthographic Great Circle Route (Fix #18)
     */
    async function drawReal3DGlobeFlightCard(ctx, item, cardX, cardY, cardW, cardH) {
      drawRoundedRect(ctx, cardX, cardY, cardW, cardH, 32, "#0B1320");

      const depCode = (item.depIata || "TPE").toUpperCase();
      const arrCode = (item.arrIata || "NRT").toUpperCase();
      const dep = AIRPORT_COORDS[depCode] || AIRPORT_COORDS["TPE"];
      const arr = AIRPORT_COORDS[arrCode] || AIRPORT_COORDS["NRT"];

      const land = await ensureWorldAtlasLoaded();

      const globeCx = cardX + cardW / 2;
      const globeCy = cardY + cardH / 2 - 20;
      const radius = Math.min(cardW, cardH) * 0.39;

      // Center orthographic projection between departure and arrival
      const midLng = (dep.lng + arr.lng) / 2;
      const midLat = (dep.lat + arr.lat) / 2;

      const projection = d3.geoOrthographic()
        .scale(radius)
        .translate([globeCx, globeCy])
        .rotate([-midLng, -midLat, 0])
        .clipAngle(90);

      const geoPath = d3.geoPath(projection, ctx);

      // Ocean Sphere Gradient
      const grad = ctx.createRadialGradient(globeCx - radius * 0.3, globeCy - radius * 0.3, radius * 0.1, globeCx, globeCy, radius);
      grad.addColorStop(0, "#1E2F4D");
      grad.addColorStop(1, "#09101D");
      ctx.beginPath();
      ctx.arc(globeCx, globeCy, radius, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      // Graticule Grid
      const graticule = d3.geoGraticule10();
      ctx.beginPath();
      geoPath(graticule);
      ctx.strokeStyle = "rgba(148, 163, 184, 0.16)";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Real Natural Earth Continents & Islands
      if (land) {
        ctx.beginPath();
        geoPath(land);
        ctx.fillStyle = "#2A3E5C";
        ctx.fill();
        ctx.strokeStyle = "rgba(226, 232, 240, 0.35)";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      // Outer Atmosphere Rim
      ctx.beginPath();
      ctx.arc(globeCx, globeCy, radius, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(200, 75, 49, 0.55)";
      ctx.lineWidth = 3;
      ctx.stroke();

      // True Spherical Great Circle Arc
      const routeFeature = {
        type: "LineString",
        coordinates: [[dep.lng, dep.lat], [arr.lng, arr.lat]]
      };
      ctx.beginPath();
      geoPath(routeFeature);
      ctx.strokeStyle = "#F59E0B";
      ctx.lineWidth = 7;
      ctx.setLineDash([14, 10]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Airport Beacons
      [[depCode, dep], [arrCode, arr]].forEach(([code, pt]) => {
        const p = projection([pt.lng, pt.lat]);
        if (!p) return;
        ctx.beginPath();
        ctx.arc(p[0], p[1], 11, 0, Math.PI * 2);
        ctx.fillStyle = "#C84B31";
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#FFFFFF";
        ctx.stroke();

        ctx.font = "800 28px 'JetBrains Mono', monospace";
        ctx.fillStyle = "#FFFFFF";
        ctx.fillText(code, p[0] + 16, p[1] + 8);
      });

      // Top HUD Telemetry
      ctx.font = "700 22px 'JetBrains Mono', monospace";
      ctx.fillStyle = "#94A3B8";
      ctx.fillText(`GREAT CIRCLE ORTHOGRAPHIC // ${depCode} ➔ ${arrCode}`, cardX + 44, cardY + 58);

      ctx.font = "800 30px 'JetBrains Mono', monospace";
      ctx.fillStyle = "#F8FAFC";
      ctx.fillText(`${item.flightNo || "FLIGHT"}   ${item.gateSeat || ""}`, cardX + 44, cardY + cardH - 44);
    }

    async function renderStoryCanvas() {
      if (!currentShareItem) return;
      const canvas = document.getElementById("storyCanvas");
      const ctx = canvas.getContext("2d");
      const W = canvas.width;
      const H = canvas.height;

      const trip = getActiveTrip();
      const item = currentShareItem;
      const tpl = document.getElementById("shareTemplateSelect").value;
      const showMood = document.getElementById("shareShowMoodCheck").checked;

      const outerSwatch = OUTER_SWATCHES.find(s => s.id === appState.outerSwatchId) || OUTER_SWATCHES[0];
      const innerSwatch = INNER_SWATCHES.find(s => s.id === appState.innerSwatchId) || INNER_SWATCHES[0];

      // 1. Outer Background Paper
      ctx.fillStyle = outerSwatch.bg;
      ctx.fillRect(0, 0, W, H);

      // 2. Clean Minimal Top Header (Fix #1: Removed large TABINOTE logo & block!)
      ctx.fillStyle = outerSwatch.text;
      ctx.globalAlpha = 0.85;
      ctx.font = "800 25px 'JetBrains Mono', monospace";
      const typeLabel = tpl === "transit" ? "TRANSIT ROUTE" : (tpl === "flight" ? "FLIGHT LOG" : "MOMENT LOG");
      ctx.fillText(`DAY ${String(appState.activeDayIndex + 1).padStart(2, "0")} // ${typeLabel}`, 84, 130);

      ctx.textAlign = "right";
      ctx.font = "700 24px 'Noto Sans TC', sans-serif";
      ctx.fillText(trip.title, W - 84, 130);
      ctx.textAlign = "left";

      ctx.strokeStyle = outerSwatch.text;
      ctx.globalAlpha = 0.18;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(84, 158);
      ctx.lineTo(W - 84, 158);
      ctx.stroke();
      ctx.globalAlpha = 1;

      // 3. Main Visual Frame (Y: 195 -> 1255)
      const mainX = 84, mainY = 195, mainW = W - 168, mainH = 1040;

      if (tpl === "transit") {
        drawBeckOctilinearTransitCard(ctx, item, mainX, mainY, mainW, mainH, innerSwatch);
      } else if (tpl === "flight") {
        await drawReal3DGlobeFlightCard(ctx, item, mainX, mainY, mainW, mainH);
      } else {
        // Polaroid Frame Mode
        drawRoundedRect(ctx, mainX, mainY, mainW, mainH, 24, "#FFFFFF");
        const photoX = mainX + 44, photoY = mainY + 44, photoW = mainW - 88, photoH = mainH - 210;

        ctx.save();
        drawRoundedRectPath(ctx, photoX, photoY, photoW, photoH, 12);
        ctx.clip();
        ctx.fillStyle = "#E5E0D5";
        ctx.fillRect(photoX, photoY, photoW, photoH);

        if (item.photos && item.photos[selectedSharePhotoIndex]) {
          const imgObj = await loadImageElement(item.photos[selectedSharePhotoIndex].dataUrl);
          const zoom = parseFloat(document.getElementById("photoZoomRange").value) || 1;
          const panX = parseFloat(document.getElementById("photoPanXRange").value) || 0;
          const panY = parseFloat(document.getElementById("photoPanYRange").value) || 0;

          const scale = Math.max(photoW / imgObj.width, photoH / imgObj.height) * zoom;
          const dw = imgObj.width * scale;
          const dh = imgObj.height * scale;
          const dx = photoX + (photoW - dw) / 2 + panX * 2.5;
          const dy = photoY + (photoH - dh) / 2 + panY * 2.5;
          ctx.drawImage(imgObj, dx, dy, dw, dh);
        } else {
          ctx.fillStyle = "#78716C";
          ctx.font = "700 30px 'Noto Sans TC', sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("尚未上傳相片（可切換鐵道或航班版型）", photoX + photoW / 2, photoY + photoH / 2);
          ctx.textAlign = "left";
        }
        ctx.restore();

        // Polaroid Bottom Caption
        const capText = document.getElementById("sharePolaroidCaption").value.trim();
        if (item.photos && item.photos[selectedSharePhotoIndex]) {
          item.photos[selectedSharePhotoIndex].caption = capText;
          saveAppState();
        }
        if (capText) {
          ctx.fillStyle = "#292524";
          ctx.font = "700 32px 'Noto Sans TC', sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(capText, mainX + mainW / 2, mainY + mainH - 72);
          ctx.textAlign = "left";
        }
      }

      // 4. Lower Ticket Summary Card (Y: 1275 -> 1730)
      const ticketY = 1275, ticketH = 440;
      drawRoundedRect(ctx, mainX, ticketY, mainW, ticketH, 32, innerSwatch.bg);

      // Title + Optional Mood Emoji (#11)
      ctx.fillStyle = innerSwatch.text;
      ctx.font = "900 44px 'Noto Sans TC', sans-serif";
      const moodStr = (showMood && item.mood) ? `  ${item.mood}` : "";
      ctx.fillText(`${item.title}${moodStr}`, mainX + 54, ticketY + 96);

      // Subtitle / Route Summary
      ctx.fillStyle = "#57534E";
      ctx.font = "600 27px 'Noto Sans TC', sans-serif";
      const subLine = formatItemSubtitle(item) || item.note || "";
      ctx.fillText(subLine.slice(0, 34), mainX + 54, ticketY + 154);

      // Time & Cost Pill
      ctx.font = "800 28px 'JetBrains Mono', monospace";
      ctx.fillStyle = "#C84B31";
      ctx.fillText(`${item.startTime} → ${item.endTime} (${item.startTz})`, mainX + 54, ticketY + 225);

      // Red Transit / Moment Stamp
      ctx.save();
      ctx.translate(mainX + mainW - 230, ticketY + 315);
      ctx.rotate(-0.06);
      ctx.strokeStyle = "#C84B31";
      ctx.lineWidth = 4;
      drawRoundedRectPath(ctx, -170, -52, 340, 104, 14);
      ctx.stroke();
      ctx.font = "800 22px 'JetBrains Mono', monospace";
      ctx.fillStyle = "#C84B31";
      ctx.textAlign = "center";
      ctx.fillText(tpl === "transit" ? "TRANSIT COMPLETED ✓" : "MOMENT LOGGED ✓", 0, -8);
      ctx.font = "700 19px 'JetBrains Mono', monospace";
      ctx.fillText(`${item.startTime} VERIFIED`, 0, 26);
      ctx.restore();

      // 5. Low-Profile Corner Watermark at Bottom-Right (Fix #1)
      ctx.fillStyle = outerSwatch.text;
      ctx.globalAlpha = 0.45;
      ctx.font = "700 21px 'JetBrains Mono', monospace";
      ctx.fillText(`${trip.startDate || ""}`, mainX, 1795);
      ctx.textAlign = "right";
      ctx.fillText("tabigram", W - 84, 1795);
      ctx.textAlign = "left";
      ctx.globalAlpha = 1;

      document.getElementById("storyPreviewImg").src = canvas.toDataURL("image/png");
    }

    // Unified Single Share / Save Function (Fix #9)
    async function shareOrSaveStoryImage() {
      const canvas = document.getElementById("storyCanvas");
      await shareCanvasViaNativeOrDownload(canvas, `tabigram-story-${Date.now()}.png`);

    async function shareCanvasViaNativeOrDownload(canvas, filename) {
      try {
        const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
        if (blob && navigator.canShare) {
          const file = new File([blob], filename, { type: "image/png" });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: "TABIGRAM"
            });
            return;
          }
        }
        // Desktop fallback
        const a = document.createElement("a");
        a.href = canvas.toDataURL("image/png");
        a.download = filename;
        a.click();
      } catch (e) {}
    }

    function renderLeafletRouteMap() {
      const day = getActiveDay();
      const trip = getActiveTrip();
      const mapEl = document.getElementById("routeMapContainer");

      if (!leafletMap) {
        leafletMap = L.map(mapEl).setView([25.0478, 121.5170], 11);
        L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
          attribution: "&copy; OpenStreetMap"
        }).addTo(leafletMap);
      }

      setTimeout(() => leafletMap.invalidateSize(), 120);

      // Clear existing layers except tileLayer
      leafletMap.eachLayer(layer => {
        if (!(layer instanceof L.TileLayer)) leafletMap.removeLayer(layer);
      });

      const allBoundsPts = [];
      let stopCounter = 1;

      day.items.filter(i => i.status !== "cancelled").forEach(item => {
        if (item.type === "transit" && Array.isArray(item.transitLegs) && item.transitLegs.length > 0) {
          // Plot every single transit leg & transfer station (#14)
          item.transitLegs.forEach((leg, lIdx) => {
            const cFrom = lookupStationCoordSync(leg.from);
            const cTo = lookupStationCoordSync(leg.to);
            const col = getLineBrandColor(leg.line, lIdx);

            if (cFrom) {
              L.circleMarker([cFrom.lat, cFrom.lng], {
                radius: 7, fillColor: "#FFFFFF", color: col, weight: 3, fillOpacity: 1
              }).addTo(leafletMap).bindPopup(`<b>${escapeHtml(leg.from)}</b><br/>${escapeHtml(leg.line || "")}`);
              allBoundsPts.push([cFrom.lat, cFrom.lng]);
            }
            if (cTo) {
              L.circleMarker([cTo.lat, cTo.lng], {
                radius: 8, fillColor: col, color: "#FFFFFF", weight: 2, fillOpacity: 1
              }).addTo(leafletMap).bindPopup(`<b>${escapeHtml(leg.to)}</b><br/>${escapeHtml(leg.line || "")}`);
              allBoundsPts.push([cTo.lat, cTo.lng]);
            }
            if (cFrom && cTo) {
              L.polyline([[cFrom.lat, cFrom.lng], [cTo.lat, cTo.lng]], {
                color: col, weight: 5, opacity: 0.9
              }).addTo(leafletMap);
            }
          });
        } else if (item.type === "flight") {
          const dep = AIRPORT_COORDS[(item.depIata || "").toUpperCase()];
          const arr = AIRPORT_COORDS[(item.arrIata || "").toUpperCase()];
          if (dep && arr) {
            L.polyline([[dep.lat, dep.lng], [arr.lat, arr.lng]], {
              color: "#C84B31", weight: 3, dashArray: "8, 8"
            }).addTo(leafletMap);
            allBoundsPts.push([dep.lat, dep.lng], [arr.lat, arr.lng]);
          }
        } else {
          const c = lookupStationCoordSync(item.title) || lookupStationCoordSync(item.subtitle);
          if (c) {
            L.circleMarker([c.lat, c.lng], {
              radius: 8, fillColor: "#191919", color: "#FFFFFF", weight: 2, fillOpacity: 1
            }).addTo(leafletMap).bindPopup(`<b>${stopCounter}. ${escapeHtml(item.title)}</b>`);
            allBoundsPts.push([c.lat, c.lng]);
            stopCounter++;
          }
        }
      });

      document.getElementById("mapStatsLabel").textContent = `共標記 ${allBoundsPts.length} 個座標節點`;
      if (allBoundsPts.length > 0) {
        leafletMap.fitBounds(allBoundsPts, { padding: [36, 36], maxZoom: 14 });
      } else {
        const def = getDefaultCoordForTz(trip.homeTz);
        leafletMap.setView([def.lat, def.lng], 11);
      }
    }

    /*************************************************************************
     * 10. DUAL-TRACK FINANCE & CHECKLIST VIEW (Fix #17)
     *************************************************************************/
    function renderBudgetAndChecklist() {
      const trip = getActiveTrip();
      const el = document.getElementById("budgetView");

      // Aggregate totals by currency across all days (excluding cancelled items)
      const totalsByCur = {};
      const itemBreakdownRows = [];

      trip.days.forEach((d, dIdx) => {
        d.items.forEach(item => {
          if (item.status === "cancelled") return;
          const cur = item.currency || "NT$";
          const base = Number(item.cost) || 0;
          const extras = Array.isArray(item.extraExpenses) ? item.extraExpenses : [];
          const extraTotal = extras.reduce((s, e) => s + (Number(e.amount) || 0), 0);
          const sum = base + extraTotal;

          if (sum > 0) {
            if (!totalsByCur[cur]) totalsByCur[cur] = { base: 0, extra: 0, total: 0 };
            totalsByCur[cur].base += base;
            totalsByCur[cur].extra += extraTotal;
            totalsByCur[cur].total += sum;

            itemBreakdownRows.push({
              dayNum: dIdx + 1,
              title: item.title,
              cur,
              base,
              extras,
              sum
            });
          }
        });
      });

      const summaryCardsHtml = Object.keys(totalsByCur).length > 0
        ? Object.entries(totalsByCur).map(([cur, obj]) => `
            <div style="background:#FAF8F4; border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:8px;">
              <div style="display:flex; justify-content:space-between; font-size:16px; font-weight:900;">
                <span>${cur} 總支出合計</span>
                <span style="color:var(--accent); font-family:var(--mono);">${cur} ${obj.total.toLocaleString()}</span>
              </div>
              <div style="display:flex; justify-content:space-between; font-size:12.5px; color:var(--sub); margin-top:4px;">
                <span>基本預算/票券：${cur} ${obj.base.toLocaleString()}</span>
                <span>現場額外消費：${cur} ${obj.extra.toLocaleString()}</span>
              </div>
            </div>
          `).join("")
        : `<div style="color:var(--sub); font-size:13px;">尚無記帳項目（已取消的行程會自動排除）</div>`;

      const detailRowsHtml = itemBreakdownRows.map(r => `
        <div style="border-bottom:1px solid #EFECE4; padding:9px 0; font-size:13.5px;">
          <div style="display:flex; justify-content:space-between; font-weight:800;">
            <span>DAY 0${r.dayNum} · ${escapeHtml(r.title)}</span>
            <span style="font-family:var(--mono);">${r.cur} ${r.sum.toLocaleString()}</span>
          </div>
          ${r.base > 0 ? `<div style="font-size:12px; color:var(--sub);">基本費用：${r.cur} ${r.base.toLocaleString()}</div>` : ""}
          ${r.extras.map(ex => `<div style="font-size:12px; color:var(--sub);">＋ 現場加購：${escapeHtml(ex.name)} (${r.cur} ${Number(ex.amount).toLocaleString()})</div>`).join("")}
        </div>
      `).join("");

      const checklistHtml = (trip.checklist || []).map((c, idx) => `
        <div style="display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid #EFECE4;">
          <label style="display:flex; align-items:center; gap:8px; font-size:14px; cursor:pointer; ${c.done ? 'text-decoration:line-through; color:var(--sub);' : 'font-weight:700;'}">
            <input type="checkbox" ${c.done ? "checked" : ""} onchange="toggleChecklistItem(${idx})" style="width:17px; height:17px;" />
            ${escapeHtml(c.text)}
          </label>
          <button class="mini-btn delete-btn" onclick="deleteChecklistItem(${idx})">✕</button>
        </div>
      `).join("");

      el.innerHTML = `
        <div class="form-card">
          <div style="font-size:16px; font-weight:900; margin-bottom:10px;">💰 雙軌記帳總覽 (預定票券 ＋ 現場額外消費)</div>
          ${summaryCardsHtml}
          <div style="margin-top:12px;">${detailRowsHtml}</div>
        </div>

        <div class="form-card">
          <div style="font-size:16px; font-weight:900; margin-bottom:10px;">🧳 行前準備與採買清單</div>
          <div style="display:flex; gap:8px; margin-bottom:10px;">
            <input type="text" class="form-input" id="newCheckItemInput" placeholder="新增攜帶物品或待辦事項..." />
            <button class="pill-btn primary" onclick="addChecklistItem()">新增</button>
          </div>
          <div>${checklistHtml}</div>
        </div>
      `;
    }

    function addChecklistItem() {
      const inp = document.getElementById("newCheckItemInput");
      const val = inp.value.trim();
      if (!val) return;
      const trip = getActiveTrip();
      trip.checklist = trip.checklist || [];
      trip.checklist.push({ text: val, done: false });
      inp.value = "";
      saveAppState();
      renderBudgetAndChecklist();
    }

    function toggleChecklistItem(idx) {
      const trip = getActiveTrip();
      if (trip.checklist && trip.checklist[idx]) {
        trip.checklist[idx].done = !trip.checklist[idx].done;
        saveAppState();
        renderBudgetAndChecklist();
      }
    }

    function deleteChecklistItem(idx) {
      const trip = getActiveTrip();
      trip.checklist.splice(idx, 1);
      saveAppState();
      renderBudgetAndChecklist();
    }

    /*************************************************************************
     * 11. ARCHIVE POSTER, PIN LOCK, JSON BACKUP & PWA ICON
     *************************************************************************/
    function openArchiveModal() {
      const trip = getActiveTrip();
      const canvas = document.getElementById("archiveCanvas");
      const ctx = canvas.getContext("2d");
      const W = canvas.width, H = canvas.height;

      const outerSwatch = OUTER_SWATCHES.find(s => s.id === appState.outerSwatchId) || OUTER_SWATCHES[0];
      ctx.fillStyle = outerSwatch.bg;
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = outerSwatch.text;
      ctx.font = "900 54px 'Noto Sans TC', sans-serif";
      ctx.fillText(trip.title, 84, 160);

      ctx.font = "700 26px 'JetBrains Mono', monospace";
      ctx.globalAlpha = 0.75;
      ctx.fillText(`DEPARTURE // ${trip.startDate || "ARCHIVE"} · ${trip.days.length} DAYS`, 84, 215);
      ctx.globalAlpha = 1;

      let y = 280;
      trip.days.forEach((d, dIdx) => {
        if (y > 1680) return;
        drawRoundedRect(ctx, 84, y, W - 168, 72, 16, "rgba(255,255,255,0.12)");
        ctx.fillStyle = outerSwatch.text;
        ctx.font = "800 28px 'JetBrains Mono', monospace";
        ctx.fillText(`DAY 0${dIdx + 1}   ${d.weatherText || ""}`, 114, y + 46);
        y += 96;

        d.items.filter(i => i.status !== "cancelled").forEach(item => {
          if (y > 1720) return;
          ctx.fillStyle = outerSwatch.text;
          ctx.font = "700 26px 'JetBrains Mono', monospace";
          ctx.fillText(`${item.startTime}`, 114, y);
          ctx.font = "800 30px 'Noto Sans TC', sans-serif";
          ctx.fillText(`${item.title} ${item.mood || ""}`, 230, y);
          const sub = formatItemSubtitle(item);
          if (sub) {
            y += 38;
            ctx.font = "500 23px 'Noto Sans TC', sans-serif";
            ctx.globalAlpha = 0.75;
            ctx.fillText(sub.slice(0, 36), 230, y);
            ctx.globalAlpha = 1;
          }
          y += 58;
        });
        y += 20;
      });

      // Low-profile bottom corner watermark
      ctx.fillStyle = outerSwatch.text;
      ctx.globalAlpha = 0.45;
      ctx.font = "700 22px 'JetBrains Mono', monospace";
      ctx.textAlign = "right";
      ctx.fillText("tabigram", W - 84, 1830);
      ctx.textAlign = "left";
      ctx.globalAlpha = 1;

      document.getElementById("archivePreviewImg").src = canvas.toDataURL("image/png");
      document.getElementById("archiveModal").classList.add("open");
    }

    function closeArchiveModal() {
      document.getElementById("archiveModal").classList.remove("open");
    }

    async function shareOrSaveArchiveImage() {
      const canvas = document.getElementById("archiveCanvas");
      await shareCanvasViaNativeOrDownload(canvas, `tabigram-archive-${Date.now()}.png`);
    }

    function openPinModal() {
      const current = appState.pinCode || "";
      const input = prompt(current ? "輸入新 4 位數密碼（留空可解除密碼鎖）：" : "設定 4 位數隱私密碼鎖：", current);
      if (input === null) return;
      appState.pinCode = input.trim();
      saveAppState();
      alert(appState.pinCode ? "已啟用密碼鎖保護。" : "已解除密碼鎖。");
    }

    function exportBackupJSON() {
      const blob = new Blob([JSON.stringify(appState, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `tabigram-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
    }

    function importBackupJSON(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (parsed && Array.isArray(parsed.trips)) {
            appState = Object.assign(appState, parsed);
            saveAppState();
            renderAll();
            alert("成功匯入旅行備份！");
          }
        } catch (err) {
          alert("JSON 檔案格式不正確。");
        }
      };
      reader.readAsText(file);
      e.target.value = "";
    }

    // Auto-mount crisp "旅" icon for iOS Home Screen
    function mountAppleTouchIcon() {
      const c = document.createElement("canvas");
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#141413";
      ctx.fillRect(0, 0, 512, 512);
      ctx.fillStyle = "#F6F3EC";
      ctx.font = "900 300px 'Noto Sans TC', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("旅", 256, 268);
      const link = document.createElement("link");
      link.rel = "apple-touch-icon";
      link.href = c.toDataURL("image/png");
      document.head.appendChild(link);
    }

    // Helpers
    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function drawRoundedRectPath(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawRoundedRect(ctx, x, y, w, h, r, fill) {
      drawRoundedRectPath(ctx, x, y, w, h, r);
      ctx.fillStyle = fill;
      ctx.fill();
    }

    function loadImageElement(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    // Boot
    window.addEventListener("DOMContentLoaded", () => {
      mountAppleTouchIcon();
      loadAppState();
      if (appState.pinCode) {
        const entered = prompt("請輸入 TABIGRAM 解鎖密碼：");
        if (entered !== appState.pinCode) {
          document.body.innerHTML = "<div style='padding:60px 20px; text-align:center; font-weight:800;'>🔒 密碼錯誤，請重新整理頁面再試。</div>";
          return;
        }
      }
      initFormSelectors();
      renderAll();
      refreshRealtimeWeather();
    });
  </script>
