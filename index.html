<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TABIGRAM</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TABIGRAM" />
  <meta name="theme-color" content="#F6F3EC" />

  <!-- Fonts: Dela Gothic One + JetBrains Mono + Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- D3-Geo & TopoJSON for Real 3D Orthographic Great Circle Flight Globe -->
  <script src="https://cdn.jsdelivr.net/npm/d3-array@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-geo@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

  <style>
    :root {
      --bg: #F6F3EC;
      --card: #FFFFFF;
      --ink: #191919;
      --sub: #6E6A63;
      --border: #E2DDD3;
      --accent: #C84B31;
      --accent-soft: #F9EBE8;
      --green: #16A34A;
      --display: 'Dela Gothic One', 'Noto Sans TC', sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      padding-bottom: 115px;
      overflow-x: hidden;
    }

    /* Top Header */
    .app-header {
      padding: calc(env(safe-area-inset-top, 16px) + 12px) 16px 10px;
      background: rgba(246, 243, 236, 0.94);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      background: #141413;
      color: #F6F3EC;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--display);
      font-weight: 400;
      font-size: 21px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.14);
      flex-shrink: 0;
    }

    .brand-title {
      font-family: var(--display);
      font-size: 23px;
      font-weight: 400;
      letter-spacing: 0.05em;
      color: var(--ink);
      line-height: 1;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .pill-btn {
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }

    .pill-btn.primary {
      background: var(--ink);
      color: #FFFFFF;
      border-color: var(--ink);
    }

    .pill-btn.accent-outline {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: #E8C5BD;
    }

    /* Trip Tabs */
    .trip-tabs-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .trip-tabs-bar::-webkit-scrollbar { display: none; }

    .trip-tab {
      white-space: nowrap;
      padding: 6px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      font-size: 13px;
      font-weight: 700;
      color: var(--sub);
      cursor: pointer;
    }
    .trip-tab.active {
      background: var(--ink);
      color: #FFFFFF;
      border-color: var(--ink);
    }
    .trip-tab.dashed {
      border-style: dashed;
      color: #2B5B84;
    }

    /* Main Container */
    .main-container {
      max-width: 640px;
      margin: 0 auto;
      padding: 14px 16px;
    }

    /* Day & Weather Bar */
    .day-weather-card {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.03);
    }

    .day-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .day-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      align-items: center;
    }

    .day-pill {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      padding: 6px 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--ink);
      cursor: pointer;
      white-space: nowrap;
    }
    .day-pill.active {
      background: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent);
    }

    .weather-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .weather-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      background: #F8F6F0;
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 700;
    }

    .solar-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--sub);
      margin-bottom: 7px;
      flex-wrap: wrap;
      gap: 4px;
    }

    .solar-legend {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      font-weight: 700;
    }

    .legend-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 3px;
    }

    .solar-track {
      position: relative;
      height: 11px;
      border-radius: 999px;
      background: linear-gradient(90deg, #1E293B 0%, #3B82F6 25%, #F59E0B 50%, #EA580C 75%, #1E293B 100%);
      overflow: visible;
      margin-top: 4px;
    }

    /* Orange Dot: Scheduled Itinerary Time */
    .solar-thumb-trip {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 3.5px solid var(--accent);
      box-shadow: 0 2px 6px rgba(0,0,0,0.28);
      z-index: 2;
      transition: left 0.25s ease;
    }

    /* Green Dot: Current Local Time (NOW) */
    .solar-thumb-now {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #22C55E;
      border: 2.5px solid #FFFFFF;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.28), 0 2px 6px rgba(0,0,0,0.3);
      z-index: 3;
      transition: left 0.25s ease;
    }

    /* Timeline Cards */
    .timeline-card {
      background: #FFFFFF;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.03);
      transition: transform 0.15s ease, border-color 0.15s ease;
      position: relative;
    }
    .timeline-card.now-active {
      border-color: var(--accent);
      box-shadow: 0 6px 20px rgba(200, 75, 49, 0.1);
    }
    .timeline-card.done-card {
      opacity: 0.74;
      background: #FAF8F4;
    }
    .timeline-card.cancelled-card {
      opacity: 0.5;
      background: #F3F1EC;
    }

    /* Card Top Row: Number, Time + Right Stamp & Status Buttons */
    .card-top-bar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .card-time-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
    }

    .step-circle {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--ink);
      color: #FFFFFF;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .now-active .step-circle {
      background: var(--accent);
    }

    .now-badge {
      background: var(--accent);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .time-text {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
    }

    .home-tz-sub {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--sub);
      background: #F4F1EA;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .status-btns {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      position: relative;
    }

    /* Mood Stamp Button on the same top row as Done/Cancel */
    .mood-stamp-btn {
      border: 1.5px dashed #C8B9A6;
      background: #FDFBF7;
      color: var(--sub);
      font-size: 14px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      height: 28px;
      transform: rotate(-3deg);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .mood-stamp-btn.stamped {
      border-style: solid;
      border-color: var(--accent);
      background: var(--accent-soft);
      font-size: 16px;
      transform: rotate(-5deg);
    }

    /* Floating Popover for Quick Emoji Stamp */
    .emoji-popover {
      position: absolute;
      top: 34px;
      right: 0;
      background: #FFFFFF;
      border: 1.5px solid var(--ink);
      border-radius: 14px;
      padding: 8px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      width: 215px;
      box-shadow: 0 10px 26px rgba(0,0,0,0.18);
      z-index: 60;
    }

    .status-btn {
      border: 1px dashed var(--border);
      background: #FFFFFF;
      color: var(--sub);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 8px;
      cursor: pointer;
      height: 28px;
      display: inline-flex;
      align-items: center;
    }
    .status-btn.active-done {
      border-style: solid;
      border-color: #166534;
      background: #DCFCE7;
      color: #166534;
    }
    .status-btn.active-cancel {
      border-style: solid;
      border-color: #991B1B;
      background: #FEE2E2;
      color: #991B1B;
    }

    /* Full-width Title & Subtitle */
    .card-full-body {
      width: 100%;
      margin-top: 4px;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .card-title {
      font-size: 19px;
      font-weight: 900;
      color: var(--ink);
      line-height: 1.35;
      margin: 0;
      word-break: break-word;
    }
    .cancelled-card .card-title {
      text-decoration: line-through;
    }

    .card-subtitle {
      font-size: 14px;
      font-weight: 600;
      color: var(--sub);
      margin-top: 4px;
      line-height: 1.45;
      width: 100%;
      word-break: break-word;
    }

    /* Note Box: Top-Left 90-degree sharp corner, other 3 corners rounded */
    .note-box {
      margin-top: 10px;
      background: #F8F6F1;
      border: 1px solid var(--border);
      border-radius: 0px 14px 14px 14px;
      padding: 10px 13px;
      font-size: 13.5px;
      color: #33312E;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Dedicated URL Chip */
    .url-chip-row {
      margin-top: 8px;
    }
    .url-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #EEF2F6;
      color: #1E40AF;
      border: 1px solid #CBD5E1;
      padding: 5px 11px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      text-decoration: none;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Expense & Extra Spend Badges on Card */
    .card-finance-box {
      margin-top: 10px;
      padding: 9px 12px;
      background: #FAF8F4;
      border: 1px dashed var(--border);
      border-radius: 10px;
      font-size: 12.5px;
    }
    .finance-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 0;
    }
    .finance-line.extra-item {
      color: var(--sub);
      font-size: 12px;
    }
    .inline-del-exp {
      border: none;
      background: transparent;
      color: #9CA3AF;
      cursor: pointer;
      font-size: 11px;
      padding: 0 4px;
    }

    /* Quick Inline Expense Drawer on Card */
    .quick-expense-drawer {
      margin-top: 10px;
      padding: 10px;
      background: #F4F1EA;
      border-radius: 12px;
      display: none;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .quick-expense-drawer.open {
      display: flex;
    }

    /* Card Polaroid Preview Strip */
    .card-photos-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-top: 10px;
      padding-bottom: 4px;
    }
    .card-photo-thumb {
      width: 68px;
      height: 68px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border);
      flex-shrink: 0;
      cursor: pointer;
    }

    /* Card Bottom Actions */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 13px;
      padding-top: 11px;
      border-top: 1px solid #EFECE4;
      gap: 8px;
      flex-wrap: wrap;
    }
    .card-actions-left {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .mini-btn {
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .mini-btn.share-highlight {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: #E8C5BD;
    }
    .mini-btn.delete-btn {
      color: #8C857B;
    }

    /* Bottom Floating Dock */
    .bottom-dock {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 12px) + 12px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px;
      display: flex;
      gap: 4px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.12);
      z-index: 200;
    }
    .dock-tab {
      border: none;
      background: transparent;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 13.5px;
      font-weight: 800;
      padding: 9px 18px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }
    .dock-tab.active {
      background: var(--ink);
      color: #FFFFFF;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 20, 19, 0.55);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 500;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-sheet {
      background: var(--bg);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      border-radius: 24px;
      padding: 20px;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.28);
      border: 1px solid var(--border);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .modal-title {
      font-size: 19px;
      font-weight: 900;
    }

    .form-card {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 5px;
      margin-top: 10px;
    }
    .form-label:first-child {
      margin-top: 0;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      font-family: var(--sans);
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #FFFFFF;
      color: var(--ink);
      appearance: none;
      -webkit-appearance: none;
    }
    .form-textarea.sharp-tl {
      border-radius: 0px 12px 12px 12px;
      min-height: 74px;
      resize: vertical;
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 480px) {
      .form-row-2.mobile-stack {
        grid-template-columns: 1fr;
      }
    }

    .time-select-group {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 6px;
    }

    .emoji-opt {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: #FAF8F4;
      font-size: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .emoji-opt.selected {
      border: 2px solid var(--accent);
      background: var(--accent-soft);
    }

    .leg-item {
      background: #F8F6F1;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .leg-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 6px;
    }

    .extra-exp-row {
      display: grid;
      grid-template-columns: 1.4fr 1fr auto;
      gap: 6px;
      margin-bottom: 6px;
      align-items: center;
    }

    #routeMapContainer {
      width: 100%;
      height: 62vh;
      border-radius: 20px;
      border: 1px solid var(--border);
      overflow: hidden;
      background: #E5E3DF;
    }

    .swatch-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .swatch-btn {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .swatch-btn.active {
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="app-header">
    <div class="brand-row">
      <div class="brand-logo">旅</div>
      <div class="brand-title">TABIGRAM</div>
    </div>

    <div class="top-actions">
      <button class="pill-btn primary" onclick="openItemModal()">＋ 新增行程</button>
      <button class="pill-btn" id="tripCountBtn" onclick="openTripManager()">旅行專案 (1)</button>
      <button class="pill-btn accent-outline" onclick="openArchiveModal()">典藏旅程</button>
      <button class="pill-btn" onclick="openPinModal()">密碼鎖</button>
      <button class="pill-btn" onclick="exportBackupJSON()">匯出</button>
      <button class="pill-btn" onclick="document.getElementById('importFileInput').click()">匯入</button>
      <input type="file" id="importFileInput" accept=".json" style="display:none" onchange="importBackupJSON(event)" />
    </div>

    <div class="trip-tabs-bar" id="tripTabsBar"></div>
  </header>

  <!-- Main Content -->
  <main class="main-container">
    <!-- Day & Real-time Open-Meteo Weather Bar -->
    <section class="day-weather-card">
      <div class="day-row">
        <div class="day-pills" id="dayPillsBar"></div>
        <button class="pill-btn" id="homeTzToggleBtn" onclick="toggleHomeTzCompare()">家鄉時區對照：開</button>
      </div>

      <div class="weather-strip">
        <div class="weather-badge" id="weatherBadge">☀️ 載入氣象中...</div>
        <div style="display:flex; gap:6px;">

    /*************************************************************************
     * 3. STATION & LOCATION COORDINATE RESOLVER
     *************************************************************************/
    function normalizeStationName(raw) {
      if (!raw) return "";
      return raw.trim().replace(/(車站|駅|Station|Sta\.|站)$/i, "").trim();
    }

    function lookupStationCoordSync(name) {
      if (!name) return null;
      const clean = normalizeStationName(name);
      if (STATION_COORDS[clean]) return { lat: STATION_COORDS[clean][0], lng: STATION_COORDS[clean][1] };
      if (STATION_COORDS[name.trim()]) return { lat: STATION_COORDS[name.trim()][0], lng: STATION_COORDS[name.trim()][1] };
      if (appState.geoCache && appState.geoCache[clean]) return appState.geoCache[clean];
      for (const k in STATION_COORDS) {
        if (clean.includes(k) || k.includes(clean)) {
          return { lat: STATION_COORDS[k][0], lng: STATION_COORDS[k][1] };
        }
      }
      return null;
    }

    async function geocodeStationOnline(name, tzHint) {
      const clean = normalizeStationName(name);
      if (!clean) return null;
      const syncHit = lookupStationCoordSync(clean);
      if (syncHit) return syncHit;

      let countryHint = "";
      if (tzHint === "Asia/Taipei") countryHint = "Taiwan";
      else if (tzHint === "Asia/Tokyo") countryHint = "Japan";
      else if (tzHint === "Asia/Seoul") countryHint = "South Korea";
      else if (tzHint === "Pacific/Honolulu") countryHint = "Hawaii USA";
      else if (tzHint === "America/Los_Angeles") countryHint = "California USA";

      try {
        const q = encodeURIComponent(`${clean} ${countryHint}`.trim());
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${q}`);
        const data = await res.json();
        if (data && data.length > 0) {
          const coord = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
          appState.geoCache = appState.geoCache || {};
          appState.geoCache[clean] = coord;
          saveAppState();
          return coord;
        }
      } catch (e) {}
      return null;
    }

    function getLineBrandColor(lineName, idx = 0) {
      if (!lineName) return ["#0070BD", "#E3002C", "#F8B61C", "#008659"][idx % 4];
      for (const rule of TRANSIT_LINE_COLORS) {
        if (rule.keys.some(k => lineName.includes(k))) return rule.color;
      }
      return ["#0070BD", "#E3002C", "#F8B61C", "#008659"][idx % 4];
    }

    function getDefaultCoordForTz(tz) {
      const map = {
        "Asia/Taipei": { lat: 25.0478, lng: 121.5170 },
        "Asia/Tokyo": { lat: 35.6812, lng: 139.7671 },
        "Asia/Seoul": { lat: 37.5665, lng: 126.9780 },

        "Europe/London": { lat: 51.5074, lng: -0.1278 },
        "Europe/Paris": { lat: 48.8566, lng: 2.3522 }
      };
      return map[tz] || map["Asia/Taipei"];
    }

    function detectDayTargetCoord(day, trip) {
      for (const item of day.items) {
        if (item.type === "transit" && item.transitLegs && item.transitLegs.length > 0) {
          const c = lookupStationCoordSync(item.transitLegs[0].from) || lookupStationCoordSync(item.transitLegs[0].to);
          if (c) return c;
        }
        if (item.type === "roadtrip" && item.roadFrom) {
          const c = lookupStationCoordSync(item.roadFrom) || lookupStationCoordSync(item.roadTo);
          if (c) return c;
        }
        if (item.type === "flight" && item.depIata && AIRPORT_COORDS[item.depIata.toUpperCase()]) {
          return AIRPORT_COORDS[item.depIata.toUpperCase()];
        }
        const byTitle = lookupStationCoordSync(item.title) || lookupStationCoordSync(item.subtitle);
        if (byTitle) return byTitle;
      }
      const tz = (day.items[0] && day.items[0].startTz) || trip.homeTz || "Asia/Taipei";
      return getDefaultCoordForTz(tz);
    }

    function weatherCodeToText(code) {
      if (code === 0) return { icon: "☀️", text: "晴朗" };
      if (code <= 3) return { icon: "⛅", text: "多雲" };
      if (code <= 48) return { icon: "🌫️", text: "薄霧" };
      if (code <= 67) return { icon: "🌧️", text: "降雨" };
      if (code <= 77) return { icon: "❄️", text: "降雪" };
      if (code <= 82) return { icon: "🌦️", text: "陣雨" };
      return { icon: "⛈️", text: "雷雨" };
    }

    async function refreshRealtimeWeather() {
      const trip = getActiveTrip();
      const day = getActiveDay();
      if (!day) return;

      const coord = detectDayTargetCoord(day, trip);
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${coord.lat}&longitude=${coord.lng}&daily=weathercode,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto&forecast_days=1`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data && data.daily) {
          const code = data.daily.weathercode[0];
          const maxT = Math.round(data.daily.temperature_2m_max[0]);
          const minT = Math.round(data.daily.temperature_2m_min[0]);
          const srRaw = data.daily.sunrise[0];
          const ssRaw = data.daily.sunset[0];

          const wInfo = weatherCodeToText(code);
          day.weatherText = `${wInfo.icon} ${wInfo.text} ${maxT}°C / ${minT}°C`;
          if (srRaw && srRaw.includes("T")) day.sunrise = srRaw.split("T")[1].slice(0, 5);
          if (ssRaw && ssRaw.includes("T")) day.sunset = ssRaw.split("T")[1].slice(0, 5);
          saveAppState();
          renderDayWeatherBar();
        }
      } catch (e) {
        renderDayWeatherBar();
      }
    }

    function hhmmToPercent(hhmm) {
      if (!hhmm || !hhmm.includes(":")) return 50;
      const [h, m] = hhmm.split(":").map(Number);
      return Math.min(98, Math.max(2, ((h * 60 + m) / 1440) * 100));
    }

    function updateSolarTrackDots() {
      const trip = getActiveTrip();
      const day = getActiveDay();
      if (!day) return;

      const sr = day.sunrise || "06:15";
      const ss = day.sunset || "17:30";
      const srPct = hhmmToPercent(sr);
      const ssPct = hhmmToPercent(ss);
      const noonPct = (srPct + ssPct) / 2;

      // Dynamic gradient aligned with actual sunrise & sunset
      const trackEl = document.getElementById("solarTrackBar");
      if (trackEl) {
        trackEl.style.background = `linear-gradient(90deg, #1E293B 0%, #1E293B ${Math.max(0, srPct - 6)}%, #38BDF8 ${srPct}%, #FACC15 ${noonPct}%, #FB923C ${ssPct}%, #1E293B ${Math.min(100, ssPct + 6)}%, #0F172A 100%)`;
      }

      // 1. Orange Dot: Active (first non-done, non-cancelled) itinerary item startTime
      const activeItem = day.items.find(i => i.status !== "done" && i.status !== "cancelled") || day.items[0];
      const tripTimeStr = activeItem ? (activeItem.startTime || "09:00") : "09:00";
      const tripPct = hhmmToPercent(tripTimeStr);
      const tripThumb = document.getElementById("solarThumbTrip");
      if (tripThumb) tripThumb.style.left = `${tripPct}%`;
      const tripLbl = document.getElementById("tripTimeIndicatorLabel");
      if (tripLbl) tripLbl.textContent = tripTimeStr;

      // 2. Green Dot: Real-time NOW in the active timezone

    function convertTimeBetweenTz(timeHHMM, fromTz, toTz) {
      if (!timeHHMM || !fromTz || !toTz || fromTz === toTz) return null;
      try {
        const [h, m] = timeHHMM.split(":").map(Number);
        const now = new Date();
        const utcDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), h, m));
        const getOffsetMin = (tz) => {
          const str = utcDate.toLocaleString("en-US", { timeZone: tz });
          const tzDate = new Date(str);
          return Math.round((tzDate - utcDate) / 60000);
        };
        const diffMin = getOffsetMin(toTz) - getOffsetMin(fromTz);
        let totalMin = h * 60 + m + diffMin;
        let dayShift = "";
        if (totalMin < 0) { totalMin += 1440; dayShift = " (-1日)"; }
        else if (totalMin >= 1440) { totalMin -= 1440; dayShift = " (+1日)"; }
        const nh = String(Math.floor(totalMin / 60)).padStart(2, "0");
        const nm = String(totalMin % 60).padStart(2, "0");
        return `${nh}:${nm}${dayShift}`;
      } catch (e) {
        return null;
      }
    }

    function formatItemSubtitle(item) {
      if (item.type === "transit" && Array.isArray(item.transitLegs) && item.transitLegs.length > 0) {
        return item.transitLegs.map(leg => {
          const trainBadge = leg.trainNo ? ` ${leg.trainNo}` : "";
          return `${leg.line || "路線"}${trainBadge} (${leg.from} ➔ ${leg.to})`;
        }).join(" ／ ");
      }
      if (item.type === "flight") {
        return `${item.flightNo || "FLIGHT"} (${(item.depIata || "DEP").toUpperCase()} ➔ ${(item.arrIata || "ARR").toUpperCase()})${item.gateSeat ? " · " + item.gateSeat : ""}`;
      }
      if (item.type === "roadtrip") {
        const stopsStr = item.roadStops ? ` ➔ ${item.roadStops} ➔ ` : " ➔ ";
        const hwyStr = item.roadHighway ? ` [${item.roadHighway}]` : "";
        return `🚗 ${item.roadFrom || "起點"}${stopsStr}${item.roadTo || "終點"}${hwyStr}`;
      }
      return item.subtitle || "";
    }

    function renderTimelineCards() {
      const container = document.getElementById("timelineView");
      container.innerHTML = "";
      const trip = getActiveTrip();
      const day = getActiveDay();

      if (!day.items || day.items.length === 0) {
        container.innerHTML = `
          <div class="timeline-card" style="text-align:center; padding:32px 16px; color:var(--sub);">
            <div style="font-size:15px; font-weight:800; margin-bottom:6px;">此日尚無行程卡片</div>
            <div style="font-size:13px;">點擊上方「＋ 新增行程」開始策展你的旅途時刻</div>
          </div>`;
        return;
      }

      const firstActiveIdx = day.items.findIndex(i => i.status !== "done" && i.status !== "cancelled");

      day.items.forEach((item, idx) => {
        const card = document.createElement("div");
        const isDone = item.status === "done";
        const isCancel = item.status === "cancelled";
        const isNow = idx === firstActiveIdx;

        card.className = "timeline-card" + (isNow ? " now-active" : "") + (isDone ? " done-card" : "") + (isCancel ? " cancelled-card" : "");

        let homeTzHtml = "";
        if (appState.showHomeTz && item.startTz && item.startTz !== trip.homeTz) {
          const convStart = convertTimeBetweenTz(item.startTime, item.startTz, trip.homeTz);
          if (convStart) {
            homeTzHtml = `<span class="home-tz-sub">家鄉 ${convStart}</span>`;
          }
        }

        const subText = formatItemSubtitle(item);

        // Finance Summary on Card
        const baseCost = Number(item.cost) || 0;
        const extras = Array.isArray(item.extraExpenses) ? item.extraExpenses : [];
        const extraSum = extras.reduce((acc, ex) => acc + (Number(ex.amount) || 0), 0);
        const cur = item.currency || "NT$";

        let financeHtml = "";
        if (baseCost > 0 || extras.length > 0) {
          const extraLines = extras.map((ex, exIdx) => `
            <div class="finance-line extra-item">
              <span>＋ ${escapeHtml(ex.name || "額外消費")}</span>
              <span>
                ${cur} ${Number(ex.amount || 0).toLocaleString()}
                <button class="inline-del-exp" title="刪除此筆消費" onclick="removeInlineExtraExpense('${item.id}', ${exIdx})">✕</button>
              </span>
            </div>`).join("");

          financeHtml = `
            <div class="card-finance-box">
              ${baseCost > 0 ? `<div class="finance-line"><strong>預定費用</strong><strong>${cur} ${baseCost.toLocaleString()}</strong></div>` : ""}
              ${extraLines}
              ${extras.length > 0 ? `<div class="finance-line" style="border-top:1px solid var(--border); margin-top:4px; padding-top:4px;"><strong>合計支出</strong><strong style="color:var(--accent);">${cur} ${(baseCost + extraSum).toLocaleString()}</strong></div>` : ""}
            </div>`;
        }

        const noteHtml = item.note && item.note.trim()
          ? `<div class="note-box">${escapeHtml(item.note.trim())}</div>`
          : "";

        let urlHtml = "";
        if (item.url && item.url.trim()) {
          const label = (item.urlLabel && item.urlLabel.trim()) ? item.urlLabel.trim() : item.url.trim();
          urlHtml = `
            <div class="url-chip-row">
              <a class="url-chip" href="${escapeHtml(item.url.trim())}" target="_blank" rel="noopener noreferrer">
                🔗 ${escapeHtml(label)}
              </a>
            </div>`;
        }

        let photosHtml = "";
        if (Array.isArray(item.photos) && item.photos.length > 0) {
          photosHtml = `<div class="card-photos-strip">` +
            item.photos.map((p, pIdx) => `<img class="card-photo-thumb" src="${p.dataUrl}" onclick="openShareModal('${item.id}', ${pIdx})" />`).join("") +
            `</div>`;
        }

        // Quick Emoji Stamp Popover HTML (Right next to Done / Cancel!)
        const isPopoverOpen = activeEmojiPopoverItemId === item.id;
        const popoverHtml = isPopoverOpen ? `
          <div class="emoji-popover" onclick="event.stopPropagation()">
            ${MOOD_EMOJIS.map(em => `
              <button type="button" class="emoji-opt ${item.mood === em ? 'selected' : ''}" onclick="setCardMoodStamp('${item.id}', '${em}')">${em}</button>
            `).join("")}
            <button type="button" class="mini-btn" style="width:100%; justify-content:center; margin-top:4px;" onclick="setCardMoodStamp('${item.id}', '')">清除心情印章</button>
          </div>
        ` : "";

        card.innerHTML = `
          <div class="card-top-bar">
            <div class="card-time-group">
              <span class="step-circle">${idx + 1}</span>
              ${isNow ? `<span class="now-badge">● NOW</span>` : ""}
              <span class="time-text">${item.startTime || "09:00"} → ${item.endTime || "10:00"}</span>
              ${homeTzHtml}
            </div>

            <!-- Stamp Emoji Button + Done + Cancel on the exact same top row! -->
            <div class="status-btns">
              <button type="button" class="mood-stamp-btn ${item.mood ? "stamped" : ""}" title="點選蓋上心情印章" onclick="toggleEmojiPopover(event, '${item.id}')">
                ${item.mood ? escapeHtml(item.mood) : "☺ 印章"}
              </button>
              ${popoverHtml}
              <button class="status-btn ${isDone ? "active-done" : ""}" onclick="toggleItemStatus('${item.id}', 'done')">完成</button>
              <button class="status-btn ${isCancel ? "active-cancel" : ""}" onclick="toggleItemStatus('${item.id}', 'cancelled')">取消</button>
            </div>
          </div>

          <div class="card-full-body">
            <div class="card-title-row">
              <h3 class="card-title">${escapeHtml(item.title || "未命名行程")}</h3>
            </div>
            ${subText ? `<div class="card-subtitle">${escapeHtml(subText)}</div>` : ""}
            ${noteHtml}
            ${urlHtml}
            ${financeHtml}

            <!-- Direct Inline Expense Input Drawer on Card -->
            <div class="quick-expense-drawer" id="expDrawer_${item.id}">
              <input type="text" class="form-input" id="expName_${item.id}" placeholder="消費品項 (如: 咖啡/紀念品)" style="flex:1.3; min-width:120px; padding:7px 10px; font-size:13px;" />

              <button type="button" class="mini-btn" style="background:var(--ink); color:#fff;" onclick="saveInlineExtraExpense('${item.id}')">入帳</button>
            </div>

            ${photosHtml}
          </div>

          <div class="card-footer">
            <div class="card-actions-left">
              <button class="mini-btn" onclick="openItemModal('${item.id}')">編輯</button>
              <button class="mini-btn" onclick="triggerQuickPhotoUpload('${item.id}', false)">照片 ${item.photos && item.photos.length ? `(${item.photos.length})` : ""}</button>
              <button class="mini-btn" onclick="toggleQuickExpenseDrawer('${item.id}')">＋ 消費</button>
              <button class="mini-btn" onclick="openExternalGoogleMap('${item.id}')">地圖</button>
              <button class="mini-btn share-highlight" onclick="openShareModal('${item.id}', 0)">分享</button>
            </div>
            <button class="mini-btn delete-btn" onclick="deleteItineraryItem('${item.id}')">刪除</button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function saveInlineExtraExpense(itemId) {
      const day = getActiveDay();
      const item = day.items.find(i => i.id === itemId);
      if (!item) return;
      const nameInp = document.getElementById(`expName_${itemId}`);
      const amtInp = document.getElementById(`expAmt_${itemId}`);
      const name = (nameInp.value || "").trim() || "現場消費";
      const amount = Number(amtInp.value) || 0;
      if (amount <= 0 && !nameInp.value.trim()) return;

      item.extraExpenses = Array.isArray(item.extraExpenses) ? item.extraExpenses : [];
      item.extraExpenses.push({ name, amount });
      saveAppState();
      renderAll();
    }

    function removeInlineExtraExpense(itemId, expIdx) {
      const day = getActiveDay();
      const item = day.items.find(i => i.id === itemId);
      if (!item || !Array.isArray(item.extraExpenses)) return;
      item.extraExpenses.splice(expIdx, 1);
      saveAppState();
      renderAll();
    }

    function toggleItemStatus(itemId, targetStatus) {
      const day = getActiveDay();
      const item = day.items.find(i => i.id === itemId);
      if (!item) return;
      item.status = (item.status === targetStatus) ? "normal" : targetStatus;
      saveAppState();
      renderAll();
    }

    function deleteItineraryItem(itemId) {
      if (!confirm("確定要刪除此行程卡片嗎？")) return;
      const day = getActiveDay();
      day.items = day.items.filter(i => i.id !== itemId);
      saveAppState();
      renderAll();
    }

    function openExternalGoogleMap(itemId) {
      const day = getActiveDay();
      const item = day.items.find(i => i.id === itemId);
      if (!item) return;
      let query = item.title;
      if (item.type === "transit" && item.transitLegs && item.transitLegs.length > 0) {
        const lastLeg = item.transitLegs[item.transitLegs.length - 1];
        query = `${lastLeg.to} 車站`;
      } else if (item.type === "roadtrip" && item.roadTo) {
        query = item.roadTo;
      } else if (item.subtitle) {
        query = `${item.title} ${item.subtitle}`;
      }
      window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`, "_blank");
    }

        document.getElementById("fRoadTo").value = item.roadTo || "";
        document.getElementById("fRoadStops").value = item.roadStops || "";
        document.getElementById("fRoadHighway").value = item.roadHighway || "";

        document.getElementById("fStartTz").value = item.startTz || trip.homeTz;
        document.getElementById("fEndTz").value = item.endTz || item.startTz || trip.homeTz;

        const [sh, sm] = (item.startTime || "09:00").split(":");
        const [eh, em] = (item.endTime || "10:00").split(":");
        document.getElementById("fStartHour").value = sh || "09";

        document.getElementById("fEndHour").value = eh || "10";
        document.getElementById("fEndMin").value = em || "00";

        document.getElementById("fCurrency").value = item.currency || "NT$";
        document.getElementById("fCost").value = item.cost || "";
        document.getElementById("fNote").value = item.note || "";
        document.getElementById("fUrl").value = item.url || "";
        document.getElementById("fUrlLabel").value = item.urlLabel || "";

        if (Array.isArray(item.transitLegs) && item.transitLegs.length > 0) {
          item.transitLegs.forEach(l => addTransitLegRow(l));
        } else {
          addTransitLegRow();
        }

        formTempPhotos = Array.isArray(item.photos) ? [...item.photos] : [];
      } else {
        const prevItem = day.items.length > 0 ? day.items[day.items.length - 1] : null;
        const inheritedTz = prevItem ? (prevItem.endTz || prevItem.startTz) : (trip.homeTz || "Asia/Taipei");
        const inheritedCurrency = prevItem ? (prevItem.currency || "NT$") : (inheritedTz === "Asia/Tokyo" ? "¥" : "NT$");

        document.getElementById("fType").value = "spot";
        document.getElementById("fTitle").value = "";
        document.getElementById("fSubtitle").value = "";
        document.getElementById("fDepIata").value = "";
        document.getElementById("fArrIata").value = "";
        document.getElementById("fFlightNo").value = "";
        document.getElementById("fGateSeat").value = "";
        document.getElementById("fRoadFrom").value = "";
        document.getElementById("fRoadTo").value = "";
        document.getElementById("fRoadStops").value = "";
        document.getElementById("fRoadHighway").value = "";

        document.getElementById("fStartTz").value = inheritedTz;
        document.getElementById("fEndTz").value = inheritedTz;

        const defaultStart = prevItem ? (prevItem.endTime || "10:00") : "09:00";
        const [sh, sm] = defaultStart.split(":");
        const nextHour = String((parseInt(sh, 10) + 1) % 24).padStart(2, "0");
        document.getElementById("fStartHour").value = sh || "09";
        document.getElementById("fStartMin").value = sm || "00";
        document.getElementById("fEndHour").value = nextHour;
        document.getElementById("fEndMin").value = sm || "00";

        document.getElementById("fCurrency").value = inheritedCurrency;
        document.getElementById("fCost").value = "";
        document.getElementById("fNote").value = "";
        document.getElementById("fUrl").value = "";
        document.getElementById("fUrlLabel").value = "";

        addTransitLegRow();
        formTempPhotos = [];
      }

      onTypeChange();
      renderFormPhotosPreview();
      document.getElementById("itemModal").classList.add("open");
    }

    function compressImageFile(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxDim = 1280;
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
              else { w = Math.round(w * (maxDim / h)); h = maxDim; }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            resolve({ dataUrl: canvas.toDataURL("image/jpeg", 0.82), caption: "" });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleFormPhotosUpload(e) {
      const files = Array.from(e.target.files || []);
      for (const f of files) {
        const compressed = await compressImageFile(f);
        formTempPhotos.push(compressed);
      }
      renderFormPhotosPreview();
      e.target.value = "";
    }

    async function saveItineraryItem() {
      const day = getActiveDay();
      const existingItem = editingItemId ? day.items.find(i => i.id === editingItemId) : null;

      const type = document.getElementById("fType").value;
      const title = document.getElementById("fTitle").value.trim() || "未命名行程";
      const subtitle = document.getElementById("fSubtitle").value.trim();
      const depIata = document.getElementById("fDepIata").value.trim().toUpperCase();
      const arrIata = document.getElementById("fArrIata").value.trim().toUpperCase();
      const flightNo = document.getElementById("fFlightNo").value.trim();
      const gateSeat = document.getElementById("fGateSeat").value.trim();
      const roadFrom = document.getElementById("fRoadFrom").value.trim();
      const roadTo = document.getElementById("fRoadTo").value.trim();
      const roadStops = document.getElementById("fRoadStops").value.trim();
      const roadHighway = document.getElementById("fRoadHighway").value.trim();

      const startTz = document.getElementById("fStartTz").value;
      const endTz = document.getElementById("fEndTz").value;
      const startTime = `${document.getElementById("fStartHour").value}:${document.getElementById("fStartMin").value}`;
      const endTime = `${document.getElementById("fEndHour").value}:${document.getElementById("fEndMin").value}`;

      const currency = document.getElementById("fCurrency").value;
      const cost = Number(document.getElementById("fCost").value) || 0;
      const note = document.getElementById("fNote").value;
      const url = document.getElementById("fUrl").value.trim();
      const urlLabel = document.getElementById("fUrlLabel").value.trim();

      const transitLegs = [];
      if (type === "transit") {
        document.querySelectorAll("#transitLegsContainer .leg-item").forEach(row => {
          const from = row.querySelector(".leg-from").value.trim();
          const to = row.querySelector(".leg-to").value.trim();
          const line = row.querySelector(".leg-line").value.trim();
          const trainNo = row.querySelector(".leg-train").value.trim();
          if (from || to) transitLegs.push({ from, to, line, trainNo });
        });
        for (const leg of transitLegs) {
          if (leg.from) await geocodeStationOnline(leg.from, startTz);
          if (leg.to) await geocodeStationOnline(leg.to, endTz);
        }
      } else if (type === "roadtrip") {
        if (roadFrom) await geocodeStationOnline(roadFrom, startTz);
        if (roadTo) await geocodeStationOnline(roadTo, endTz);
        if (roadStops) {
          for (const st of roadStops.split(/[,，、]/)) {
            if (st.trim()) await geocodeStationOnline(st.trim(), startTz);
          }
        }
      } else if (type === "spot") {
        await geocodeStationOnline(title, startTz);
      }

      const payload = {
        id: editingItemId || ("item_" + Date.now()),
        type,
        title,
        mood: existingItem ? (existingItem.mood || "") : "",
        subtitle,
        depIata,
        arrIata,
        flightNo,
        gateSeat,
        roadFrom,
        roadTo,
        roadStops,
        roadHighway,
        startTz,
        endTz,
        startTime,
        endTime,
        currency,
        cost,
        extraExpenses: existingItem && Array.isArray(existingItem.extraExpenses) ? existingItem.extraExpenses : [],
        note,
        url,
        urlLabel,
        transitLegs,
        photos: formTempPhotos,
        status: existingItem ? (existingItem.status || "normal") : "normal"
      };

      if (editingItemId) {
        const idx = day.items.findIndex(i => i.id === editingItemId);
        if (idx !== -1) day.items[idx] = payload;
      } else {
        day.items.push(payload);
      }

      saveAppState();
      closeItemModal();
      renderAll();
      refreshRealtimeWeather();
    }

    /**
     * TEMPLATE 2: Beck's Octilinear Metro Topology
     * - Endpoints: Solid circle in the exact same color as the line!
     * - Transfer Stations: Half-and-half split dual-color solid circle (left half incoming color, right half outgoing color)!
     */
    function drawBeckOctilinearTransitCard(ctx, item, cardX, cardY, cardW, cardH, innerSwatch) {
      drawRoundedRect(ctx, cardX, cardY, cardW, cardH, 32, innerSwatch.bg);

      const legs = (Array.isArray(item.transitLegs) && item.transitLegs.length > 0)
        ? item.transitLegs
        : [{ from: item.title.split(/to|➔|→/i)[0] || "起點站", to: item.title.split(/to|➔|→/i)[1] || "終點站", line: item.subtitle || "鐵道路線", trainNo: "" }];

      let legendY = cardY + 54;
      legs.forEach((leg, i) => {
        const col = getLineBrandColor(leg.line, i);
        drawRoundedRect(ctx, cardX + 46, legendY - 22, 18, 28, 6, col);
        ctx.fillStyle = innerSwatch.text;
        ctx.font = "700 24px 'Noto Sans TC', sans-serif";
        const trainBadge = leg.trainNo ? ` · ${leg.trainNo}` : "";
        ctx.fillText(`${leg.line || "路線"}${trainBadge} (${leg.from} ➔ ${leg.to})`, cardX + 76, legendY);
        legendY += 40;
      });

      ctx.strokeStyle = "rgba(0,0,0,0.08)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cardX + 46, legendY + 4);
      ctx.lineTo(cardX + cardW - 46, legendY + 4);
      ctx.stroke();

      const stations = [];
      legs.forEach((leg, idx) => {
        const col = getLineBrandColor(leg.line, idx);
        if (idx === 0) {
          stations.push({ name: leg.from, coord: lookupStationCoordSync(leg.from), inColor: col, outColor: col });
        } else {
          stations[stations.length - 1].outColor = col;
        }
        stations.push({ name: leg.to, coord: lookupStationCoordSync(leg.to), inColor: col, outColor: col, line: leg.line });
      });

      stations.forEach((st, i) => {
        if (!st.coord) st.coord = { lat: 25.0478 - i * 0.03, lng: 121.5170 + i * 0.02 };
      });

      const mapBoxX = cardX + 115;
      const mapBoxY = legendY + 65;
      const mapBoxW = cardW - 230;
      const mapBoxH = (cardY + cardH - 85) - mapBoxY;

      const rawPts = [{ x: 0, y: 0 }];
      for (let i = 1; i < stations.length; i++) {
        const prev = stations[i - 1].coord;
        const curr = stations[i].coord;
        const dLat = curr.lat - prev.lat;
        const dLng = (curr.lng - prev.lng) * Math.cos((prev.lat * Math.PI) / 180);
        const len = Math.hypot(dLng, dLat) || 0.01;
        const stepDist = 180;
        rawPts.push({
          x: rawPts[i - 1].x + (dLng / len) * stepDist,
          y: rawPts[i - 1].y + (-dLat / len) * stepDist
        });
      }

      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      rawPts.forEach(p => {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      });

      const spanX = Math.max(maxX - minX, 80);
      const spanY = Math.max(maxY - minY, 80);
      const scale = Math.min(mapBoxW / spanX, mapBoxH / spanY) * 0.78;
      const cx = mapBoxX + mapBoxW / 2;
      const cy = mapBoxY + mapBoxH / 2;
      const midX = (minX + maxX) / 2;
      const midY = (minY + maxY) / 2;

      const screenPts = rawPts.map(p => ({
        x: Math.round(cx + (p.x - midX) * scale),
        y: Math.round(cy + (p.y - midY) * scale)
      }));

      // Draw Octilinear Route Lines
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      for (let i = 1; i < screenPts.length; i++) {
        const p1 = screenPts[i - 1];
        const p2 = screenPts[i];
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const absX = Math.abs(dx);
        const absY = Math.abs(dy);
        const sgnX = Math.sign(dx) || 1;
        const sgnY = Math.sign(dy) || 1;

        ctx.strokeStyle = stations[i].inColor;
        ctx.lineWidth = 20;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);

        if (absX < 18 || absY < 18 || Math.abs(absX - absY) < 22) {
          ctx.lineTo(p2.x, p2.y);
        } else if (absX > absY) {
          ctx.lineTo(p1.x + sgnX * (absX - absY), p1.y);
          ctx.lineTo(p2.x, p2.y);
        } else {
          ctx.lineTo(p1.x, p1.y + sgnY * (absY - absX));
          ctx.lineTo(p2.x, p2.y);
        }
        ctx.stroke();
      }

      // Draw Solid Same-Color Endpoints & Split Dual-Color Transfer Nodes!
      screenPts.forEach((pt, idx) => {
        const st = stations[idx];
        const isTransfer = idx > 0 && idx < screenPts.length - 1 && st.inColor !== st.outColor;
        const r = 22;

        // Subtle outer white halo so solid nodes pop cleanly from line
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, r + 4, 0, Math.PI * 2);
        ctx.fillStyle = innerSwatch.bg;
        ctx.fill();

        if (isTransfer) {
          // Left half: incoming line color
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, r, Math.PI * 0.5, Math.PI * 1.5);
          ctx.closePath();
          ctx.fillStyle = st.inColor;
          ctx.fill();

          // Right half: outgoing line color
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, r, -Math.PI * 0.5, Math.PI * 0.5);
          ctx.closePath();
          ctx.fillStyle = st.outColor;
          ctx.fill();
        } else {
          // Solid single-color circle matching the route line color!
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
          ctx.fillStyle = st.inColor;
          ctx.fill();
        }

        // Station Name Label
        ctx.font = "900 32px 'Noto Sans TC', sans-serif";
        ctx.fillStyle = innerSwatch.text;
        const label = st.name;
        const tw = ctx.measureText(label).width;

        let lx = pt.x + 34;
        let ly = pt.y + 11;
        if (pt.x > cx + 40) lx = pt.x - tw - 34;
        if (idx === 0) {
          ly = pt.y - 30;
          lx = Math.max(cardX + 44, Math.min(cardX + cardW - tw - 44, pt.x - tw / 2));
        }
        ctx.fillText(label, lx, ly);
      });
    }

    /**
     * TEMPLATE 3: Vintage Ferry / Maritime Boarding Ticket Stub
     */
    function drawFerryTicketCard(ctx, item, cardX, cardY, cardW, cardH, innerSwatch, outerSwatch) {
      drawRoundedRect(ctx, cardX, cardY, cardW, cardH, 32, innerSwatch.bg);

      // Side perforated ticket notches
      ctx.fillStyle = outerSwatch.bg;
      ctx.beginPath();
      ctx.arc(cardX, cardY + cardH * 0.62, 26, 0, Math.PI * 2);
      ctx.arc(cardX + cardW, cardY + cardH * 0.62, 26, 0, Math.PI * 2);
      ctx.fill();

      // Dashed tear line
      ctx.strokeStyle = "rgba(0,0,0,0.16)";
      ctx.lineWidth = 3;
      ctx.setLineDash([12, 10]);
      ctx.beginPath();
      ctx.moveTo(cardX + 36, cardY + cardH * 0.62);
      ctx.lineTo(cardX + cardW - 36, cardY + cardH * 0.62);
      ctx.stroke();
      ctx.setLineDash([]);

      // Top Navy Maritime Header Band
      drawRoundedRect(ctx, cardX + 36, cardY + 36, cardW - 72, 92, 18, "#0F2942");
      ctx.fillStyle = "#FFFFFF";
      ctx.font = "800 26px 'JetBrains Mono', monospace";
      ctx.fillText("⛴ MARITIME FERRY BOARDING PASS", cardX + 68, cardY + 92);

      const leg = (item.transitLegs && item.transitLegs[0]) || {
        from: item.title.split(/to|➔|→/i)[0] || "DEPARTURE PIER",
        to: item.title.split(/to|➔|→/i)[1] || "ARRIVAL PIER",
        line: item.subtitle || "FERRY LINE",
        trainNo: "DECK PASS"
      };

      // Pier Departure -> Arrival Display
      ctx.fillStyle = "#64748B";
      ctx.font = "700 22px 'JetBrains Mono', monospace";
      ctx.fillText("EMBARKATION PIER", cardX + 64, cardY + 220);
      ctx.textAlign = "right";
      ctx.fillText("DESTINATION PIER", cardX + cardW - 64, cardY + 220);
      ctx.textAlign = "left";

      ctx.fillStyle = innerSwatch.text;
      ctx.font = "900 52px 'Noto Sans TC', sans-serif";
      ctx.fillText((leg.from || "出發港").slice(0, 6), cardX + 64, cardY + 295);

      ctx.textAlign = "right";
      ctx.fillText((leg.to || "抵達港").slice(0, 6), cardX + cardW - 64, cardY + 295);
      ctx.textAlign = "left";

      // Center Ship & Nautical Wave Graphic
      const midX = cardX + cardW / 2;
      ctx.strokeStyle = "#0284C7";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(midX - 95, cardY + 275);
      ctx.lineTo(midX + 95, cardY + 275);
      ctx.stroke();
      ctx.font = "38px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("⛴️", midX, cardY + 262);
      ctx.textAlign = "left";

      // Nautical Wave Curves
      ctx.strokeStyle = "rgba(2, 132, 199, 0.22)";
      ctx.lineWidth = 4;
      for (let wy = cardY + 380; wy <= cardY + 540; wy += 45) {
        ctx.beginPath();
        for (let wx = cardX + 64; wx <= cardX + cardW - 64; wx += 40) {
          ctx.quadraticCurveTo(wx + 10, wy - 10, wx + 20, wy);
          ctx.quadraticCurveTo(wx + 30, wy + 10, wx + 40, wy);
        }
        ctx.stroke();
      }

      // Lower Stub Details (Well-spaced columns, zero overlap)
      const stubY = cardY + cardH * 0.62 + 75;
      ctx.fillStyle = "#64748B";
      ctx.font = "700 20px 'JetBrains Mono', monospace";
      ctx.fillText("VESSEL / LINE", cardX + 64, stubY);
      ctx.fillText("SAILING TIME", cardX + 430, stubY);
      ctx.fillText("CLASS / NO.", cardX + 690, stubY);

      ctx.fillStyle = innerSwatch.text;
      ctx.font = "900 30px 'Noto Sans TC', sans-serif";
      ctx.fillText((leg.line || "高速船").slice(0, 10), cardX + 64, stubY + 48);
      ctx.font = "800 30px 'JetBrains Mono', monospace";
      ctx.fillText(item.startTime || "09:00", cardX + 430, stubY + 48);
      ctx.font = "800 28px 'Noto Sans TC', sans-serif";
      ctx.fillText((leg.trainNo || "自由席").slice(0, 8), cardX + 690, stubY + 48);

      // Barcode Strip at bottom of Ferry Ticket
      drawBarcodeStrip(ctx, cardX + 64, cardY + cardH - 135, cardW - 128, 70, innerSwatch.text);
    }

    /**
     * TEMPLATE 4: Refined Boarding Pass + Real 3D Orthographic Globe
     * Strictly engineered column spacing & letter-spacing so IATA codes, city names,
     * flight numbers, gates, and times NEVER overlap!
     */
    async function drawBoardingPassWith3DGlobeCard(ctx, item, cardX, cardY, cardW, cardH, innerSwatch, outerSwatch) {
      drawRoundedRect(ctx, cardX, cardY, cardW, cardH, 32, innerSwatch.bg);

      const depCode = (item.depIata || "TPE").toUpperCase().slice(0, 4);
      const arrCode = (item.arrIata || "NRT").toUpperCase().slice(0, 4);
      const dep = AIRPORT_COORDS[depCode] || AIRPORT_COORDS["TPE"];
      const arr = AIRPORT_COORDS[arrCode] || AIRPORT_COORDS["NRT"];

      // 1. Top Half: Real 3D Orthographic Globe Window (Height: 540px)
      const globeBoxX = cardX + 28;
      const globeBoxY = cardY + 28;
      const globeBoxW = cardW - 56;
      const globeBoxH = 540;
      drawRoundedRect(ctx, globeBoxX, globeBoxY, globeBoxW, globeBoxH, 24, "#0B1320");

      const land = await ensureWorldAtlasLoaded();
      const globeCx = globeBoxX + globeBoxW / 2;
      const globeCy = globeBoxY + globeBoxH / 2 + 10;
      const radius = 215;

      const midLng = (dep.lng + arr.lng) / 2;
      const midLat = (dep.lat + arr.lat) / 2;

      const projection = d3.geoOrthographic()
        .scale(radius)
        .translate([globeCx, globeCy])
        .rotate([-midLng, -midLat, 0])
        .clipAngle(90);

      const geoPath = d3.geoPath(projection, ctx);

      const grad = ctx.createRadialGradient(globeCx - 50, globeCy - 50, 20, globeCx, globeCy, radius);
      grad.addColorStop(0, "#1E2F4D");
      grad.addColorStop(1, "#09101D");
      ctx.beginPath();
      ctx.arc(globeCx, globeCy, radius, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      const graticule = d3.geoGraticule10();
      ctx.beginPath();
      geoPath(graticule);
      ctx.strokeStyle = "rgba(148, 163, 184, 0.16)";
      ctx.lineWidth = 1.4;
      ctx.stroke();

      if (land) {
        ctx.beginPath();
        geoPath(land);
        ctx.fillStyle = "#2A3E5C";
        ctx.fill();
        ctx.strokeStyle = "rgba(226, 232, 240, 0.38)";
        ctx.lineWidth = 1.4;
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(globeCx, globeCy, radius, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(200, 75, 49, 0.5)";
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Great Circle Route Curve
      const routeFeature = {
        type: "LineString",
        coordinates: [[dep.lng, dep.lat], [arr.lng, arr.lat]]
      };
      ctx.beginPath();
      geoPath(routeFeature);
      ctx.strokeStyle = "#F59E0B";
      ctx.lineWidth = 6;
      ctx.setLineDash([12, 8]);
      ctx.stroke();
      ctx.setLineDash([]);

      [[depCode, dep], [arrCode, arr]].forEach(([code, pt]) => {
        const p = projection([pt.lng, pt.lat]);
        if (!p) return;
        ctx.beginPath();
        ctx.arc(p[0], p[1], 9, 0, Math.PI * 2);
        ctx.fillStyle = "#C84B31";
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#FFFFFF";
        ctx.stroke();
      });

      // Top Left & Right HUD inside Globe Window (Strictly separated, zero overlap)
      ctx.fillStyle = "#94A3B8";
      ctx.font = "700 19px 'JetBrains Mono', monospace";
      ctx.fillText("GREAT CIRCLE TELEMETRY", globeBoxX + 30, globeBoxY + 42);
      ctx.textAlign = "right";
      ctx.fillStyle = "#F59E0B";
      ctx.fillText(`${item.flightNo || "FLIGHT"}`, globeBoxX + globeBoxW - 30, globeBoxY + 42);
      ctx.textAlign = "left";

      // 2. Boarding Pass Lower Section with Perforated Tear Line (Zero Overlap Typography!)
      const bpTop = globeBoxY + globeBoxH + 45;

      // Left Zone: Departure IATA | Center Zone: Plane Icon | Right Zone: Arrival IATA
      ctx.fillStyle = "#64748B";
      ctx.font = "700 18px 'JetBrains Mono', monospace";
      ctx.fillText("ORIGIN", cardX + 58, bpTop);
      ctx.textAlign = "right";
      ctx.fillText("DESTINATION", cardX + cardW - 58, bpTop);
      ctx.textAlign = "left";

      // Giant IATA 3-Letter Codes at fixed left/right anchors so they NEVER collide with center icon
      ctx.fillStyle = innerSwatch.text;
      ctx.font = "400 76px 'Dela Gothic One', sans-serif";
      ctx.fillText(depCode, cardX + 58, bpTop + 86);

      ctx.textAlign = "right";
      ctx.fillText(arrCode, cardX + cardW - 58, bpTop + 86);
      ctx.textAlign = "left";

      // Center Flight Path Arrow
      const centerAxis = cardX + cardW / 2;
      ctx.strokeStyle = "#CBD5E1";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(centerAxis - 65, bpTop + 60);
      ctx.lineTo(centerAxis + 65, bpTop + 60);
      ctx.stroke();
      ctx.fillStyle = "#C84B31";
      ctx.font = "34px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("✈️", centerAxis, bpTop + 72);
      ctx.textAlign = "left";

      // Airport Full Names (Truncated cleanly to max 16 chars each side)
      ctx.fillStyle = "#64748B";
      ctx.font = "700 18px 'JetBrains Mono', monospace";
      ctx.fillText((dep.name || "").slice(0, 16), cardX + 58, bpTop + 120);
      ctx.textAlign = "right";
      ctx.fillText((arr.name || "").slice(0, 16), cardX + cardW - 58, bpTop + 120);
      ctx.textAlign = "left";

      // Perforated Notch Line
      const notchY = bpTop + 162;
      ctx.fillStyle = outerSwatch.bg;
      ctx.beginPath();
      ctx.arc(cardX, notchY, 22, 0, Math.PI * 2);
      ctx.arc(cardX + cardW, notchY, 22, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "rgba(0,0,0,0.14)";
      ctx.lineWidth = 2.5;
      ctx.setLineDash([10, 8]);
      ctx.beginPath();
      ctx.moveTo(cardX + 36, notchY);
      ctx.lineTo(cardX + cardW - 36, notchY);
      ctx.stroke();
      ctx.setLineDash([]);

      // 3-Column Flight Metadata Grid (Fixed X coordinates: Col1=58, Col2=360, Col3=640)
      const gridY = notchY + 52;
      ctx.fillStyle = "#64748B";
      ctx.font = "700 18px 'JetBrains Mono', monospace";
      ctx.fillText("FLIGHT NO.", cardX + 58, gridY);
      ctx.fillText("DEPART / ARRIVE", cardX + 330, gridY);
      ctx.fillText("GATE / SEAT", cardX + 660, gridY);

      ctx.fillStyle = innerSwatch.text;
      ctx.font = "800 28px 'JetBrains Mono', monospace";
      ctx.fillText((item.flightNo || "BR198").slice(0, 9), cardX + 58, gridY + 42);
      ctx.fillText(`${item.startTime || "09:00"} → ${item.endTime || "13:00"}`, cardX + 330, gridY + 42);
      ctx.fillText((item.gateSeat || "GATE TBD").slice(0, 11), cardX + 660, gridY + 42);

      // Barcode Strip at bottom
      drawBarcodeStrip(ctx, cardX + 58, cardY + cardH - 115, cardW - 116, 64, innerSwatch.text);
    }

    /**
     * TEMPLATE 5: Road Trip Highway Milestone Card
     */
    function drawRoadTripLogCard(ctx, item, cardX, cardY, cardW, cardH, innerSwatch) {
      drawRoundedRect(ctx, cardX, cardY, cardW, cardH, 32, innerSwatch.bg);

      // Highway Shield Header
      drawRoundedRect(ctx, cardX + 42, cardY + 42, cardW - 84, 96, 20, "#1E3A2F");
      ctx.fillStyle = "#F6F3EC";
      ctx.font = "800 26px 'JetBrains Mono', monospace";
      ctx.fillText(`🚗 ROAD TRIP LOG // ${item.roadHighway || "HIGHWAY CRUISE"}`, cardX + 74, cardY + 100);

      const fromName = item.roadFrom || item.title.split(/to|➔|→/i)[0] || "起點";
      const toName = item.roadTo || item.title.split(/to|➔|→/i)[1] || "終點";
      const stopsList = item.roadStops ? item.roadStops.split(/[,，、]/).map(s => s.trim()).filter(Boolean) : [];
      const allNodes = [fromName, ...stopsList, toName];

      // Winding Asphalt Road Path through Center
      const startY = cardY + 230;
      const endY = cardY + cardH - 130;
      const stepY = (endY - startY) / Math.max(1, allNodes.length - 1);
      const cx = cardX + cardW / 2;

      const pts = allNodes.map((name, idx) => {
        const offset = idx === 0 || idx === allNodes.length - 1 ? 0 : (idx % 2 === 1 ? -110 : 110);
        return { name, x: cx + offset, y: startY + idx * stepY };
      });

      // Road Outer Asphalt
      ctx.strokeStyle = "#292524";
      ctx.lineWidth = 34;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      pts.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
      ctx.stroke();

      // Road Center Yellow Dashed Line
      ctx.strokeStyle = "#FACC15";
      ctx.lineWidth = 4;
      ctx.setLineDash([16, 14]);
      ctx.beginPath();
      pts.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw Milestone Pins
      pts.forEach((p, idx) => {
        const isEnd = idx === 0 || idx === pts.length - 1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, isEnd ? 22 : 16, 0, Math.PI * 2);
        ctx.fillStyle = isEnd ? "#C84B31" : "#16A34A";
        ctx.fill();
        ctx.lineWidth = 5;
        ctx.strokeStyle = "#FFFFFF";
        ctx.stroke();

        ctx.fillStyle = innerSwatch.text;
        ctx.font = isEnd ? "900 34px 'Noto Sans TC', sans-serif" : "700 28px 'Noto Sans TC', sans-serif";
        const tw = ctx.measureText(p.name).width;
        const lx = (p.x <= cx) ? (p.x + 36) : (p.x - tw - 36);
        ctx.fillText(p.name, lx, p.y + 11);
      });
    }

    function drawBarcodeStrip(ctx, x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.82;
      let curX = x;
      let seed = 17;
      while (curX < x + w - 8) {
        seed = (seed * 31 + 7) % 100;
        const bw = (seed % 3 === 0) ? 6 : ((seed % 2 === 0) ? 3 : 2);
        const gap = (seed % 4 === 0) ? 6 : 4;
        ctx.fillRect(curX, y, bw, h);
        curX += bw + gap;
      }
      ctx.globalAlpha = 1;
    }

    async function renderStoryCanvas() {
      if (!currentShareItem) return;
      const canvas = document.getElementById("storyCanvas");
      const ctx = canvas.getContext("2d");
      const W = canvas.width;
      const H = canvas.height;

      const trip = getActiveTrip();
      const item = currentShareItem;
      const tpl = document.getElementById("shareTemplateSelect").value;
      const showMood = document.getElementById("shareShowMoodCheck").checked;

      const outerSwatch = OUTER_SWATCHES.find(s => s.id === appState.outerSwatchId) || OUTER_SWATCHES[0];
      const innerSwatch = INNER_SWATCHES.find(s => s.id === appState.innerSwatchId) || INNER_SWATCHES[0];

      // 1. Outer Background Paper
      ctx.fillStyle = outerSwatch.bg;
      ctx.fillRect(0, 0, W, H);

      // 2. Clean Minimal Top Header (No bulky logo!)
      ctx.fillStyle = outerSwatch.text;
      ctx.globalAlpha = 0.85;
      ctx.font = "800 24px 'JetBrains Mono', monospace";
      const headerMap = {
        polaroid: "MOMENT LOG",
        transit: "TRANSIT ROUTE",
        ferry: "MARITIME PASS",
        flight: "BOARDING PASS",
        roadtrip: "ROAD TRIP LOG"
      };
      ctx.fillText(`DAY ${String(appState.activeDayIndex + 1).padStart(2, "0")} // ${headerMap[tpl] || "JOURNEY"}`, 84, 130);

      ctx.textAlign = "right";
      ctx.font = "700 24px 'Noto Sans TC', sans-serif";
      ctx.fillText(trip.title, W - 84, 130);
      ctx.textAlign = "left";

      ctx.strokeStyle = outerSwatch.text;
      ctx.globalAlpha = 0.18;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(84, 158);
      ctx.lineTo(W - 84, 158);
      ctx.stroke();
      ctx.globalAlpha = 1;

      // 3. Main Visual Frame (Y: 195 -> 1255)
      const mainX = 84, mainY = 195, mainW = W - 168, mainH = 1040;

      if (tpl === "transit") {
        drawBeckOctilinearTransitCard(ctx, item, mainX, mainY, mainW, mainH, innerSwatch);
      } else if (tpl === "ferry") {
        drawFerryTicketCard(ctx, item, mainX, mainY, mainW, mainH, innerSwatch, outerSwatch);
      } else if (tpl === "flight") {
        await drawBoardingPassWith3DGlobeCard(ctx, item, mainX, mainY, mainW, mainH, innerSwatch, outerSwatch);
      } else if (tpl === "roadtrip") {
        drawRoadTripLogCard(ctx, item, mainX, mainY, mainW, mainH, innerSwatch);
      } else {
        // Polaroid Frame Mode (Works for ANY item type!)
        drawRoundedRect(ctx, mainX, mainY, mainW, mainH, 24, "#FFFFFF");
        const photoX = mainX + 44, photoY = mainY + 44, photoW = mainW - 88, photoH = mainH - 210;

        ctx.save();
        drawRoundedRectPath(ctx, photoX, photoY, photoW, photoH, 12);
        ctx.clip();
        ctx.fillStyle = "#E5E0D5";
        ctx.fillRect(photoX, photoY, photoW, photoH);

        if (item.photos && item.photos[selectedSharePhotoIndex]) {
          const imgObj = await loadImageElement(item.photos[selectedSharePhotoIndex].dataUrl);
          const zoom = parseFloat(document.getElementById("photoZoomRange").value) || 1;
          const panX = parseFloat(document.getElementById("photoPanXRange").value) || 0;
          const panY = parseFloat(document.getElementById("photoPanYRange").value) || 0;

          const scale = Math.max(photoW / imgObj.width, photoH / imgObj.height) * zoom;
          const dw = imgObj.width * scale;
          const dh = imgObj.height * scale;
          const dx = photoX + (photoW - dw) / 2 + panX * 2.5;
          const dy = photoY + (photoH - dh) / 2 + panY * 2.5;
          ctx.drawImage(imgObj, dx, dy, dw, dh);
        } else {
          ctx.fillStyle = "#78716C";
          ctx.font = "700 28px 'Noto Sans TC', sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("點擊上方「＋ 新增相片」即可放入拍立得", photoX + photoW / 2, photoY + photoH / 2);
          ctx.textAlign = "left";
        }
        ctx.restore();

        const capText = document.getElementById("sharePolaroidCaption").value.trim();
        if (item.photos && item.photos[selectedSharePhotoIndex]) {
          item.photos[selectedSharePhotoIndex].caption = capText;
          saveAppState();
        }
        if (capText) {
          ctx.fillStyle = "#292524";
          ctx.font = "700 32px 'Noto Sans TC', sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(capText, mainX + mainW / 2, mainY + mainH - 72);
          ctx.textAlign = "left";
        }
      }

      // 4. Lower Summary Stub Card (Y: 1275 -> 1715)
      const ticketY = 1275, ticketH = 440;
      drawRoundedRect(ctx, mainX, ticketY, mainW, ticketH, 32, innerSwatch.bg);

      ctx.fillStyle = innerSwatch.text;
      ctx.font = "900 44px 'Noto Sans TC', sans-serif";
      const moodStr = (showMood && item.mood) ? `  ${item.mood}` : "";
      ctx.fillText(`${item.title}${moodStr}`, mainX + 54, ticketY + 96);

      ctx.fillStyle = "#57534E";
      ctx.font = "600 26px 'Noto Sans TC', sans-serif";
      const subLine = formatItemSubtitle(item) || item.note || "";
      ctx.fillText(subLine.slice(0, 34), mainX + 54, ticketY + 154);

      ctx.font = "800 27px 'JetBrains Mono', monospace";
      ctx.fillStyle = "#C84B31";
      ctx.fillText(`${item.startTime} → ${item.endTime} (${item.startTz})`, mainX + 54, ticketY + 225);

      // Red Stamp
      ctx.save();
      ctx.translate(mainX + mainW - 230, ticketY + 315);
      ctx.rotate(-0.06);
      ctx.strokeStyle = "#C84B31";
      ctx.lineWidth = 4;
      drawRoundedRectPath(ctx, -170, -52, 340, 104, 14);
      ctx.stroke();
      ctx.font = "800 22px 'JetBrains Mono', monospace";
      ctx.fillStyle = "#C84B31";
      ctx.textAlign = "center";
      ctx.fillText("TABIGRAM VERIFIED ✓", 0, -8);
      ctx.font = "700 19px 'JetBrains Mono', monospace";
      ctx.fillText(`${item.startTime} LOGGED`, 0, 26);
      ctx.restore();

      // 5. Low-Profile Corner Watermark in Dela Gothic One at Bottom-Right
      ctx.fillStyle = outerSwatch.text;
      ctx.globalAlpha = 0.42;
      ctx.font = "700 21px 'JetBrains Mono', monospace";
      ctx.fillText(`${trip.startDate || ""}`, mainX, 1795);
      ctx.textAlign = "right";
      ctx.font = "400 22px 'Dela Gothic One', sans-serif";
      ctx.fillText("TABIGRAM", W - 84, 1795);
      ctx.textAlign = "left";
      ctx.globalAlpha = 1;

      document.getElementById("storyPreviewImg").src = canvas.toDataURL("image/png");
    }

    async function shareOrSaveStoryImage() {
      const canvas = document.getElementById("storyCanvas");
      await shareCanvasViaNativeOrDownload(canvas, `tabigram-story-${Date.now()}.png`);
    }

    async function shareCanvasViaNativeOrDownload(canvas, filename) {
      try {
        const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
        if (blob && navigator.canShare) {
          const file = new File([blob], filename, { type: "image/png" });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: "TABIGRAM" });
            return;
          }
        }
        const a = document.createElement("a");
        a.href = canvas.toDataURL("image/png");
        a.download = filename;
        a.click();
      } catch (e) {}
    }

    function switchMainView(view) {
      document.getElementById("timelineView").style.display = (view === "timeline") ? "block" : "none";
      document.getElementById("mapView").style.display = (view === "map") ? "block" : "none";
      document.getElementById("budgetView").style.display = (view === "budget") ? "block" : "none";

      document.getElementById("tabBtnTimeline").classList.toggle("active", view === "timeline");
      document.getElementById("tabBtnMap").classList.toggle("active", view === "map");
