    const getTzInfo = (tzId) => TIMEZONES.find(t => t.id === tzId) || TIMEZONES[0];

    const QUICK_LANDMARKS = [

      { label: '洛杉磯 LAX', title: 'Los Angeles Intl Airport (LAX)', lat: 33.9416, lng: -118.4085, tz: 'America/Los_Angeles_STD' },
      { label: '舊金山 SFO', title: 'San Francisco Intl Airport (SFO)', lat: 37.6213, lng: -122.3790, tz: 'America/Los_Angeles_STD' },
      { label: '芝加哥 ORD', title: 'O\'Hare Intl Airport (ORD)', lat: 41.9742, lng: -87.9073, tz: 'America/Chicago_STD' },
      { label: '紐約 JFK', title: 'John F. Kennedy Intl Airport (JFK)', lat: 40.6413, lng: -73.7781, tz: 'America/New_York_STD' },
      { label: '檀香山 HNL', title: 'Daniel K. Inouye Intl Airport (HNL)', lat: 21.3187, lng: -157.9224, tz: 'Pacific/Honolulu' },
    ];

    const CATEGORIES = {
      transit: { label: '交通・航班', color: '#1C1B18', badgeBg: '#1C1B18', badgeText: '#F7F6F2', isTicket: true },
      sight:   { label: '景點・探索', color: '#2B5B84', badgeBg: '#E6EEF4', badgeText: '#1D4261', isTicket: false },
      food:    { label: '餐飲・咖啡', color: '#B85D19', badgeBg: '#F9ECE3', badgeText: '#8F420B', isTicket: false },
      stay:    { label: '住宿・休憩', color: '#3F624D', badgeBg: '#E7EFEA', badgeText: '#2A4736', isTicket: false },
      shop:    { label: '購物・選物', color: '#7A4988', badgeBg: '#F2EAF5', badgeText: '#583063', isTicket: false },
    };

    // ============================================================================
    // 2. 工具函式
    // ============================================================================
    const timeToMins = (t) => {
      if (!t || typeof t !== 'string' || !t.includes(':')) return 0;
      const [h, m] = t.split(':').map(Number);
      return (isNaN(h) ? 0 : h) * 60 + (isNaN(m) ? 0 : m);
    };

    const minsToTime = (mins) => {
      let m = ((mins % 1440) + 1440) % 1440;
      const h = Math.floor(m / 60);
      const min = Math.round(m % 60);
      return `${String(h).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
    };

    const calcRealDuration = (startTime, endTime, startTzId, endTzId, dayOffset = 0) => {
      if (!startTime || !endTime) return null;
      const startTz = getTzInfo(startTzId);
      const endTz = getTzInfo(endTzId);
      const startUtcMins = timeToMins(startTime) - startTz.offset * 60;
      const endUtcMins = timeToMins(endTime) + dayOffset * 1440 - endTz.offset * 60;
      let diff = endUtcMins - startUtcMins;
      if (diff < 0 && dayOffset === 0) diff += 1440;
      if (diff <= 0 || diff > 2880) return null;
      const h = Math.floor(diff / 60);
      const m = diff % 60;
      const tzDiff = endTz.offset - startTz.offset;
      return {
        hours: h,
        mins: m,
        text: `${h}h ${m > 0 ? `${m}m` : ''}`.trim(),
        tzDiff,
      };
    };

    const convertToTaiwanTime = (localTime, localTzId) => {
      if (!localTime) return null;
      const tz = getTzInfo(localTzId);
      if (tz.offset === 8) return null;
      const totalMins = timeToMins(localTime) + (8 - tz.offset) * 60;
      let dayShift = '';
      if (totalMins >= 1440) dayShift = ' (+1日)';
      else if (totalMins < 0) dayShift = ' (-1日)';
      return `TW ${minsToTime(totalMins)}${dayShift}`;
    };

    const estimateSunTimes = (lat = 35.68, dateStr = '2026-12-01') => {
      try {
        const d = new Date(dateStr);
        const start = new Date(d.getFullYear(), 0, 0);
        const dayOfYear = Math.floor((d - start) / 86400000) || 335;
        const rad = Math.PI / 180;
        const decl = 23.45 * Math.sin(rad * (360 / 365) * (dayOfYear - 81));
        const cosH = -Math.tan(lat * rad) * Math.tan(decl * rad);
        const clamped = Math.max(-0.95, Math.min(0.95, cosH));
        const halfDayHours = Math.acos(clamped) / rad / 15;
        const sunriseHour = 12 - halfDayHours - 0.15;
        const sunsetHour = 12 + halfDayHours - 0.15;
        return {
          sunrise: minsToTime(Math.round(sunriseHour * 60)),
          sunset: minsToTime(Math.round(sunsetHour * 60)),
        };
      } catch {
        return { sunrise: '06:30', sunset: '16:45' };
      }
    };

    const renderTextWithLinks = (text) => {
      if (!text) return null;
      const str = String(text);
      const urlRegex = /(https?:\/\/[^\s]+|www\.[^\s]+)/gi;
      const parts = str.split(urlRegex);
      return parts.map((part, idx) => {
        if (/^(https?:\/\/|www\.)/i.test(part)) {
          const href = part.startsWith('http') ? part : `https://${part}`;
          let shortDisplay = part.replace(/^https?:\/\/(www\.)?/i, '');
          if (shortDisplay.length > 34) shortDisplay = shortDisplay.slice(0, 32) + '…';
          return (
            <a
              key={idx}
              href={href}
              target="_blank"
              rel="noopener noreferrer"
              onClick={(e) => e.stopPropagation()}
              title={part}
              className="inline-flex items-center gap-1 px-2 py-0.5 mx-0.5 my-0.5 rounded bg-[#1C1B18]/10 hover:bg-[#1C1B18] text-[#1C1B18] hover:text-[#F7F6F2] font-mono text-[11px] underline decoration-dotted transition-colors break-all"
            >
              <span>🔗 {shortDisplay}</span>
              <span className="text-[10px] opacity-75">↗</span>
            </a>
          );
        }
        return <React.Fragment key={idx}>{part}</React.Fragment>;
      });
    };

    const parseGoogleMapsInput = (input) => {
      if (!input) return null;
      const trimmed = input.trim();
      const directCoord = trimmed.match(/^(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)$/);
      if (directCoord) {
        return { lat: parseFloat(directCoord[1]), lng: parseFloat(directCoord[2]) };
      }
      const bangMatch = trimmed.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
      if (bangMatch) {
        return { lat: parseFloat(bangMatch[1]), lng: parseFloat(bangMatch[2]) };
      }
      const atMatch = trimmed.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
      if (atMatch) {
        return { lat: parseFloat(atMatch[1]), lng: parseFloat(atMatch[2]) };
      }
      const qCoord = trimmed.match(/[?&](?:q|query|ll)=(-?\d+\.\d+),(-?\d+\.\d+)/);
      if (qCoord) {
        return { lat: parseFloat(qCoord[1]), lng: parseFloat(qCoord[2]) };
      }
      const placeMatch = trimmed.match(/\/maps\/(?:place|search)\/([^/?&@]+)/);
      if (placeMatch) {
        try {
          const placeName = decodeURIComponent(placeMatch[1].replace(/\+/g, ' '));
          return { extractedQuery: placeName };
        } catch {}
      }
      return null;
    };

    const guessTimezoneByCoord = (lat, lng) => {
      if (lng >= 118 && lng <= 123.5 && lat >= 21 && lat <= 26.5) return 'Asia/Taipei';
      if (lng >= 127 && lng <= 146 && lat >= 24 && lat <= 46) return 'Asia/Tokyo';
      if (lng >= -161 && lng <= -154 && lat >= 18 && lat <= 23) return 'Pacific/Honolulu';
      if (lng >= -125 && lng < -114) return 'America/Los_Angeles_STD';
      if (lng >= -114 && lng < -102) return 'America/Denver_STD';
      if (lng >= -102 && lng < -85) return 'America/Chicago_STD';
      if (lng >= -85 && lng <= -66) return 'America/New_York_STD';
      return null;
    };

    const compressImageToBase64 = (file, maxWidth = 680, quality = 0.72) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              let w = img.width;
              let h = img.height;
              if (w > maxWidth) {
                h = Math.round((h * maxWidth) / w);
                w = maxWidth;
              }
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);
              const result = canvas.toDataURL('image/jpeg', quality);
              canvas.width = 0;
              canvas.height = 0;
              resolve(result);
            } catch (err) {
              reject(err);
            }
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    };

    const makePassToken = (tripId, passcode) => {
      const str = `${tripId}::${passcode || ''}`;
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      return `tok_${Math.abs(hash).toString(36)}`;
    };

    // ============================================================================
    // 3. 預設初始旅程資料
    // ============================================================================
    const DEFAULT_TRIPS = [
      {
        id: 'trip-default-1',
        name: 'TPE ➔ USA 跨時區之旅',
        subtitle: 'TAIWAN TO WEST / CENTRAL / EAST COAST',
        dateRange: '2026.12',
        currency: '$',
        passcode: '',
        checklist: [
          { id: 'c1', text: '護照效期確認 & ESTA 電子簽證核准 https://esta.cbp.dhs.gov', done: true },
          { id: 'c2', text: '開通跨國漫遊 eSIM 與離線地圖下載', done: false },
        ],
        days: [
          {
            id: 'day-1',
            dayNumber: 1,
            date: '2026-12-01',
            title: '台灣出發 ➔ 飛往洛杉磯 (跨越國際換日線)',
            weatherNote: 'TPE 19°C / LAX 18°C 晴朗',
            timezone: 'Asia/Taipei',
            sunrise: '06:25',
            sunset: '17:05',
            items: [
              {
                id: 'item-101',
                time: '10:30',
                endTime: '23:40',
                startTz: 'Asia/Taipei',
                endTz: 'Asia/Taipei',
                dayOffset: 0,
                category: 'transit',
                title: '桃園國際機場 (TPE) 報到・前往登機門',
                station: 'Terminal 2 第二航廈',
                transitNext: '搭乘越洋直飛航班 (約 11h 50m)',
                cost: 0,
                lat: 25.0797,
                lng: 121.2342,
                mapUrl: 'https://www.google.com/maps/place/桃園國際機場/@25.0797,121.2342,15z',
                note: '起飛前 3 小時抵達櫃檯託運行李。航班查詢：https://www.starlux-airlines.com',
                stamped: false,
                photos: [],
              },
              {
                id: 'item-102',
                time: '23:40',
                endTime: '19:30',
                startTz: 'Asia/Taipei',
                endTz: 'America/Los_Angeles_STD',
                dayOffset: 0,
                category: 'transit',
                title: '抵達洛杉磯國際機場 (LAX)・入境與轉機休息',
                station: 'Tom Bradley Intl Terminal (TBIT)',
                transitNext: '步行或搭乘航廈接駁車前往 Sepulveda Blvd',
                cost: 35,
                lat: 33.9416,
                lng: -118.4085,
                mapUrl: 'https://www.google.com/maps/place/Los+Angeles+International+Airport/@33.9416,-118.4085,15z',
                note: '因為時差 -16 小時，抵達時間依然是同一天傍晚！手錶請調整為美西時間 (UTC-8)。',
                stamped: false,
                photos: [],
              }
            ]
          }
        ]
      }
    ];

    const STORAGE_KEY = 'tabi_note_v6_trips';
    const UNLOCK_STORAGE_KEY = 'tabi_note_v6_unlocked_tokens';

    // ============================================================================
    // 4. 主應用程式元件
    // ============================================================================
    function App() {
      const [trips, setTrips] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return DEFAULT_TRIPS;
      });

      const [activeTripId, setActiveTripId] = useState(() => trips[0]?.id || 'trip-default-1');
      const [activeDayIndex, setActiveDayIndex] = useState(0);
      const [selectedItemId, setSelectedItemId] = useState(null);

      const [mobileTab, setMobileTab] = useState('timeline');
      const [liveMode, setLiveMode] = useState(false);
      const [showTaiwanTime, setShowTaiwanTime] = useState(true);

      const [unlockedTokens, setUnlockedTokens] = useState(() => {
        try {
          const saved = localStorage.getItem(UNLOCK_STORAGE_KEY);
          return saved ? JSON.parse(saved) : {};
        } catch {
          return {};
        }
      });

      const [passInput, setPassInput] = useState('');
      const [rememberDevice, setRememberDevice] = useState(true);
      const [passError, setPassError] = useState('');
      const [sessionUnlockedIds, setSessionUnlockedIds] = useState({});

      const [itemModalOpen, setItemModalOpen] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [dayModalOpen, setDayModalOpen] = useState(false);
      const [tripModalOpen, setTripModalOpen] = useState(false);
      const [tripManagerOpen, setTripManagerOpen] = useState(false);
      const [storyItem, setStoryItem] = useState(null);
      const [lightbox, setLightbox] = useState(null);
      const [toastMsg, setToastMsg] = useState('');

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(trips));
        } catch (e) {
          showToast('⚠️ 手機瀏覽器暫存空間已滿，建議先匯出 JSON 或離線紀念冊備份');
        }
      }, [trips]);

      useEffect(() => {
        try {
          localStorage.setItem(UNLOCK_STORAGE_KEY, JSON.stringify(unlockedTokens));
        } catch (e) {}
      }, [unlockedTokens]);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const urlTripId = params.get('trip');
        const urlPass = params.get('pass');
        if (urlTripId) {
          const target = trips.find(t => t.id === urlTripId);
          if (target) {
            setActiveTripId(target.id);
            if (urlPass && target.passcode && urlPass === target.passcode) {
              const token = makePassToken(target.id, target.passcode);
              setUnlockedTokens(prev => ({ ...prev, [target.id]: token }));
              setSessionUnlockedIds(prev => ({ ...prev, [target.id]: true }));
              showToast(`🔓 已透過專屬連結永久解鎖「${target.name}」`);
            }
          }
        }
      }, []);

      const activeTrip = useMemo(
        () => trips.find(t => t.id === activeTripId) || trips[0],
        [trips, activeTripId]
      );

      const isTripLocked = useMemo(() => {
        if (!activeTrip?.passcode) return false;
        if (sessionUnlockedIds[activeTrip.id]) return false;
        const expectedToken = makePassToken(activeTrip.id, activeTrip.passcode);
        return unlockedTokens[activeTrip.id] !== expectedToken;
      }, [activeTrip, unlockedTokens, sessionUnlockedIds]);

      const activeDay = useMemo(() => {
        if (!activeTrip || !activeTrip.days || !activeTrip.days.length) return null;
        return activeTrip.days[Math.min(activeDayIndex, activeTrip.days.length - 1)];
      }, [activeTrip, activeDayIndex]);

      const handleSelectTrip = (tripId) => {
        setActiveTripId(tripId);
        setActiveDayIndex(0);
        setSelectedItemId(null);
        setPassInput('');
        setPassError('');
      };

      const handleUnlockSubmit = (e) => {
        e.preventDefault();
        if (!activeTrip) return;
        if (passInput === activeTrip.passcode) {
          const token = makePassToken(activeTrip.id, activeTrip.passcode);
          if (rememberDevice) {
            setUnlockedTokens(prev => ({ ...prev, [activeTrip.id]: token }));
          }
          setSessionUnlockedIds(prev => ({ ...prev, [activeTrip.id]: true }));
          setPassInput('');
          setPassError('');
          showToast('🔓 解鎖成功！此裝置已記住通行狀態');
        } else {
          setPassError('密碼不正確，請重新輸入');
        }
      };

      const handleRelockTrip = () => {
        if (!activeTrip) return;
        setUnlockedTokens(prev => {
          const next = { ...prev };
          delete next[activeTrip.id];
          return next;
        });
        setSessionUnlockedIds(prev => {
          const next = { ...prev };
          delete next[activeTrip.id];
          return next;
        });
        showToast('🔒 已在此裝置重新上鎖');
      };

      const handleCopyMagicLink = () => {
        if (!activeTrip) return;
        const baseUrl = window.location.origin + window.location.pathname;
        const url = activeTrip.passcode
          ? `${baseUrl}?trip=${encodeURIComponent(activeTrip.id)}&pass=${encodeURIComponent(activeTrip.passcode)}`
          : `${baseUrl}?trip=${encodeURIComponent(activeTrip.id)}`;
        navigator.clipboard?.writeText(url);
        showToast('🔗 已複製同行友人專屬免輸密碼連結！');
      };

      // ============================================================================
      // 5. 右側 Leaflet 互動路線地圖同步
      // ============================================================================
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const markersLayerRef = useRef(null);

      useEffect(() => {
        if (isTripLocked || !mapContainerRef.current || !window.L) return;
        if (!mapInstanceRef.current) {
          const map = window.L.map(mapContainerRef.current, {
            center: [25.0797, 121.2342],
            zoom: 11,
            zoomControl: true,
          });
          window.L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19
          }).addTo(map);
          markersLayerRef.current = window.L.layerGroup().addTo(map);
          mapInstanceRef.current = map;
        }
        return () => {
          if (isTripLocked && mapInstanceRef.current) {
            mapInstanceRef.current.remove();
            mapInstanceRef.current = null;
            markersLayerRef.current = null;
          }
        };
      }, [isTripLocked, mobileTab]);

      useEffect(() => {
        const map = mapInstanceRef.current;
        const layer = markersLayerRef.current;
        if (!map || !layer || !activeDay || isTripLocked) return;

        try {
          setTimeout(() => {
            if (mapInstanceRef.current) mapInstanceRef.current.invalidateSize();
          }, 120);
          layer.clearLayers();

          const validItems = (activeDay.items || []).filter(
            it => typeof it.lat === 'number' && typeof it.lng === 'number' && !isNaN(it.lat) && !isNaN(it.lng)
          );

          if (validItems.length === 0) return;

          const latlngs = [];
          validItems.forEach((item, idx) => {
            const isSelected = item.id === selectedItemId;
            const cat = CATEGORIES[item.category] || CATEGORIES.sight;
            latlngs.push([item.lat, item.lng]);

            const iconHtml = `
              <div class="custom-map-marker" style="
                width: ${isSelected ? '30px' : '24px'};
                height: ${isSelected ? '30px' : '24px'};
                background: ${isSelected ? '#B85D19' : cat.color};
                color: #F7F6F2;
                border: 2px solid #F7F6F2;
                transform: scale(${isSelected ? 1.15 : 1});
              ">
                ${idx + 1}
              </div>
            `;
            const icon = window.L.divIcon({
              html: iconHtml,
              className: '',
              iconSize: [30, 30],
              iconAnchor: [15, 15],
            });

            const marker = window.L.marker([item.lat, item.lng], { icon })
              .bindPopup(`
                <div style="font-family:'Noto Sans TC',sans-serif;min-width:150px;">
                  <div style="font-size:10px;color:#666;font-family:monospace;">#${idx + 1} · ${item.time || ''}</div>
                  <div style="font-weight:700;font-size:13px;margin:2px 0;">${item.title}</div>
                  ${item.station ? `<div style="font-size:11px;color:#555;">📍 ${item.station}</div>` : ''}
                </div>
              `);
            marker.on('click', () => setSelectedItemId(item.id));
            marker.addTo(layer);
          });

          if (latlngs.length >= 2) {
            window.L.polyline(latlngs, {
              color: '#1C1B18',
              weight: 2.5,
              opacity: 0.75,
              dashArray: '6, 6',
            }).addTo(layer);
          }

          const selectedTarget = validItems.find(i => i.id === selectedItemId);
          if (selectedTarget) {
            map.flyTo([selectedTarget.lat, selectedTarget.lng], Math.max(map.getZoom(), 14), { duration: 0.6 });
          } else if (latlngs.length === 1) {
            map.setView(latlngs[0], 13);
          } else {
            map.fitBounds(latlngs, { padding: [36, 36], maxZoom: 14 });
          }
        } catch (err) {}
      }, [activeDay, selectedItemId, isTripLocked, mobileTab]);

      const googleMapsMultiRouteUrl = useMemo(() => {
        if (!activeDay?.items?.length) return 'https://www.google.com/maps';
        const pts = activeDay.items.filter(it => it.lat && it.lng);
        if (pts.length === 0) return 'https://www.google.com/maps';
        if (pts.length === 1) return `https://www.google.com/maps/search/?api=1&query=${pts[0].lat},${pts[0].lng}`;
        const origin = `${pts[0].lat},${pts[0].lng}`;
        const destination = `${pts[pts.length - 1].lat},${pts[pts.length - 1].lng}`;
        const waypoints = pts.slice(1, -1).map(p => `${p.lat},${p.lng}`).join('|');
        return `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}${waypoints ? `&waypoints=${encodeURIComponent(waypoints)}` : ''}&travelmode=transit`;
      }, [activeDay]);

      // ============================================================================
      // 6. 行程增刪改 & 匯出 JSON & 一鍵下載離線紀念冊 HTML
      // ============================================================================
      const updateActiveTrip = (updater) => {
        setTrips(prev => prev.map(t => (t.id === activeTrip.id ? updater(t) : t)));
      };

      const handleAddDay = () => {
        if (!activeTrip) return;
        const lastDay = activeTrip.days[activeTrip.days.length - 1];
        let nextDateStr = '2026-12-02';
        if (lastDay?.date) {
          const d = new Date(lastDay.date);
          if (!isNaN(d)) {
            d.setDate(d.getDate() + 1);
            nextDateStr = d.toISOString().slice(0, 10);
          }
        }
        const inheritedTz = lastDay?.timezone || 'Asia/Taipei';
        const newDay = {
          id: `day-${Date.now()}`,
          dayNumber: activeTrip.days.length + 1,
          date: nextDateStr,
          title: `Day ${activeTrip.days.length + 1} 行程探索`,
          weatherNote: '晴時多雲',
          timezone: inheritedTz,
          sunrise: lastDay?.sunrise || '06:30',
          sunset: lastDay?.sunset || '17:15',
          items: [],
        };
        updateActiveTrip(t => ({ ...t, days: [...t.days, newDay] }));
        setActiveDayIndex(activeTrip.days.length);
        showToast(`＋ 已新增 Day ${activeTrip.days.length + 1}`);
      };

      const handleDeleteCurrentDay = () => {
        if (!activeTrip || activeTrip.days.length <= 1) {
          showToast('至少需保留一天行程');
          return;
        }
        if (!window.confirm(`確定要刪除 Day ${activeDay.dayNumber}「${activeDay.title}」嗎？`)) return;
        updateActiveTrip(t => {
          const filtered = t.days.filter((_, idx) => idx !== activeDayIndex)
            .map((d, idx) => ({ ...d, dayNumber: idx + 1 }));
          return { ...t, days: filtered };
        });
        setActiveDayIndex(Math.max(0, activeDayIndex - 1));
      };

      const handleMoveItem = (itemId, direction) => {
        updateActiveTrip(t => ({
          ...t,
          days: t.days.map((d, idx) => {
            if (idx !== activeDayIndex) return d;
            const list = [...d.items];
            const i = list.findIndex(x => x.id === itemId);
            const targetIdx = i + direction;
            if (i < 0 || targetIdx < 0 || targetIdx >= list.length) return d;
            [list[i], list[targetIdx]] = [list[targetIdx], list[i]];
            return { ...d, items: list };
          })
        }));
      };

      const handleSortItemsByTime = () => {
        updateActiveTrip(t => ({
          ...t,
          days: t.days.map((d, idx) => {
            if (idx !== activeDayIndex) return d;
            const sorted = [...d.items].sort((a, b) => timeToMins(a.time) - timeToMins(b.time));
            return { ...d, items: sorted };
          })
        }));
        showToast('⏱️ 已依時間順序排列今日行程');
      };

      const handleToggleStamp = (itemId) => {
        updateActiveTrip(t => ({
          ...t,
          days: t.days.map((d, idx) => {
            if (idx !== activeDayIndex) return d;
            return {
              ...d,
              items: d.items.map(it => it.id === itemId ? { ...it, stamped: !it.stamped } : it)
            };
          })
        }));
      };

      const handleDeleteItem = (itemId) => {
        if (!window.confirm('確定要刪除這個行程節點嗎？')) return;
        updateActiveTrip(t => ({
          ...t,
          days: t.days.map((d, idx) => {
            if (idx !== activeDayIndex) return d;
            return { ...d, items: d.items.filter(it => it.id !== itemId) };
          })
        }));
      };

      const handleExportJSON = (singleTripOnly = false) => {
        const payload = singleTripOnly ? [activeTrip] : trips;
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = singleTripOnly
          ? `tabi-note-${activeTrip.name.replace(/\s+/g, '_')}.json`
          : `tabi-note-all-trips-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('📥 已匯出 JSON 備份檔');
      };

      const handleDownloadOfflineBook = () => {
        if (!activeTrip) return;
        const esc = (s) => String(s || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');

        const daysHtml = activeTrip.days.map((d) => {
          const tzObj = getTzInfo(d.timezone);
          const itemsHtml = (d.items || []).map((it, idx) => {
            const cat = CATEGORIES[it.category] || CATEGORIES.sight;
            const startTz = getTzInfo(it.startTz || d.timezone);
            const endTz = getTzInfo(it.endTz || it.startTz || d.timezone);
            const photosHtml = (it.photos || []).map(ph => `
              <div class="polaroid">
                <img src="${ph.url}" alt="" />
                ${ph.caption ? `<div class="cap">${esc(ph.caption)}</div>` : ''}
              </div>
            `).join('');

            return `
              <div class="card">
                ${it.stamped ? '<div class="stamp">★ VISITED ✓</div>' : ''}
                <div class="meta">
                  <span class="num">#${String(idx + 1).padStart(2, '0')}</span>
                  <span class="time">${esc(it.time)} (${startTz.short})${it.endTime ? ` ➔ ${esc(it.endTime)} (${endTz.short})` : ''}</span>
                  <span class="cat" style="background:${cat.badgeBg};color:${cat.badgeText};">${cat.label}</span>
                  ${Number(it.cost) > 0 ? `<span class="cost">${esc(activeTrip.currency)}${Number(it.cost).toLocaleString()}</span>` : ''}
                </div>
                <h3>${esc(it.title)}</h3>
                ${it.station ? `<div class="station">🚉 ${esc(it.station)}</div>` : ''}
                ${it.note ? `<div class="note">${esc(it.note).replace(/\n/g, '<br/>')}</div>` : ''}
                ${photosHtml ? `<div class="gallery">${photosHtml}</div>` : ''}
                ${it.transitNext ? `<div class="transit">⇣ NEXT: ${esc(it.transitNext)}</div>` : ''}
              </div>
            `;
          }).join('');

          return `
            <section class="day-section">
              <div class="day-header">
                <div class="day-badge">DAY ${String(d.dayNumber).padStart(2, '0')} · ${esc(d.date)} · ${tzObj.label}</div>
                <h2>${esc(d.title)}</h2>
                ${d.weatherNote ? `<div class="weather">☁️ ${esc(d.weatherNote)} · 🌅 ${esc(d.sunrise)} / 🌇 ${esc(d.sunset)}</div>` : ''}
              </div>
              ${itemsHtml || '<p class="empty">本日無行程紀錄</p>'}
            </section>
          `;
        }).join('');

        const standaloneHtml = `<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>${esc(activeTrip.name)} — TABI NOTE 離線紀念冊</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; background: #F7F6F2; color: #1C1B18; margin: 0; padding: 24px 16px 60px; line-height: 1.6; }
    .container { max-width: 820px; margin: 0 auto; }
    .cover { border-bottom: 3px solid #1C1B18; padding-bottom: 20px; margin-bottom: 32px; }
    .brand { display: inline-flex; align-items: center; gap: 8px; font-family: monospace; font-weight: bold; font-size: 13px; letter-spacing: 2px; margin-bottom: 12px; }
    .brand-icon { background: #1C1B18; color: #F7F6F2; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; }
    h1 { font-size: 32px; margin: 4px 0 6px; font-family: Georgia, serif; }
    .sub { font-family: monospace; font-size: 12px; color: #555; }
    .day-section { margin-bottom: 40px; }
    .day-header { background: #1C1B18; color: #F7F6F2; padding: 14px 18px; margin-bottom: 16px; }
    .day-badge { font-family: monospace; font-size: 11px; color: #F4A261; }
    .day-header h2 { margin: 4px 0; font-size: 20px; }
    .weather { font-family: monospace; font-size: 11px; opacity: 0.85; }
    .card { position: relative; background: #fff; border: 1px solid #1C1B18; box-shadow: 4px 4px 0 #1C1B18; padding: 16px 18px; margin-bottom: 16px; }
    .stamp { position: absolute; top: 14px; right: 16px; transform: rotate(-10deg); border: 2px solid #B91C1C; color: #B91C1C; font-family: monospace; font-size: 11px; font-weight: bold; padding: 2px 6px; background: #FEF2F2; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-family: monospace; font-size: 12px; border-bottom: 1px dashed #ccc; padding-bottom: 8px; margin-bottom: 10px; }
    .num { background: #1C1B18; color: #fff; padding: 1px 6px; border-radius: 99px; font-weight: bold; }
    .time { font-weight: bold; }
    .cat { padding: 1px 8px; font-size: 11px; font-weight: 600; }
    .cost { color: #B85D19; font-weight: bold; margin-left: auto; }
    .card h3 { margin: 0 0 6px; font-size: 19px; font-family: Georgia, serif; }
    .station { font-family: monospace; font-size: 12px; color: #444; margin-bottom: 8px; }
    .note { background: #F7F6F2; border-left: 3px solid #1C1B18; padding: 10px 12px; font-size: 13px; margin: 8px 0; }
    .gallery { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
    .polaroid { width: 210px; background: #fff; border: 1px solid #ccc; padding: 8px 8px 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .polaroid img { width: 100%; height: 155px; object-fit: cover; display: block; }
    .cap { font-size: 12px; color: #333; margin-top: 6px; font-family: Georgia, serif; }
    .transit { margin-top: 10px; padding-top: 8px; border-top: 1px dotted #ccc; font-family: monospace; font-size: 11px; color: #555; }
    @media print { body { background: #fff; padding: 0; } .card { break-inside: avoid; box-shadow: none; } }
  </style>
</head>
<body>
  <div class="container">
    <header class="cover">
      <div class="brand"><span class="brand-icon">旅</span> TABI NOTE · OFFLINE ARCHIVE</div>
      <h1>${esc(activeTrip.name)}</h1>
      <div class="sub">${esc(activeTrip.dateRange)} · ${esc(activeTrip.subtitle)} · 封存日期 ${new Date().toISOString().slice(0, 10)}</div>
    </header>
    ${daysHtml}
  </div>
</body>
</html>`;

        const blob = new Blob([standaloneHtml], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${activeTrip.name.replace(/\s+/g, '_')}_離線紀念冊.html`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('📖 已下載獨立離線紀念冊 HTML！無需網路雙擊即可翻閱');
      };

      const handleImportJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            const importedList = Array.isArray(parsed) ? parsed : [parsed];
            if (!importedList[0]?.days) throw new Error('Invalid format');
            setTrips(prev => {
              const merged = [...prev];
              importedList.forEach(incoming => {
                const existIdx = merged.findIndex(x => x.id === incoming.id);
                if (existIdx >= 0) merged[existIdx] = incoming;
                else merged.push(incoming);
              });
              return merged;
            });
            setActiveTripId(importedList[0].id);
            setActiveDayIndex(0);
            showToast(`✅ 成功載入 ${importedList.length} 趟旅行計畫！`);
          } catch {
            alert('JSON 檔案格式不正確，請確認是否為 TABI NOTE 匯出的檔案。');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const budgetStats = useMemo(() => {
        if (!activeTrip) return { dayTotal: 0, tripTotal: 0, byCat: {} };
        const dayTotal = (activeDay?.items || []).reduce((acc, it) => acc + (Number(it.cost) || 0), 0);
        const byCat = {};
        let tripTotal = 0;
        activeTrip.days.forEach(d => {
          d.items.forEach(it => {
            const c = Number(it.cost) || 0;
            tripTotal += c;
            byCat[it.category] = (byCat[it.category] || 0) + c;
          });
        });
        return { dayTotal, tripTotal, byCat };
      }, [activeTrip, activeDay]);

      // ============================================================================
      // 7. 畫面渲染
      // ============================================================================
      return (
        <div className="min-h-screen flex flex-col pb-20 lg:pb-10">
          {toastMsg && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[100] bg-[#1C1B18] text-[#F7F6F2] px-4 py-2 rounded-full text-xs font-mono shadow-lg border border-[#F7F6F2]/20 max-w-[90vw] text-center">
              {toastMsg}
            </div>
          )}

          {/* 刊頭 Header */}
          <header className="border-b border-[#1C1B18] bg-[#F7F6F2]/95 sticky top-0 z-30 backdrop-blur-sm">
            <div className="max-w-[1440px] mx-auto px-4 sm:px-6 py-2.5 flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center gap-2.5">
                <span className="w-7 h-7 flex items-center justify-center bg-[#1C1B18] text-[#F7F6F2] font-serif text-sm font-bold">
                  旅
                </span>
                <h1 className="font-mono text-lg sm:text-xl tracking-widest font-bold">
                  TABI NOTE
                </h1>
              </div>

              <div className="flex items-center gap-1.5 sm:gap-2 flex-wrap">
                <button
                  onClick={() => setLiveMode(!liveMode)}
                  className={`px-2.5 py-1 text-xs font-mono border border-[#1C1B18] transition-colors ${
                    liveMode ? 'bg-[#B85D19] text-white border-[#B85D19]' : 'bg-white hover:bg-[#1C1B18] hover:text-white'
                  }`}
                >
                  {liveMode ? '● 旅途進行中' : '✎ 編輯規劃'}
                </button>

                <button
                  onClick={() => setTripManagerOpen(true)}
                  className="px-2.5 py-1 text-xs font-mono border border-[#1C1B18] bg-white hover:bg-[#1C1B18] hover:text-white transition-colors"
                >
                  🗂️ 旅行專案 ({trips.length})
                </button>

                {!isTripLocked && (
                  <>
                    <button
                      onClick={handleDownloadOfflineBook}
                      className="px-2.5 py-1 text-xs font-mono border border-[#1C1B18] bg-[#F9ECE3] text-[#8F420B] hover:bg-[#B85D19] hover:text-white transition-colors font-semibold"
                    >
                      📖 離線紀念冊
                    </button>
                    <button
                      onClick={() => handleExportJSON(false)}
                      className="px-2.5 py-1 text-xs font-mono border border-[#1C1B18] bg-white hover:bg-[#1C1B18] hover:text-white transition-colors"
                    >
                      匯出 JSON
                    </button>
                  </>
                )}

                <label className="px-2.5 py-1 text-xs font-mono border border-[#1C1B18] bg-white hover:bg-[#1C1B18] hover:text-white transition-colors cursor-pointer">
                  匯入
                  <input type="file" accept=".json" onChange={handleImportJSON} className="hidden" />
                </label>
              </div>
            </div>

            {/* 多趟旅行分頁列 */}
            <div className="border-t border-[#1C1B18]/20 bg-[#EFECE6] px-4 sm:px-6 py-1.5 flex items-center gap-2 overflow-x-auto no-scrollbar">
              <span className="font-mono text-[10px] uppercase tracking-widest text-[#1C1B18]/60 shrink-0">
                TRIPS:
              </span>
              {trips.map((t, idx) => {
                const isCurrent = t.id === activeTrip?.id;
                const hasPass = Boolean(t.passcode);
                const tok = makePassToken(t.id, t.passcode);
                const unlocked = !hasPass || unlockedTokens[t.id] === tok || sessionUnlockedIds[t.id];
                return (
                  <button
                    key={t.id}
                    onClick={() => handleSelectTrip(t.id)}
                    className={`px-3 py-1 text-xs font-mono shrink-0 border transition-all flex items-center gap-1.5 ${
                      isCurrent
                        ? 'bg-[#1C1B18] text-[#F7F6F2] border-[#1C1B18] font-semibold'
                        : 'bg-[#F7F6F2] text-[#1C1B18] border-[#1C1B18]/30 hover:border-[#1C1B18]'
                    }`}
                  >
                    <span className="opacity-60">{String(idx + 1).padStart(2, '0')}</span>
                    {hasPass && <span>{unlocked ? '🔓' : '🔒'}</span>}
                    <span>{t.name}</span>
                  </button>
                );
              })}
              <button
                onClick={() => setTripManagerOpen(true)}
                className="px-2.5 py-1 text-xs font-mono shrink-0 border border-dashed border-[#1C1B18]/50 hover:border-[#1C1B18] text-[#1C1B18]/80 hover:bg-white"
              >
                + 新增旅行分頁
              </button>
            </div>
          </header>

          {/* 密碼鎖定畫面 */}
          {isTripLocked ? (
            <div className="flex-1 flex items-center justify-center p-6">
              <div className="max-w-md w-full bg-white border-2 border-[#1C1B18] p-6 sm:p-8 shadow-[6px_6px_0px_#1C1B18]">
                <div className="font-mono text-[11px] tracking-widest uppercase text-[#B85D19] font-bold mb-1">
                  PRIVATE TRAVEL ARCHIVE · 受密碼保護
                </div>
                <h2 className="font-serif text-2xl font-bold mb-2">{activeTrip.name}</h2>
                <p className="text-xs text-[#1C1B18]/70 mb-5 leading-relaxed">

                                  : 'bg-white text-[#1C1B18] border-[#1C1B18]/30'
                              }`}
                            >
                              <span className="font-bold mr-1">#{idx + 1}</span>
                              <span>{it.title.slice(0, 12)}</span>
                            </button>
                          ))}
                        </div>
                      )}
                    </div>

                    <div className={`bg-white border border-[#1C1B18] p-4 shadow-[4px_4px_0px_#1C1B18] space-y-4 ${
                      mobileTab === 'map' ? 'hidden lg:block' : 'block'
                    }`}>
                      <div className="border-b border-[#1C1B18]/20 pb-3 flex items-baseline justify-between">
                        <div>
                          <div className="font-mono text-[10px] uppercase tracking-widest text-[#1C1B18]/60">
                            BUDGET SUMMARY
                          </div>
                          <div className="font-serif text-xl font-bold">
                            今日預估：{activeTrip.currency}{budgetStats.dayTotal.toLocaleString()}
                          </div>
                        </div>
                        <div className="text-right font-mono text-xs">
                          總旅費：{activeTrip.currency}{budgetStats.tripTotal.toLocaleString()}
                        </div>
                      </div>

                      <div>
                        <div className="font-mono text-xs font-bold uppercase tracking-wider mb-2">
                          ✓ CHECKLIST & LINKS · 行前備忘
                        </div>
                        <div className="space-y-1.5 mb-2.5">
                          {(activeTrip.checklist || []).map(ck => (
                            <div key={ck.id} className="flex items-start justify-between gap-2 text-xs py-1 border-b border-dashed border-[#1C1B18]/15">
                              <label className="flex items-start gap-2 cursor-pointer flex-1">
                                <input
                                  type="checkbox"
                                  checked={ck.done}
                                  onChange={() => {
                                    updateActiveTrip(t => ({
                                      ...t,
                                      checklist: t.checklist.map(c => c.id === ck.id ? { ...c, done: !c.done } : c)
                                    }));
                                  }}
                                  className="mt-0.5 accent-[#1C1B18]"
                                />
                                <span className={ck.done ? 'line-through opacity-50' : ''}>
                                  {renderTextWithLinks(ck.text)}
                                </span>
                              </label>
                              {!liveMode && (
                                <button
                                  onClick={() => {
                                    updateActiveTrip(t => ({
                                      ...t,
                                      checklist: t.checklist.filter(c => c.id !== ck.id)
                                    }));
                                  }}
                                  className="text-[#1C1B18]/40 hover:text-red-600 font-mono px-1"
                                >
                                  ×
                                </button>
                              )}
                            </div>
                          ))}
                        </div>

                        {!liveMode && (
                          <form
                            onSubmit={(e) => {
                              e.preventDefault();
                              const val = e.target.elements.ckText.value.trim();
                              if (!val) return;
                              updateActiveTrip(t => ({
                                ...t,
                                checklist: [...(t.checklist || []), { id: `ck-${Date.now()}`, text: val, done: false }]
                              }));
                              e.target.reset();
                            }}
                            className="flex gap-1.5"
                          >
                            <input
                              name="ckText"
                              placeholder="新增待辦事項或貼上預訂網址..."
                              className="flex-1 px-2.5 py-1.5 text-xs border border-[#1C1B18]/40 focus:outline-none focus:border-[#1C1B18]"
                            />
                            <button
                              type="submit"
                              className="px-3 py-1.5 bg-[#1C1B18] text-white font-mono text-xs"
                            >
                              +
                            </button>
                          </form>
                        )}
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </main>
          )}

          {/* 手機版 RWD 固定底部切換導覽列 */}
          {!isTripLocked && (
            <nav className="lg:hidden fixed bottom-0 left-0 right-0 z-40 bg-[#1C1B18] text-[#F7F6F2] border-t border-[#F7F6F2]/20 grid grid-cols-4 text-center font-mono text-[11px]">
              <button
                onClick={() => setMobileTab('timeline')}
                className={`py-3 ${mobileTab === 'timeline' ? 'bg-[#B85D19] font-bold' : 'opacity-75'}`}
              >
                📅 時間軸
              </button>
              <button
                onClick={() => setMobileTab('map')}
                className={`py-3 ${mobileTab === 'map' ? 'bg-[#B85D19] font-bold' : 'opacity-75'}`}
              >
                🗺️ 路線圖
              </button>
              <button
                onClick={() => setMobileTab('budget')}
                className={`py-3 ${mobileTab === 'budget' ? 'bg-[#B85D19] font-bold' : 'opacity-75'}`}
              >
                💰 清單/預算
              </button>
              <button
                onClick={() => setTripManagerOpen(true)}
                className="py-3 opacity-75"
              >
                🗂️ 切換旅行
              </button>
            </nav>
          )}

          {/* 彈窗 1：新增 / 編輯行程節點 Modal */}
          {itemModalOpen && activeDay && (
            <ItemEditorModal
              day={activeDay}
              initialItem={editingItem}
              onClose={() => {
                setItemModalOpen(false);
                setEditingItem(null);
              }}
              onSave={(savedItem) => {
                updateActiveTrip(t => ({
                  ...t,
                  days: t.days.map((d, idx) => {
                    if (idx !== activeDayIndex) return d;
                    const exists = d.items.some(i => i.id === savedItem.id);
                    const nextItems = exists
                      ? d.items.map(i => (i.id === savedItem.id ? savedItem : i))
                      : [...d.items, savedItem];
                    return { ...d, items: nextItems };
                  })
                }));
                setSelectedItemId(savedItem.id);
                setItemModalOpen(false);
                setEditingItem(null);
                showToast('✓ 已儲存');
              }}
            />
          )}

          {/* 彈窗 2：編輯當日標題、時區與日出日落 Modal */}
          {dayModalOpen && activeDay && (
            <DayEditorModal
              day={activeDay}
              onClose={() => setDayModalOpen(false)}
              onSave={(updatedDay) => {
                updateActiveTrip(t => ({
                  ...t,
                  days: t.days.map((d, idx) => (idx === activeDayIndex ? updatedDay : d))
                }));
                setDayModalOpen(false);
                showToast('✓ 已更新當日資訊與時區');
              }}
            />
          )}

          {/* 彈窗 3：旅行密碼與基本資訊設定 Modal */}
          {tripModalOpen && activeTrip && (
            <TripSettingsModal
              trip={activeTrip}
              onClose={() => setTripModalOpen(false)}
              onSave={(updatedTrip) => {
                updateActiveTrip(() => updatedTrip);
                if (updatedTrip.passcode) {
                  const tok = makePassToken(updatedTrip.id, updatedTrip.passcode);
                  setUnlockedTokens(prev => ({ ...prev, [updatedTrip.id]: tok }));
                }
                setTripModalOpen(false);
                showToast('✓ 已儲存旅行與密碼設定');
              }}
            />
          )}

          {/* 彈窗 4：多趟旅行專案管理中心 Modal */}
          {tripManagerOpen && (
            <TripManagerModal
              trips={trips}
              activeTripId={activeTrip?.id}
              onSelectTrip={(id) => {
                handleSelectTrip(id);
                setTripManagerOpen(false);
              }}
              onCreateTrip={(newTrip) => {
                setTrips(prev => [...prev, newTrip]);
                setActiveTripId(newTrip.id);
                setActiveDayIndex(0);
                setTripManagerOpen(false);
                showToast(`✨ 已建立新旅行「${newTrip.name}」`);
              }}
              onDuplicateTrip={(tripToCopy) => {
                const copy = JSON.parse(JSON.stringify(tripToCopy));
                copy.id = `trip-${Date.now()}`;
                copy.name = `${tripToCopy.name} (複製)`;
                setTrips(prev => [...prev, copy]);
                showToast('📋 已複製旅行分頁');
              }}
              onDeleteTrip={(id) => {
                if (trips.length <= 1) {
                  alert('至少需保留一個旅行分頁');
                  return;
                }
                const target = trips.find(t => t.id === id);
                if (!window.confirm(`確定要刪除「${target?.name}」整趟旅行嗎？`)) return;
                const remaining = trips.filter(t => t.id !== id);
                setTrips(remaining);
                if (activeTripId === id) setActiveTripId(remaining[0].id);
              }}
              onExportSingle={(tripObj) => {
                const blob = new Blob([JSON.stringify([tripObj], null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `tabi-note-${tripObj.name.replace(/\s+/g, '_')}.json`;
                a.click();
                URL.revokeObjectURL(url);
              }}
              onClose={() => setTripManagerOpen(false)}
            />
          )}

          {/* 彈窗 5：單張行程 9:16 IG 限時動態圖卡生成器 (已完美避開 IG 頂部頭像與底部回覆框) */}
          {storyItem && (
            <StoryCardModal
              item={storyItem.item}
              day={storyItem.day}
              trip={storyItem.trip}
              onClose={() => setStoryItem(null)}
            />
          )}

          {/* 彈窗 6：多張照片全螢幕放大燈箱 Lightbox */}
          {lightbox && (
            <div
              onClick={() => setLightbox(null)}
              className="fixed inset-0 z-50 bg-black/90 flex flex-col items-center justify-center p-4"
            >
              <div className="max-w-3xl w-full bg-white p-3 sm:p-4 border border-[#1C1B18]" onClick={(e) => e.stopPropagation()}>
                <div className="relative aspect-[4/3] bg-black flex items-center justify-center overflow-hidden">
                  <img
                    src={lightbox.photos[lightbox.index]?.url}
                    alt=""
                    className="max-h-full max-w-full object-contain"
                  />
                </div>
                <div className="flex items-center justify-between mt-3 font-mono text-xs">
                  <span>
                    {lightbox.index + 1} / {lightbox.photos.length} · {lightbox.photos[lightbox.index]?.caption || ''}
                  </span>
                  <div className="flex gap-2">
                    {lightbox.photos.length > 1 && (
                      <>
                        <button
                          onClick={() => setLightbox(prev => ({
                            ...prev,
                            index: (prev.index - 1 + prev.photos.length) % prev.photos.length
                          }))}
                          className="px-2.5 py-1 border border-[#1C1B18]"
                        >
                          ← 上一張
                        </button>
                        <button
                          onClick={() => setLightbox(prev => ({
                            ...prev,
                            index: (prev.index + 1) % prev.photos.length
                          }))}
                          className="px-2.5 py-1 border border-[#1C1B18]"
                        >
                          下一張 →
                        </button>
                      </>
                    )}
                    <button
                      onClick={() => setLightbox(null)}
                      className="px-3 py-1 bg-[#1C1B18] text-white"
                    >
                      關閉
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============================================================================
    // 子元件 0：直式 9:16 IG 限時動態圖卡生成器 (IG Safe Zone 零遮擋精修版)
    // ============================================================================
    function StoryCardModal({ item, day, trip, onClose }) {
      const photos = Array.isArray(item.photos) ? item.photos : [];
      const [selectedPhotoIdx, setSelectedPhotoIdx] = useState(0);
      const [previewDataUrl, setPreviewDataUrl] = useState('');
      const [generating, setGenerating] = useState(true);
      const [showIgSafeGuide, setShowIgSafeGuide] = useState(true);

      const wrapText = (ctx, text, x, y, maxWidth, lineHeight, maxLines = 6) => {
        const paragraphs = String(text || '').split('\n');
        let curY = y;
        let lineCount = 0;
        for (const para of paragraphs) {
          let line = '';
          const chars = Array.from(para);
          for (let i = 0; i < chars.length; i++) {
            const testLine = line + chars[i];
            if (ctx.measureText(testLine).width > maxWidth && i > 0) {
              ctx.fillText(line, x, curY);
              line = chars[i];
              curY += lineHeight;
              lineCount++;
              if (lineCount >= maxLines) return curY;
            } else {
              line = testLine;
            }
          }
          if (line) {
            ctx.fillText(line, x, curY);
            curY += lineHeight;
            lineCount++;
            if (lineCount >= maxLines) return curY;
          }
        }
        return curY;
      };

      useEffect(() => {
        let cancelled = false;
        const renderStory = async () => {
          setGenerating(true);
          const W = 1080;
          const H = 1920;
          const canvas = document.createElement('canvas');
          canvas.width = W;
          canvas.height = H;
          const ctx = canvas.getContext('2d');

          // 1. 米白紙質底色
          ctx.fillStyle = '#F7F6F2';
          ctx.fillRect(0, 0, W, H);

          // 2. IG Safe Zone 安全外框：頂部留出 215px 給 IG 頭像/ID/摯友按鈕；底部留出 190px 給 IG 回覆框
          const frameTop = 215;
          const frameBottom = H - 190; // 1730px
          const frameLeft = 52;
          const frameRight = W - 52;
          const frameW = frameRight - frameLeft;
          const frameH = frameBottom - frameTop;

          ctx.strokeStyle = '#1C1B18';
          ctx.lineWidth = 4;
          ctx.strokeRect(frameLeft, frameTop, frameW, frameH);

          // 3. 雜誌刊頭 (位於安全區頂部 y = 248)
          const innerLeft = frameLeft + 38;
          const innerRight = frameRight - 38;
          const innerW = innerRight - innerLeft;

          ctx.fillStyle = '#1C1B18';
          ctx.fillRect(innerLeft, frameTop + 34, 48, 48);
          ctx.fillStyle = '#F7F6F2';
          ctx.font = 'bold 27px "Noto Serif TC", serif';
          ctx.textAlign = 'center';
          ctx.fillText('旅', innerLeft + 24, frameTop + 68);

          ctx.textAlign = 'left';
          ctx.fillStyle = '#1C1B18';
          ctx.font = 'bold 25px "JetBrains Mono", monospace';
          ctx.fillText('TABI NOTE', innerLeft + 64, frameTop + 67);

          ctx.textAlign = 'right';
          ctx.font = 'bold 22px "JetBrains Mono", monospace';
          ctx.fillStyle = '#555555';
          ctx.fillText(`DAY ${String(day.dayNumber).padStart(2, '0')} · ${day.date || ''}`, innerRight, frameTop + 66);

          // 刊頭分隔線
          ctx.strokeStyle = '#1C1B18';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(innerLeft, frameTop + 104);
          ctx.lineTo(innerRight, frameTop + 104);
          ctx.stroke();

          // 4. 旅行專案名稱
          let curY = frameTop + 148;
          ctx.textAlign = 'left';
          ctx.fillStyle = '#B85D19';
          ctx.font = 'bold 23px "Noto Sans TC", sans-serif';
          ctx.fillText(trip.name || '', innerLeft, curY);

          // 5. 時間與時區黑底膠囊 (先設定字體再測量寬度，確保文字絕不被切掉)
          curY += 24;
          const startTz = getTzInfo(item.startTz || day.timezone);
          const endTz = getTzInfo(item.endTz || item.startTz || day.timezone);
          const timeLabel = `${item.time || ''} (${startTz.short})${item.endTime ? ` ➔ ${item.endTime} (${endTz.short})` : ''}`;

          ctx.font = 'bold 23px "JetBrains Mono", monospace';
          const measuredTimeW = ctx.measureText(timeLabel).width;
          const badgeW = Math.min(innerW, measuredTimeW + 40);

          ctx.fillStyle = '#1C1B18';
          ctx.fillRect(innerLeft, curY, badgeW, 46);
          ctx.fillStyle = '#F7F6F2';
          ctx.fillText(timeLabel, innerLeft + 20, curY + 31);

          // 6. 景點大標題
          curY += 108;
          ctx.fillStyle = '#1C1B18';
          ctx.font = 'bold 48px "Noto Serif TC", "Noto Sans TC", serif';
          curY = wrapText(ctx, item.title || '', innerLeft, curY, innerW, 64, 2);

          // 車站 / 航廈
          if (item.station) {
            ctx.fillStyle = '#444444';
            ctx.font = '24px "JetBrains Mono", "Noto Sans TC", sans-serif';
            ctx.fillText(`🚉 ${item.station}`, innerLeft, curY + 8);
            curY += 46;
          } else {
            curY += 12;
          }

          // 7. 中央拍立得照片相框 (自動依剩餘高度彈性調整，確保不擠壓底部筆記)
          const activePhoto = photos[selectedPhotoIdx];
          if (activePhoto?.url) {
            const boxX = innerLeft;
            const boxY = curY + 10;
            const boxW = innerW;
            const hasNote = Boolean(item.note && item.note.trim());
            const boxH = hasNote ? 600 : 760;

            ctx.fillStyle = '#1C1B18';
            ctx.fillRect(boxX + 10, boxY + 10, boxW, boxH);
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.strokeStyle = '#1C1B18';
            ctx.lineWidth = 3;
            ctx.strokeRect(boxX, boxY, boxW, boxH);

            try {
              const img = await new Promise((res, rej) => {
                const image = new Image();
                image.crossOrigin = 'anonymous';
                image.onload = () => res(image);
                image.onerror = rej;
                image.src = activePhoto.url;
              });

              const pad = 24;
              const bottomCaptionSpace = activePhoto.caption ? 76 : 24;
              const imgAreaW = boxW - pad * 2;
              const imgAreaH = boxH - pad - bottomCaptionSpace;
              const scale = Math.max(imgAreaW / img.width, imgAreaH / img.height);
              const drawW = img.width * scale;
              const drawH = img.height * scale;
              const offsetX = boxX + pad + (imgAreaW - drawW) / 2;
              const offsetY = boxY + pad + (imgAreaH - drawH) / 2;

              ctx.save();
              ctx.beginPath();
              ctx.rect(boxX + pad, boxY + pad, imgAreaW, imgAreaH);
              ctx.clip();
              ctx.drawImage(img, offsetX, offsetY, drawW, drawH);
              ctx.restore();

              // 底片右下角橘色日期章
              const dateStamp = `'${day.date ? day.date.slice(2).replace(/-/g, ' ') : '26 12'}`;
              ctx.fillStyle = 'rgba(0,0,0,0.58)';
              ctx.fillRect(boxX + boxW - pad - 144, boxY + pad + imgAreaH - 42, 134, 32);
              ctx.fillStyle = '#FF7A00';
              ctx.font = 'bold 20px "JetBrains Mono", monospace';
              ctx.textAlign = 'right';
              ctx.fillText(dateStamp, boxX + boxW - pad - 20, boxY + pad + imgAreaH - 19);
              ctx.textAlign = 'left';
            } catch {
              ctx.fillStyle = '#EFECE6';
              ctx.fillRect(boxX + 24, boxY + 24, boxW - 48, boxH - 80);
            }

            if (activePhoto.caption) {
              ctx.fillStyle = '#1C1B18';
              ctx.font = '25px "Noto Serif TC", serif';
              ctx.fillText(activePhoto.caption, boxX + 28, boxY + boxH - 26);
            }

            curY = boxY + boxH + 34;
          } else {
            curY += 24;
          }

          // 8. 個人 NOTE 筆記區 (精準限制在框內安全高度)
          const footerTopY = frameBottom - 74;
          if (item.note && curY < footerTopY - 90) {
            ctx.fillStyle = '#EFECE6';
            const noteBoxH = Math.min(250, footerTopY - curY - 22);
            ctx.fillRect(innerLeft, curY, innerW, noteBoxH);
            ctx.fillStyle = '#1C1B18';
            ctx.fillRect(innerLeft, curY, 7, noteBoxH);

            ctx.font = '24px "Noto Sans TC", sans-serif';
            const cleanNote = item.note.replace(/https?:\/\/[^\s]+/g, '[連結]');
            wrapText(ctx, cleanNote, innerLeft + 26, curY + 42, innerW - 46, 38, Math.floor((noteBoxH - 32) / 38));
          }

          // 9. 安全區內底部頁尾標籤與 VISITED 郵戳 (位於 frameBottom 上方，絕不被 IG 下方輸入框遮住)
          if (item.stamped) {
            ctx.save();
            ctx.translate(innerRight - 115, frameBottom - 44);
            ctx.rotate(-0.12);
            ctx.strokeStyle = '#B91C1C';
            ctx.lineWidth = 3.5;
            ctx.strokeRect(-98, -22, 196, 42);
            ctx.fillStyle = '#B91C1C';
            ctx.font = 'bold 21px "JetBrains Mono", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('★ VISITED ✓', 0, 6);
            ctx.restore();
          }

          ctx.textAlign = 'left';
          ctx.fillStyle = '#666666';
          ctx.font = '19px "JetBrains Mono", monospace';
          ctx.fillText(`#TABINOTE · ${getTzInfo(day.timezone).short}`, innerLeft, frameBottom - 32);

          if (!cancelled) {
            setPreviewDataUrl(canvas.toDataURL('image/png'));
            setGenerating(false);
          }
        };

        renderStory();
        return () => { cancelled = true; };
      }, [item, day, trip, selectedPhotoIdx]);

      const handleDownloadPng = () => {
        if (!previewDataUrl) return;
        const a = document.createElement('a');
        a.href = previewDataUrl;
        a.download = `TABI_STORY_${(item.title || 'card').replace(/\s+/g, '_')}.png`;
        a.click();
      };

      return (
        <div
          onClick={onClose}
          className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 overflow-y-auto"
        >
          <div
            onClick={(e) => e.stopPropagation()}
            className="bg-[#F7F6F2] border-2 border-[#1C1B18] max-w-md w-full p-4 shadow-[8px_8px_0px_#1C1B18] flex flex-col items-center"
          >
            <div className="w-full flex items-center justify-between border-b border-[#1C1B18] pb-2.5 mb-3">
              <span className="font-mono text-xs font-bold">📲 IG 限時動態圖卡 (9:16 安全區校準版)</span>
              <button onClick={onClose} className="font-mono text-xs px-2 py-0.5 border border-[#1C1B18]">✕</button>
            </div>

            <div className="w-full flex items-center justify-between gap-2 mb-2.5">
              {photos.length > 1 ? (
                <div className="flex items-center gap-1 overflow-x-auto no-scrollbar">
                  {photos.map((p, idx) => (
                    <button
                      key={p.id || idx}
                      onClick={() => setSelectedPhotoIdx(idx)}
                      className={`px-2 py-0.5 font-mono text-[10px] border shrink-0 ${
                        idx === selectedPhotoIdx ? 'bg-[#1C1B18] text-white border-[#1C1B18]' : 'bg-white border-[#1C1B18]/40'
                      }`}
                    >
                      照片 #{idx + 1}
                    </button>
                  ))}
                </div>
              ) : (
                <span className="font-mono text-[10px] text-[#1C1B18]/60">已自動避開 IG 頭像與回覆框</span>
              )}

              <button
                type="button"
                onClick={() => setShowIgSafeGuide(!showIgSafeGuide)}
                className={`px-2 py-0.5 font-mono text-[10px] border shrink-0 ${
                  showIgSafeGuide ? 'bg-amber-100 border-amber-500 text-amber-950' : 'bg-white border-[#1C1B18]/30'
                }`}
              >
                {showIgSafeGuide ? '👁️ 顯示 IG 遮擋模擬' : '隱藏模擬線'}
              </button>
            </div>

            {/* 9:16 預覽圖 + 模擬 IG 介面遮擋安全區 */}

            <p className="text-[11px] text-[#1C1B18]/70 text-center mb-3">

    // ============================================================================
    // 子元件 1：行程節點編輯器 Modal

    function ItemEditorModal({ day, initialItem, onClose, onSave }) {
      const [form, setForm] = useState(() => ({
        id: initialItem?.id || `item-${Date.now()}`,
        time: initialItem?.time || '09:30',
        endTime: initialItem?.endTime || '',
        startTz: initialItem?.startTz || day.timezone || 'Asia/Taipei',
        endTz: initialItem?.endTz || initialItem?.startTz || day.timezone || 'Asia/Taipei',
        dayOffset: Number(initialItem?.dayOffset) || 0,
        category: initialItem?.category || 'sight',
        title: initialItem?.title || '',
        station: initialItem?.station || '',
        transitNext: initialItem?.transitNext || '',
        cost: Number(initialItem?.cost) || 0,
        lat: typeof initialItem?.lat === 'number' && !isNaN(initialItem.lat) ? initialItem.lat : 35.6812,
        lng: typeof initialItem?.lng === 'number' && !isNaN(initialItem.lng) ? initialItem.lng : 139.7671,
        mapUrl: initialItem?.mapUrl || '',
        note: initialItem?.note || '',
        stamped: Boolean(initialItem?.stamped),
        photos: Array.isArray(initialItem?.photos) ? initialItem.photos : [],
      }));

      const [searchStatus, setSearchStatus] = useState('');
      const [photoUrlInput, setPhotoUrlInput] = useState('');
      const [uploading, setUploading] = useState(false);
      const miniMapRef = useRef(null);
      const miniMapInstance = useRef(null);
      const miniMarkerRef = useRef(null);

      useEffect(() => {
        if (!miniMapRef.current || !window.L) return;
        let m = null;
        try {
          m = window.L.map(miniMapRef.current, {
            center: [form.lat, form.lng],
            zoom: 13,
          });
          window.L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
          }).addTo(m);
          const marker = window.L.marker([form.lat, form.lng], { draggable: true }).addTo(m);
          marker.on('dragend', (e) => {
            const pos = e.target.getLatLng();
            setForm(prev => ({
              ...prev,
              lat: Number(pos.lat.toFixed(5)),
              lng: Number(pos.lng.toFixed(5)),
            }));
          });
          m.on('click', (e) => {
            const { lat, lng } = e.latlng;
            marker.setLatLng([lat, lng]);
            setForm(prev => ({
              ...prev,
              lat: Number(lat.toFixed(5)),
              lng: Number(lng.toFixed(5)),
            }));
          });
          miniMapInstance.current = m;
          miniMarkerRef.current = marker;
        } catch (err) {}

        return () => {
          if (miniMapInstance.current) {
            try {
              miniMapInstance.current.remove();
            } catch (e) {}
            miniMapInstance.current = null;
            miniMarkerRef.current = null;
          }
        };
      }, []);

      useEffect(() => {
        if (miniMapInstance.current && miniMarkerRef.current && form.lat && form.lng) {
          try {
            miniMarkerRef.current.setLatLng([form.lat, form.lng]);
            miniMapInstance.current.setView([form.lat, form.lng], 14);
          } catch (e) {}
        }
      }, [form.lat, form.lng]);

      const geocodePlaceName = async (queryText) => {
        if (!queryText) return;
        setSearchStatus('定位搜尋中...');
        try {
          const res = await fetch(
            `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(queryText)}&limit=1`
          );
          const data = await res.json();
          if (data && data[0]) {
            const lat = Number(parseFloat(data[0].lat).toFixed(5));
            const lng = Number(parseFloat(data[0].lon).toFixed(5));
            const guessedTz = guessTimezoneByCoord(lat, lng);
            setForm(prev => ({
              ...prev,
              lat,
              lng,
              ...(guessedTz ? { startTz: guessedTz, endTz: guessedTz } : {})
            }));
            setSearchStatus(`✓ 已定位：${lat}, ${lng}`);
          } else {
            setSearchStatus('找不到對應座標，可直接點擊下方小地圖指定位置');
          }
        } catch {
          setSearchStatus('搜尋連線逾時，可直接貼上含 @緯度,經度 的網址');
        }
      };

      const handleMapUrlChange = (val) => {
        setForm(prev => ({ ...prev, mapUrl: val }));
        const parsed = parseGoogleMapsInput(val);
        if (parsed?.lat && parsed?.lng) {
          const guessedTz = guessTimezoneByCoord(parsed.lat, parsed.lng);
          setForm(prev => ({
            ...prev,
            mapUrl: val,
            lat: parsed.lat,
            lng: parsed.lng,
            ...(guessedTz ? { startTz: guessedTz, endTz: guessedTz } : {})
          }));
          setSearchStatus(`✓ 已從網址擷取座標：${parsed.lat}, ${parsed.lng}`);
        } else if (parsed?.extractedQuery) {
          geocodePlaceName(parsed.extractedQuery);
        } else if (val.includes('maps.app.goo.gl') && form.title) {
          geocodePlaceName(form.title);
        }
      };

      const handleUploadFiles = async (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        setUploading(true);
        const compressedList = [];
        for (const file of files) {
          try {
            const dataUrl = await compressImageToBase64(file);
            compressedList.push({
              id: `ph-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
              url: dataUrl,
              caption: '',
            });
          } catch (err) {
            alert('有部分照片讀取失敗，建議單次選取 1～2 張照片上傳');
          }
        }
        setForm(prev => ({ ...prev, photos: [...prev.photos, ...compressedList] }));
        setUploading(false);
        e.target.value = '';
      };

      const realFlightPreview = calcRealDuration(form.time, form.endTime, form.startTz, form.endTz, form.dayOffset);

      return (
        <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-3 sm:p-5 overflow-y-auto">
          <div className="bg-[#F7F6F2] border-2 border-[#1C1B18] max-w-2xl w-full max-h-[92vh] overflow-y-auto p-4 sm:p-6 shadow-[8px_8px_0px_#1C1B18]">
            <div className="flex items-center justify-between border-b border-[#1C1B18] pb-3 mb-4">

                {initialItem ? '編輯行程節點' : '新增行程節點'}
              </h3>
              <button type="button" onClick={onClose} className="font-mono text-sm px-2 py-0.5 border border-[#1C1B18]">
                ✕
              </button>
            </div>

            <form
              onSubmit={(e) => {
                e.preventDefault();
                if (!form.title.trim()) {
                  alert('請輸入行程或景點名稱');
                  return;
                }
                onSave({
                  ...form,
                  cost: Number(form.cost) || 0,
                  lat: Number(form.lat) || 35.6812,
                  lng: Number(form.lng) || 139.7671,
                });
              }}
              className="space-y-4 text-xs"
            >
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <div>
                  <label className="block font-mono text-[10px] uppercase mb-1">開始時間</label>
                  <input
                    type="time"
                    value={form.time}
                    onChange={(e) => setForm({ ...form, time: e.target.value })}
                    className="w-full px-2.5 py-1.5 bg-white border border-[#1C1B18] font-mono"
                  />
                </div>
                <div>
                  <label className="block font-mono text-[10px] uppercase mb-1">結束/抵達時間 (選填)</label>
                  <input
                    type="time"
                    value={form.endTime}
                    onChange={(e) => setForm({ ...form, endTime: e.target.value })}
                    className="w-full px-2.5 py-1.5 bg-white border border-[#1C1B18] font-mono"
                  />
                </div>
                <div>
                  <label className="block font-mono text-[10px] uppercase mb-1">跨日抵達</label>
                  <select
                    value={form.dayOffset}
                    onChange={(e) => setForm({ ...form, dayOffset: Number(e.target.value) })}
                    className="w-full px-2 py-1.5 bg-white border border-[#1C1B18] font-mono"
                  >
                    <option value={0}>當日抵達</option>
                    <option value={1}>+1日 (隔天抵達)</option>
                    <option value={2}>+2日</option>
                  </select>
                </div>
                <div>
                  <label className="block font-mono text-[10px] uppercase mb-1">類別 (交通具車票撕口)</label>
                  <select
                    value={form.category}
                    onChange={(e) => setForm({ ...form, category: e.target.value })}
                    className="w-full px-2 py-1.5 bg-white border border-[#1C1B18] font-mono"
                  >
                    {Object.entries(CATEGORIES).map(([k, v]) => (
                      <option key={k} value={k}>{v.label}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div className="bg-white border border-[#1C1B18]/40 p-3 space-y-2">
                <div className="font-mono text-[10px] uppercase tracking-wider font-bold text-[#1D4261]">
                  🌍 TIMEZONE・時區設定 (跨州/跨國航班可分別指定起飛與抵達時區)
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                  <div>
                    <label className="block font-mono text-[10px] mb-1">開始 (起飛地) 時區</label>
                    <select
                      value={form.startTz}
                      onChange={(e) => setForm({ ...form, startTz: e.target.value })}
                      className="w-full px-2 py-1.5 border border-[#1C1B18] font-mono text-[11px]"
                    >
                      {TIMEZONES.map(tz => (
                        <option key={tz.id} value={tz.id}>{tz.label}</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="block font-mono text-[10px] mb-1">結束 (抵達地) 時區</label>
                    <select
                      value={form.endTz}
                      onChange={(e) => setForm({ ...form, endTz: e.target.value })}
                      className="w-full px-2 py-1.5 border border-[#1C1B18] font-mono text-[11px]"
                    >
                      {TIMEZONES.map(tz => (
                        <option key={tz.id} value={tz.id}>{tz.label}</option>
                      ))}
                    </select>
                  </div>
                </div>
                {realFlightPreview && (
                  <div className="font-mono text-[11px] text-[#1D4261] bg-[#E6EEF4] px-2.5 py-1">
                    ✈️ 系統自動換算：實際移動/飛行時數為 <strong>{realFlightPreview.text}</strong>

              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div className="sm:col-span-2">
                  <label className="block font-mono text-[10px] uppercase mb-1">行程 / 景點名稱 *</label>
                  <div className="flex gap-1.5">
                    <input

                      onChange={(e) => setForm({ ...form, title: e.target.value })}

                    />
                    <button

                      onClick={() => geocodePlaceName(form.title)}
                      className="px-3 py-1.5 bg-[#1C1B18] text-white font-mono shrink-0"
                    >
                      搜尋定位
                    </button>
                  </div>
                </div>
                <div>
                  <label className="block font-mono text-[10px] uppercase mb-1">車站 / 航廈 / 出口</label>
                  <input
                    type="text"
                    value={form.station}
                    onChange={(e) => setForm({ ...form, station: e.target.value })}
                    placeholder="Terminal 2 / A1出口"
                    className="w-full px-2.5 py-1.5 bg-white border border-[#1C1B18]"
                  />
                </div>
              </div>

              <div className="bg-white border border-[#1C1B18]/40 p-3 space-y-2">
                <label className="block font-mono text-[10px] uppercase font-bold">

                <input

                  value={form.mapUrl}

                      className="px-2 py-0.5 bg-[#EFECE6] hover:bg-[#1C1B18] hover:text-white font-mono text-[10px] transition-colors"
                    >
                      {lm.label}

                  <span>LNG: {form.lng}</span>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">

                  />

                  <input

                  />

              <div>
                <label className="block font-mono text-[10px] uppercase mb-1 font-bold">

                </label>
                <textarea
                  rows={2}

                  placeholder="輸入備註或貼上預約網址..."
                  className="w-full px-2.5 py-1.5 bg-white border border-[#1C1B18]"
                />
              </div>

              <div className="bg-white border border-[#1C1B18]/40 p-3 space-y-2.5">
                <div className="flex flex-wrap items-center justify-between gap-2">

                    </label>

                </div>

                <div className="flex gap-1.5">
                  <input
                    type="text"
                    value={photoUrlInput}
