                    className="flex-1 px-2 py-1 border border-[#1C1B18]/40 font-mono text-[11px]"
                  />
                  <button
                    type="button"
                    onClick={() => {
                      if (!photoUrlInput.trim()) return;
                      setForm(prev => ({
                        ...prev,
                        photos: [...prev.photos, { id: `ph-${Date.now()}`, url: photoUrlInput.trim(), caption: '' }]
                      }));
                      setPhotoUrlInput('');
                    }}
                    className="px-2.5 py-1 border border-[#1C1B18] font-mono text-[11px]"
                  >
                    + 加入圖片
                  </button>
                </div>

                {form.photos.length > 0 && (
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5 pt-1">
                    {form.photos.map((ph, idx) => (
                      <div key={ph.id || idx} className="border border-[#1C1B18]/30 p-1.5 bg-[#F7F6F2]">
                        <div className="relative aspect-[4/3] bg-black/10 mb-1 overflow-hidden">
                          <img src={ph.url} alt="" className="w-full h-full object-cover" />
                          <button
                            type="button"
                            onClick={() => setForm(prev => ({
                              ...prev,
                              photos: prev.photos.filter((_, i) => i !== idx)
                            }))}
                            className="absolute top-1 right-1 bg-red-600 text-white w-5 h-5 font-mono text-xs flex items-center justify-center"
                          >
                            ×
                          </button>
                        </div>
                        <input
                          type="text"
                          value={ph.caption || ''}
                          onChange={(e) => {
                            const val = e.target.value;
                            setForm(prev => ({
                              ...prev,
                              photos: prev.photos.map((p, i) => (i === idx ? { ...p, caption: val } : p))
                            }));
                          }}
                          placeholder="照片短註解..."
                          className="w-full px-1.5 py-0.5 text-[11px] bg-white border border-[#1C1B18]/30"
                        />

                    ))}
                  </div>
                )}
              </div>

              <div className="flex justify-end gap-2 pt-2 border-t border-[#1C1B18]">
                <button
                  type="button"

                <button

                >
                  儲存
                </button>
              </div>
            </form>
          </div>
        </div>

                </select>
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {TIMEZONES.filter(t => t.quick).map(tz => (
                    <button
                      key={tz.id}
                      type="button"
                      onClick={() => setForm({ ...form, timezone: tz.id })}
                      className={`px-2 py-0.5 font-mono text-[10px] border ${
                        form.timezone === tz.id ? 'bg-[#1C1B18] text-white border-[#1C1B18]' : 'bg-white border-[#1C1B18]/30'
                      }`}
                    >
                      {tz.quick}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="block font-mono text-[10px] uppercase mb-1">當日主題標題</label>
                <input
                  type="text"
                  value={form.title}
                  onChange={(e) => setForm({ ...form, title: e.target.value })}
                  className="w-full px-2.5 py-1.5 bg-white border border-[#1C1B18]"
                />
              </div>

              <div>
                <label className="block font-mono text-[10px] uppercase mb-1">氣候 / 穿搭備註</label>
                <input
                  type="text"
                  value={form.weatherNote}
                  onChange={(e) => setForm({ ...form, weatherNote: e.target.value })}
                  className="w-full px-2.5 py-1.5 bg-white border border-[#1C1B18]"
                />
              </div>

              <div className="bg-white border border-[#1C1B18]/40 p-3 space-y-2">
                <div className="flex items-center justify-between">
                  <span className="font-mono text-[10px] uppercase font-bold">🌅 日出與日落時間</span>
                  <button
                    type="button"
                    onClick={handleAutoSun}
                    className="px-2 py-0.5 bg-amber-100 text-amber-900 border border-amber-400 font-mono text-[10px]"
                  >
                    ✨ 依座標自動推算
                  </button>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block font-mono text-[10px] mb-0.5">🌅 日出 SUNRISE</label>
                    <input
                      type="time"
                      value={form.sunrise}
                      onChange={(e) => setForm({ ...form, sunrise: e.target.value })}
                      className="w-full px-2 py-1 border border-[#1C1B18] font-mono"
                    />
                  </div>
                  <div>
                    <label className="block font-mono text-[10px] mb-0.5">🌇 日落 SUNSET</label>
                    <input
                      type="time"
                      value={form.sunset}
                      onChange={(e) => setForm({ ...form, sunset: e.target.value })}
                      className="w-full px-2 py-1 border border-[#1C1B18] font-mono"
                    />
                  </div>
                </div>
              </div>

              <div className="flex justify-end gap-2 pt-2 border-t border-[#1C1B18]">
                <button type="button" onClick={onClose} className="px-4 py-1.5 border border-[#1C1B18] bg-white font-mono">
                  取消
                </button>
                <button type="submit" className="px-5 py-1.5 bg-[#1C1B18] text-white font-mono font-bold">
                  儲存
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ============================================================================
    // 子元件 3：旅行密碼與基本設定 Modal
    // ============================================================================
    function TripSettingsModal({ trip, onClose, onSave }) {
      const [form, setForm] = useState({
        ...trip,
        passcode: trip.passcode || '',
      });

      return (
        <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
          <div className="bg-[#F7F6F2] border-2 border-[#1C1B18] max-w-md w-full p-5 shadow-[6px_6px_0px_#1C1B18]">
            <div className="flex items-center justify-between border-b border-[#1C1B18] pb-2.5 mb-4">
              <h3 className="font-serif text-xl font-bold">旅行資訊與獨立密碼鎖</h3>
              <button onClick={onClose} className="font-mono text-xs px-2 py-0.5 border border-[#1C1B18]">✕</button>
            </div>

            <form
              onSubmit={(e) => {
                e.preventDefault();
                onSave(form);
              }}
              className="space-y-3.5 text-xs"
            >
              <div>
                <label className="block font-mono text-[10px] uppercase mb-1">旅行名稱</label>
                <input
                  type="text"
                  value={form.name}
                  onChange={(e) => setForm({ ...form, name: e.target.value })}
                  className="w-full px-2.5 py-1.5 bg-white border border-[#1C1B18]"
                />
              </div>

              <div>
                <label className="block font-mono text-[10px] uppercase mb-1">英文副標題 / 目的地</label>
                <input
                  type="text"
                  value={form.subtitle}
                  onChange={(e) => setForm({ ...form, subtitle: e.target.value })}
                  className="w-full px-2.5 py-1.5 bg-white border border-[#1C1B18] font-mono"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block font-mono text-[10px] uppercase mb-1">日期區間標示</label>
                  <input
                    type="text"
                    value={form.dateRange}
                    onChange={(e) => setForm({ ...form, dateRange: e.target.value })}
                    placeholder="2026.12.01 - 12.15"
                    className="w-full px-2.5 py-1.5 bg-white border border-[#1C1B18] font-mono"
                  />
                </div>
                <div>
                  <label className="block font-mono text-[10px] uppercase mb-1">幣別符號</label>
                  <select
                    value={form.currency}
                    onChange={(e) => setForm({ ...form, currency: e.target.value })}
                    className="w-full px-2.5 py-1.5 bg-white border border-[#1C1B18] font-mono"
                  >
                    <option value="¥">¥ (日圓 JPY)</option>
                    <option value="$">$ (美金 USD)</option>
                    <option value="NT$">NT$ (台幣 TWD)</option>
                    <option value="€">€ (歐元 EUR)</option>
                    <option value="₩">₩ (韓元 KRW)</option>
                  </select>
                </div>
              </div>

              <div className="bg-white border border-[#1C1B18] p-3 space-y-1.5">
                <label className="block font-mono text-[11px] font-bold text-[#B85D19]">
                  🔒 獨立隱私密碼鎖 (留空代表不設密碼)
                </label>
                <input
                  type="text"
                  value={form.passcode}
                  onChange={(e) => setForm({ ...form, passcode: e.target.value.trim() })}
                  placeholder="設定密碼，例如：1234 或旅伴暗號"
                  className="w-full px-2.5 py-1.5 border border-[#1C1B18] font-mono"
                />
                <p className="text-[11px] text-[#1C1B18]/70 leading-relaxed">
                  設定後，非本趟旅伴點開此分頁時會被鎖定。同行友人輸入一次密碼後，其手機瀏覽器會自動永久記住解鎖狀態。
                </p>
              </div>

              <div className="flex justify-end gap-2 pt-2 border-t border-[#1C1B18]">
                <button type="button" onClick={onClose} className="px-4 py-1.5 border border-[#1C1B18] bg-white font-mono">
                  取消
                </button>
                <button type="submit" className="px-5 py-1.5 bg-[#1C1B18] text-white font-mono font-bold">
                  儲存
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ============================================================================
    // 子元件 4：多趟旅行專案管理中心 Modal
    // ============================================================================
    function TripManagerModal({
      trips,
      activeTripId,
      onSelectTrip,
      onCreateTrip,
      onDuplicateTrip,
      onDeleteTrip,
      onExportSingle,
      onClose,
    }) {
      const [newName, setNewName] = useState('');
      const [newCurrency, setNewCurrency] = useState('¥');
      const [newTz, setNewTz] = useState('Asia/Tokyo');
      const [newPass, setNewPass] = useState('');

      const handleCreate = (e) => {
        e.preventDefault();
        if (!newName.trim()) return;
        const created = {
          id: `trip-${Date.now()}`,
          name: newName.trim(),
          subtitle: 'VISUAL ITINERARY ARCHIVE',
          dateRange: '2026',
          currency: newCurrency,
          passcode: newPass.trim(),
          checklist: [],
          days: [
            {
              id: `day-${Date.now()}`,
              dayNumber: 1,
              date: new Date().toISOString().slice(0, 10),
              title: 'Day 1 台灣出發 ➔ 抵達目的地',
              weatherNote: '',
              timezone: newTz,
              sunrise: '06:30',
              sunset: '17:15',
              items: [
                {
                  id: `item-${Date.now()}`,
                  time: '09:00',
                  endTime: '13:30',
                  startTz: 'Asia/Taipei',
                  endTz: newTz,
                  dayOffset: 0,
                  category: 'transit',
                  title: '桃園國際機場 (TPE) 出發',
                  station: 'Terminal 1 / 2',
                  transitNext: '',
                  cost: 0,
                  lat: 25.0797,
                  lng: 121.2342,
                  mapUrl: '',
                  note: '',
                  stamped: false,
                  photos: [],
                }
              ],
            }
          ]
        };
        onCreateTrip(created);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-[#F7F6F2] border-2 border-[#1C1B18] max-w-xl w-full p-5 shadow-[8px_8px_0px_#1C1B18] max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between border-b border-[#1C1B18] pb-3 mb-4">
              <h3 className="font-serif text-xl font-bold">🗂️ 旅行專案管理中心 ({trips.length})</h3>
              <button onClick={onClose} className="font-mono text-xs px-2 py-0.5 border border-[#1C1B18]">✕</button>
            </div>

            <div className="space-y-2.5 mb-5">
              {trips.map((t, idx) => (
                <div
                  key={t.id}
                  className={`p-3 bg-white border flex flex-wrap items-center justify-between gap-2 ${
                    t.id === activeTripId ? 'border-2 border-[#1C1B18]' : 'border-[#1C1B18]/40'
                  }`}
                >
                  <div className="cursor-pointer flex-1" onClick={() => onSelectTrip(t.id)}>
                    <div className="font-mono text-[10px] text-[#1C1B18]/60">
                      TRIP #{idx + 1} · {t.days.length} DAYS · 幣別 {t.currency} {t.passcode ? '· 🔒 已設密碼' : ''}
                    </div>
                    <div className="font-serif text-base font-bold">{t.name}</div>
                  </div>
                  <div className="flex items-center gap-1.5 font-mono text-[11px]">
                    <button
                      onClick={() => onSelectTrip(t.id)}
                      className="px-2.5 py-1 bg-[#1C1B18] text-white"
                    >
                      切換
                    </button>
                    <button
                      onClick={() => onDuplicateTrip(t)}
                      className="px-2 py-1 border border-[#1C1B18]"
                      title="複製這趟旅行"
                    >
                      複製
                    </button>
                    <button
                      onClick={() => onExportSingle(t)}
                      className="px-2 py-1 border border-[#1C1B18]"
                      title="單獨匯出此旅行 JSON"
                    >
                      匯出
                    </button>
                    <button
                      onClick={() => onDeleteTrip(t.id)}
                      className="px-2 py-1 border border-red-600/40 text-red-700"
                    >
                      刪除
                    </button>
                  </div>
                </div>
              ))}
            </div>

            <form onSubmit={handleCreate} className="bg-white border border-[#1C1B18] p-4 space-y-3 text-xs">
              <div className="font-mono text-xs font-bold uppercase tracking-wider">
                + 建立全新旅行分頁
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <input
                  type="text"
                  value={newName}
                  onChange={(e) => setNewName(e.target.value)}
                  placeholder="旅行名稱 (例如：2026 東京迪士尼海洋)"
                  className="px-2.5 py-1.5 border border-[#1C1B18]"
                />
                <input
                  type="text"
                  value={newPass}
                  onChange={(e) => setNewPass(e.target.value)}
                  placeholder="選填獨立密碼鎖 (留空則公開)"
                  className="px-2.5 py-1.5 border border-[#1C1B18] font-mono"
                />
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <select
                  value={newTz}
                  onChange={(e) => setNewTz(e.target.value)}
                  className="px-2 py-1.5 border border-[#1C1B18] font-mono"
                >
                  {TIMEZONES.map(tz => (
                    <option key={tz.id} value={tz.id}>預設時區：{tz.label}</option>
                  ))}
                </select>
                <select
                  value={newCurrency}
                  onChange={(e) => setNewCurrency(e.target.value)}
                  className="px-2 py-1.5 border border-[#1C1B18] font-mono"
                >
                  <option value="¥">幣別：¥ (日圓)</option>
                  <option value="$">幣別：$ (美金)</option>
                  <option value="NT$">幣別：NT$ (台幣)</option>
                  <option value="€">幣別：€ (歐元)</option>
                </select>
              </div>
              <button
                type="submit"
                className="w-full py-2 bg-[#1C1B18] text-white font-mono text-xs font-bold hover:bg-[#B85D19]"
              >
                儲存
              </button>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
