      if (view === "map") renderLeafletRouteMap();
      if (view === "budget") renderBudgetAndChecklist();
    }

    function renderLeafletRouteMap() {
      const day = getActiveDay();
      const trip = getActiveTrip();
      const mapEl = document.getElementById("routeMapContainer");

      if (!leafletMap) {
        leafletMap = L.map(mapEl).setView([25.0478, 121.5170], 12);
        // Restored standard OpenStreetMap tile server so tiles ALWAYS load reliably!
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: "&copy; OpenStreetMap contributors"
        }).addTo(leafletMap);
      }

      setTimeout(() => {
        leafletMap.invalidateSize();
      }, 150);

      leafletMap.eachLayer(layer => {
        if (!(layer instanceof L.TileLayer)) leafletMap.removeLayer(layer);
      });

      const allBoundsPts = [];
      let stopCounter = 1;

      day.items.filter(i => i.status !== "cancelled").forEach(item => {
        if (item.type === "transit" && Array.isArray(item.transitLegs) && item.transitLegs.length > 0) {
          item.transitLegs.forEach((leg, lIdx) => {
            const cFrom = lookupStationCoordSync(leg.from);
            const cTo = lookupStationCoordSync(leg.to);
            const col = getLineBrandColor(leg.line, lIdx);

            if (cFrom) {
              L.circleMarker([cFrom.lat, cFrom.lng], {
                radius: 8, fillColor: col, color: "#FFFFFF", weight: 2.5, fillOpacity: 1
              }).addTo(leafletMap).bindPopup(`<b>${escapeHtml(leg.from)}</b><br/>${escapeHtml(leg.line || "")}`);
              allBoundsPts.push([cFrom.lat, cFrom.lng]);
            }
            if (cTo) {
              L.circleMarker([cTo.lat, cTo.lng], {
                radius: 8, fillColor: col, color: "#FFFFFF", weight: 2.5, fillOpacity: 1
              }).addTo(leafletMap).bindPopup(`<b>${escapeHtml(leg.to)}</b><br/>${escapeHtml(leg.line || "")}`);
              allBoundsPts.push([cTo.lat, cTo.lng]);
            }
            if (cFrom && cTo) {
              L.polyline([[cFrom.lat, cFrom.lng], [cTo.lat, cTo.lng]], {
                color: col, weight: 5, opacity: 0.9
              }).addTo(leafletMap);
            }
          });
        } else if (item.type === "roadtrip") {
          const roadNames = [item.roadFrom, ...(item.roadStops ? item.roadStops.split(/[,，、]/) : []), item.roadTo]
            .map(s => (s || "").trim()).filter(Boolean);
          const roadCoords = [];
          roadNames.forEach(rn => {
            const c = lookupStationCoordSync(rn);
            if (c) {
              roadCoords.push([c.lat, c.lng]);
              allBoundsPts.push([c.lat, c.lng]);
              L.circleMarker([c.lat, c.lng], {
                radius: 8, fillColor: "#16A34A", color: "#FFFFFF", weight: 2.5, fillOpacity: 1
              }).addTo(leafletMap).bindPopup(`<b>🚗 ${escapeHtml(rn)}</b>`);
            }
          });
          if (roadCoords.length >= 2) {
            L.polyline(roadCoords, { color: "#16A34A", weight: 5, dashArray: "10, 6" }).addTo(leafletMap);
          }
        } else if (item.type === "flight") {
          const dep = AIRPORT_COORDS[(item.depIata || "").toUpperCase()];
          const arr = AIRPORT_COORDS[(item.arrIata || "").toUpperCase()];
          if (dep && arr) {
            L.polyline([[dep.lat, dep.lng], [arr.lat, arr.lng]], {
              color: "#C84B31", weight: 4, dashArray: "8, 8"
            }).addTo(leafletMap);
            allBoundsPts.push([dep.lat, dep.lng], [arr.lat, arr.lng]);
          }
        } else {
          const c = lookupStationCoordSync(item.title) || lookupStationCoordSync(item.subtitle);
          if (c) {
            L.circleMarker([c.lat, c.lng], {
              radius: 8, fillColor: "#191919", color: "#FFFFFF", weight: 2, fillOpacity: 1
            }).addTo(leafletMap).bindPopup(`<b>${stopCounter}. ${escapeHtml(item.title)}</b>`);
            allBoundsPts.push([c.lat, c.lng]);
            stopCounter++;
          }
        }
      });

      document.getElementById("mapStatsLabel").textContent = `共標記 ${allBoundsPts.length} 個座標點`;
      setTimeout(() => {
        leafletMap.invalidateSize();
        if (allBoundsPts.length > 0) {
          leafletMap.fitBounds(allBoundsPts, { padding: [40, 40], maxZoom: 14 });
        } else {
          const def = getDefaultCoordForTz(trip.homeTz);
          leafletMap.setView([def.lat, def.lng], 12);
        }
      }, 200);
    }

    /*************************************************************************
     * 10. DUAL-TRACK FINANCE & CHECKLIST VIEW
     *************************************************************************/
    function renderBudgetAndChecklist() {
      const trip = getActiveTrip();
      const el = document.getElementById("budgetView");

      const totalsByCur = {};
      const itemBreakdownRows = [];

      trip.days.forEach((d, dIdx) => {
        d.items.forEach(item => {
          if (item.status === "cancelled") return;
          const cur = item.currency || "NT$";
          const base = Number(item.cost) || 0;
          const extras = Array.isArray(item.extraExpenses) ? item.extraExpenses : [];
          const extraTotal = extras.reduce((s, e) => s + (Number(e.amount) || 0), 0);
          const sum = base + extraTotal;

          if (sum > 0) {
            if (!totalsByCur[cur]) totalsByCur[cur] = { base: 0, extra: 0, total: 0 };
            totalsByCur[cur].base += base;
            totalsByCur[cur].extra += extraTotal;
            totalsByCur[cur].total += sum;

            itemBreakdownRows.push({
              dayNum: dIdx + 1,
              title: item.title,
              cur,
              base,
              extras,
              sum
            });
          }
        });
      });

      const summaryCardsHtml = Object.keys(totalsByCur).length > 0
        ? Object.entries(totalsByCur).map(([cur, obj]) => `
            <div style="background:#FAF8F4; border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:8px;">
              <div style="display:flex; justify-content:space-between; font-size:16px; font-weight:900;">
                <span>${cur} 總支出合計</span>
                <span style="color:var(--accent); font-family:var(--mono);">${cur} ${obj.total.toLocaleString()}</span>
              </div>
              <div style="display:flex; justify-content:space-between; font-size:12.5px; color:var(--sub); margin-top:4px;">
                <span>預定費用：${cur} ${obj.base.toLocaleString()}</span>
                <span>現場額外消費：${cur} ${obj.extra.toLocaleString()}</span>
              </div>
            </div>
          `).join("")
        : `<div style="color:var(--sub); font-size:13px;">尚無記帳項目</div>`;

      const detailRowsHtml = itemBreakdownRows.map(r => `
        <div style="border-bottom:1px solid #EFECE4; padding:9px 0; font-size:13.5px;">
          <div style="display:flex; justify-content:space-between; font-weight:800;">
            <span>DAY 0${r.dayNum} · ${escapeHtml(r.title)}</span>
            <span style="font-family:var(--mono);">${r.cur} ${r.sum.toLocaleString()}</span>
          </div>
          ${r.base > 0 ? `<div style="font-size:12px; color:var(--sub);">預定費用：${r.cur} ${r.base.toLocaleString()}</div>` : ""}
          ${r.extras.map(ex => `<div style="font-size:12px; color:var(--sub);">＋ ${escapeHtml(ex.name)}：${r.cur} ${Number(ex.amount).toLocaleString()}</div>`).join("")}
        </div>
      `).join("");

      const checklistHtml = (trip.checklist || []).map((c, idx) => `
        <div style="display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid #EFECE4;">
          <label style="display:flex; align-items:center; gap:8px; font-size:14px; cursor:pointer; ${c.done ? 'text-decoration:line-through; color:var(--sub);' : 'font-weight:700;'}">
            <input type="checkbox" ${c.done ? "checked" : ""} onchange="toggleChecklistItem(${idx})" style="width:17px; height:17px;" />
            ${escapeHtml(c.text)}
          </label>
          <button class="mini-btn delete-btn" onclick="deleteChecklistItem(${idx})">✕</button>
        </div>
      `).join("");

      el.innerHTML = `
        <div class="form-card">
          <div style="font-size:16px; font-weight:900; margin-bottom:10px;">💰 記帳與支出總覽</div>
          ${summaryCardsHtml}
          <div style="margin-top:12px;">${detailRowsHtml}</div>
        </div>

        <div class="form-card">
          <div style="font-size:16px; font-weight:900; margin-bottom:10px;">🧳 行前準備清單</div>
          <div style="display:flex; gap:8px; margin-bottom:10px;">
            <input type="text" class="form-input" id="newCheckItemInput" placeholder="新增攜帶物品或待辦事項..." />
            <button class="pill-btn primary" onclick="addChecklistItem()">新增</button>
          </div>
          <div>${checklistHtml}</div>
        </div>
      `;
    }

    function addChecklistItem() {
      const inp = document.getElementById("newCheckItemInput");
      const val = inp.value.trim();
      if (!val) return;
      const trip = getActiveTrip();
      trip.checklist = trip.checklist || [];
      trip.checklist.push({ text: val, done: false });
      inp.value = "";
      saveAppState();
      renderBudgetAndChecklist();
    }

    function toggleChecklistItem(idx) {
      const trip = getActiveTrip();
      if (trip.checklist && trip.checklist[idx]) {
        trip.checklist[idx].done = !trip.checklist[idx].done;
        saveAppState();
        renderBudgetAndChecklist();
      }
    }

    function deleteChecklistItem(idx) {
      const trip = getActiveTrip();
      trip.checklist.splice(idx, 1);
      saveAppState();
      renderBudgetAndChecklist();
    }

    /*************************************************************************
     * 11. ARCHIVE POSTER, PIN LOCK & PWA ICON (Dela Gothic One "旅")
     *************************************************************************/
    function openArchiveModal() {
      const trip = getActiveTrip();
      const canvas = document.getElementById("archiveCanvas");
      const ctx = canvas.getContext("2d");
      const W = canvas.width, H = canvas.height;

      const outerSwatch = OUTER_SWATCHES.find(s => s.id === appState.outerSwatchId) || OUTER_SWATCHES[0];
      ctx.fillStyle = outerSwatch.bg;
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = outerSwatch.text;
      ctx.font = "900 54px 'Noto Sans TC', sans-serif";
      ctx.fillText(trip.title, 84, 160);

      ctx.font = "700 26px 'JetBrains Mono', monospace";
      ctx.globalAlpha = 0.75;
      ctx.fillText(`DEPARTURE // ${trip.startDate || "ARCHIVE"} · ${trip.days.length} DAYS`, 84, 215);
      ctx.globalAlpha = 1;

      let y = 280;
      trip.days.forEach((d, dIdx) => {
        if (y > 1680) return;
        drawRoundedRect(ctx, 84, y, W - 168, 72, 16, "rgba(255,255,255,0.12)");
        ctx.fillStyle = outerSwatch.text;
        ctx.font = "800 28px 'JetBrains Mono', monospace";
        ctx.fillText(`DAY 0${dIdx + 1}   ${d.weatherText || ""}`, 114, y + 46);
        y += 96;

        d.items.filter(i => i.status !== "cancelled").forEach(item => {
          if (y > 1720) return;
          ctx.fillStyle = outerSwatch.text;
          ctx.font = "700 26px 'JetBrains Mono', monospace";
          ctx.fillText(`${item.startTime}`, 114, y);
          ctx.font = "800 30px 'Noto Sans TC', sans-serif";
          ctx.fillText(`${item.title} ${item.mood || ""}`, 230, y);
          const sub = formatItemSubtitle(item);
          if (sub) {
            y += 38;
            ctx.font = "500 23px 'Noto Sans TC', sans-serif";
            ctx.globalAlpha = 0.75;
            ctx.fillText(sub.slice(0, 36), 230, y);
            ctx.globalAlpha = 1;
          }
          y += 58;
        });
        y += 20;
      });

      ctx.fillStyle = outerSwatch.text;
      ctx.globalAlpha = 0.42;
      ctx.font = "400 22px 'Dela Gothic One', sans-serif";
      ctx.textAlign = "right";
      ctx.fillText("TABIGRAM", W - 84, 1830);
      ctx.textAlign = "left";
      ctx.globalAlpha = 1;

      document.getElementById("archivePreviewImg").src = canvas.toDataURL("image/png");
      document.getElementById("archiveModal").classList.add("open");
    }

    function closeArchiveModal() {
      document.getElementById("archiveModal").classList.remove("open");
    }

    async function shareOrSaveArchiveImage() {
      const canvas = document.getElementById("archiveCanvas");
      await shareCanvasViaNativeOrDownload(canvas, `tabigram-archive-${Date.now()}.png`);
    }

    function openPinModal() {
      const current = appState.pinCode || "";
      const input = prompt(current ? "輸入新 4 位數密碼（留空可解除密碼鎖）：" : "設定 4 位數隱私密碼鎖：", current);
      if (input === null) return;
      appState.pinCode = input.trim();
      saveAppState();
      alert(appState.pinCode ? "已啟用密碼鎖保護。" : "已解除密碼鎖。");
    }

    function exportBackupJSON() {
      const blob = new Blob([JSON.stringify(appState, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `tabigram-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
    }

    function importBackupJSON(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (parsed && Array.isArray(parsed.trips)) {
            appState = Object.assign(appState, parsed);
            saveAppState();
            renderAll();
            alert("成功匯入旅行備份！");
          }
        } catch (err) {
          alert("JSON 檔案格式不正確。");
        }
      };
      reader.readAsText(file);
      e.target.value = "";
    }

    // Mount Apple Touch Icon using Dela Gothic One font
    async function mountAppleTouchIcon() {
      try {
        if (document.fonts && document.fonts.load) {
          await document.fonts.load("400 300px 'Dela Gothic One'");
        }
      } catch (e) {}
      const c = document.createElement("canvas");
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#141413";
      ctx.fillRect(0, 0, 512, 512);
      ctx.fillStyle = "#F6F3EC";
      ctx.font = "400 290px 'Dela Gothic One', 'Noto Sans TC', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("旅", 256, 266);
      const link = document.createElement("link");
      link.rel = "apple-touch-icon";
      link.href = c.toDataURL("image/png");
      document.head.appendChild(link);
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function drawRoundedRectPath(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawRoundedRect(ctx, x, y, w, h, r, fill) {
      drawRoundedRectPath(ctx, x, y, w, h, r);
      ctx.fillStyle = fill;
      ctx.fill();
    }

    function loadImageElement(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    // Boot
    window.addEventListener("DOMContentLoaded", () => {
      mountAppleTouchIcon();
      loadAppState();
      if (appState.pinCode) {
        const entered = prompt("請輸入 TABIGRAM 解鎖密碼：");
        if (entered !== appState.pinCode) {
          document.body.innerHTML = "<div style='padding:60px 20px; text-align:center; font-weight:800;'>🔒 密碼錯誤，請重新整理頁面再試。</div>";
          return;
        }
      }
      initFormSelectors();
      renderAll();
      refreshRealtimeWeather();
      // Keep the green NOW dot on the solar track live-updated every 30 seconds
      setInterval(updateSolarTrackDots, 30000);
    });
  </script>
